<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Contas a pagar e receber - JG Sistemas</title>
    <link rel="stylesheet" href="/ui/jg.css">
    <style>
        .filtros .campo { width: 160px; }
        tr.vencida td:first-child { box-shadow: inset 3px 0 0 var(--red); }
    </style>
</head>
<body class="jg" data-pagina="financeiro">
    <main>
        <div class="page-head">
            <div><h1>Contas a pagar e receber</h1><div class="sub">Lançamentos, baixas e vencimentos</div></div>
            <div class="acoes">
                <a class="btn" href="/financeiro-visao.html"><span class="ms">monitoring</span>Visão geral</a>
                <button class="btn btn-sucesso" onclick="abrirModalConta()"><span class="ms">add</span>Nova conta</button>
            </div>
        </div>

        <div class="abas">
            <button class="aba ativa" data-tipo="receber"><span class="ms sm">call_received</span>A receber <span class="contador" id="cont-receber">0</span></button>
            <button class="aba" data-tipo="pagar"><span class="ms sm">call_made</span>A pagar <span class="contador" id="cont-pagar">0</span></button>
        </div>

        <div class="kpis" id="kpis"></div>

        <div class="card">
            <div class="card-body" style="padding-bottom:0">
                <div class="filtros">
                    <div class="chips" id="chips-status">
                        <button class="chip ativo" data-status="ABERTAS">Em aberto</button>
                        <button class="chip" data-status="PENDING">Pendentes</button>
                        <button class="chip" data-status="OVERDUE">Vencidas</button>
                        <button class="chip" data-status="PAID">Baixadas</button>
                        <button class="chip" data-status="CANCELLED">Canceladas</button>
                        <button class="chip" data-status="">Todas</button>
                    </div>
                    <div class="campo"><label for="f-de">Vencimento de</label><input type="date" id="f-de"></div>
                    <div class="campo"><label for="f-ate">até</label><input type="date" id="f-ate"></div>
                    <div class="campo"><label for="f-categoria">Categoria</label><select id="f-categoria"><option value="">Todas</option></select></div>
                    <div class="input-icone" style="flex:1;min-width:200px"><span class="ms">search</span><input type="text" id="f-busca" placeholder="Descrição, documento, fornecedor ou cliente"></div>
                </div>
            </div>
            <div class="tabela-wrap">
                <table>
                    <thead><tr><th>Descrição</th><th id="th-pessoa">Cliente</th><th>Vencimento</th><th class="right">Valor</th><th>Categoria</th><th>Documento</th><th>Status</th><th class="acoes">Ações</th></tr></thead>
                    <tbody id="tabela-contas"><tr><td colspan="8" class="sem-dados">Carregando...</td></tr></tbody>
                    <tfoot><tr><td colspan="3">Total filtrado</td><td class="right" id="total-filtrado">R$ 0,00</td><td colspan="4"></td></tr></tfoot>
                </table>
            </div>
        </div>
    </main>

    <!-- Drawer: nova conta -->
    <div class="modal-overlay drawer" id="modal-conta">
        <div class="modal">
            <div class="modal-head"><span id="conta-titulo">Nova conta</span><span class="close" onclick="fecharModalConta()">&times;</span></div>
            <div class="modal-body">
                <div class="campo"><label>Tipo</label>
                    <div class="chips"><button type="button" class="chip" data-novo="RECEIVE"><span class="ms sm">call_received</span>A receber</button><button type="button" class="chip" data-novo="PAY"><span class="ms sm">call_made</span>A pagar</button></div>
                    <input type="hidden" id="ct-tipo"></div>
                <div class="campo"><label for="ct-descricao">Descrição *</label><input type="text" id="ct-descricao" placeholder="Ex.: Aluguel loja Out/2026"></div>
                <div class="form-grid">
                    <div class="campo"><label for="ct-valor">Valor (R$) *</label><input type="text" id="ct-valor" placeholder="0,00" inputmode="decimal"></div>
                    <div class="campo"><label for="ct-vencimento">Vencimento *</label><input type="date" id="ct-vencimento"></div>
                    <div class="campo"><label for="ct-categoria">Categoria</label><input type="text" id="ct-categoria" list="lista-categorias" placeholder="Ex.: Aluguel"><datalist id="lista-categorias"></datalist></div>
                    <div class="campo"><label for="ct-documento">Documento</label><input type="text" id="ct-documento" placeholder="Ex.: NF 1234"></div>
                </div>
                <div class="campo" id="box-fornecedor"><label for="ct-fornecedor">Fornecedor</label><select id="ct-fornecedor"><option value="">Nenhum</option></select></div>
                <div class="campo"><label for="ct-notas">Observações</label><textarea id="ct-notas" rows="3" placeholder="Anotações..."></textarea></div>
                <div class="form-grid">
                    <div class="campo"><label for="ct-repetir">Repetir (meses)</label><input type="number" id="ct-repetir" min="1" max="24" value="1"><div class="dica">Lança uma conta por mês com o mesmo valor.</div></div>
                </div>
            </div>
            <div class="modal-foot"><button class="btn" onclick="fecharModalConta()">Cancelar</button><button class="btn btn-sucesso" onclick="salvarConta()"><span class="ms">check</span>Salvar</button></div>
        </div>
    </div>

    <!-- Modal confirmação -->
    <div class="modal-overlay" id="modal-confirmar">
        <div class="modal sm">
            <div class="modal-head"><span id="cf-titulo">Confirmar</span><span class="close" onclick="fecharConfirmar()">&times;</span></div>
            <div class="modal-body"><p style="margin:0" id="cf-texto"></p></div>
            <div class="modal-foot"><button class="btn" onclick="fecharConfirmar()">Voltar</button><button class="btn" id="cf-ok">Confirmar</button></div>
        </div>
    </div>

    <script src="/seguranca.js"></script>
    <script src="/ui/shell.js"></script>
    <script>
        const $ = (id) => document.getElementById(id);
        const formatarMoeda = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        const parseMoeda = (v) => parseFloat(String(v ?? '').replace(/\./g, '').replace(',', '.')) || 0;
        const STATUS = {
            PENDING: ['Pendente', 'pendente'], OVERDUE: ['Vencido', 'vencido'],
            PAID: ['Pago', 'pago'], CANCELLED: ['Cancelado', 'cancelado']
        };
        let aba = 'receber';
        let statusFiltro = 'ABERTAS';
        const contas = { receber: [], pagar: [] };

        async function api(url, metodo = 'GET', corpo = null) {
            const opcoes = { method: metodo, headers: { 'Content-Type': 'application/json' } };
            if (corpo) opcoes.body = JSON.stringify(corpo);
            const r = await fetch(url, opcoes);
            if (r.status === 401) { localStorage.removeItem('jg_operador'); location.href = '/login.html'; throw new Error('Sessão expirada.'); }
            const d = await r.json();
            if (!r.ok) throw new Error(d.erro || 'Erro na requisição');
            return d;
        }
        (function () { const op = JG.operador(); if (op && op.papel === 'SELLER') location.href = '/'; })();

        function hoje0() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
        function vencida(c) { return (c.status === 'PENDING' || c.status === 'OVERDUE') && new Date(c.vencimento) < hoje0(); }
        function statusReal(c) { return vencida(c) ? 'OVERDUE' : c.status; }

        async function carregar() {
            try {
                const [r, p] = await Promise.all([api('/api/financeiro/receber'), api('/api/financeiro/pagar')]);
                contas.receber = r; contas.pagar = p;
                ['receber', 'pagar'].forEach(t => $('cont-' + t).textContent = contas[t].filter(c => c.status === 'PENDING' || c.status === 'OVERDUE').length);
                const cats = [...new Set([...r, ...p].map(c => c.categoria).filter(Boolean))].sort();
                const atual = $('f-categoria').value;
                $('f-categoria').innerHTML = '<option value="">Todas</option>' + cats.map(c => `<option>${esc(c)}</option>`).join('');
                $('f-categoria').value = cats.includes(atual) ? atual : '';
                $('lista-categorias').innerHTML = cats.map(c => `<option value="${esc(c)}">`).join('');
                renderizar();
            } catch (e) { JG.toast(e.message, 'erro'); }
        }

        function filtradas() {
            const de = $('f-de').value, ate = $('f-ate').value, cat = $('f-categoria').value;
            const q = $('f-busca').value.trim().toLowerCase();
            return contas[aba].filter(c => {
                const st = statusReal(c);
                if (statusFiltro === 'ABERTAS' && !(st === 'PENDING' || st === 'OVERDUE')) return false;
                if (statusFiltro && statusFiltro !== 'ABERTAS' && st !== statusFiltro) return false;
                const v = String(c.vencimento).slice(0, 10);
                if (de && v < de) return false;
                if (ate && v > ate) return false;
                if (cat && c.categoria !== cat) return false;
                if (q && ![c.descricao, c.documento, c.fornecedor, c.cliente, c.categoria].join(' ').toLowerCase().includes(q)) return false;
                return true;
            });
        }

        function renderizarKpis() {
            const lista = contas[aba];
            const abertas = lista.filter(c => c.status === 'PENDING' || c.status === 'OVERDUE');
            const venc = abertas.filter(vencida);
            const semana = abertas.filter(c => { const d = new Date(c.vencimento); const h = hoje0(); return d >= h && d < new Date(h.getTime() + 7 * 86400000); });
            const inicioMes = new Date(); inicioMes.setDate(1); inicioMes.setHours(0, 0, 0, 0);
            const pagasMes = lista.filter(c => c.status === 'PAID' && c.dataPagamento && new Date(c.dataPagamento) >= inicioMes);
            const soma = (l, k = 'valor') => l.reduce((s, c) => s + Number(c[k] || c.valor || 0), 0);
            const rec = aba === 'receber';
            $('kpis').innerHTML = [
                [rec ? 'Total a receber' : 'Total a pagar', formatarMoeda(soma(abertas)), `${abertas.length} título(s)`, rec ? 'call_received' : 'call_made', ''],
                ['Vencidas', formatarMoeda(soma(venc)), `${venc.length} título(s)`, 'event_busy', venc.length ? 'vermelho' : ''],
                ['Vencem em 7 dias', formatarMoeda(soma(semana)), `${semana.length} título(s)`, 'event_upcoming', semana.length ? 'ambar' : ''],
                [rec ? 'Recebido no mês' : 'Pago no mês', formatarMoeda(soma(pagasMes, 'valorPago')), `${pagasMes.length} baixa(s)`, 'task_alt', 'verde']
            ].map(([r, v, rod, ic, cor]) => `<div class="kpi ${cor}"><div class="kpi-top"><span>${r}</span><span class="ms">${ic}</span></div><div class="kpi-valor">${v}</div><div class="kpi-rodape">${rod}</div></div>`).join('');
        }

        function renderizar() {
            renderizarKpis();
            $('th-pessoa').textContent = aba === 'receber' ? 'Cliente' : 'Fornecedor';
            const lista = filtradas();
            const tbody = $('tabela-contas');
            $('total-filtrado').textContent = formatarMoeda(lista.reduce((s, c) => s + c.valor, 0));
            if (!lista.length) {
                tbody.innerHTML = `<tr><td colspan="8"><div class="estado-vazio"><span class="ms">receipt_long</span><p>Nenhuma conta com esses filtros.</p><button class="btn btn-sucesso" onclick="abrirModalConta()"><span class="ms">add</span>Nova conta</button></div></td></tr>`;
                return;
            }
            tbody.innerHTML = lista.map(c => {
                const st = statusReal(c);
                const [txt, cls] = STATUS[st] || [st, 'cinza'];
                const aberta = c.status === 'PENDING' || c.status === 'OVERDUE';
                const pessoa = aba === 'receber' ? (c.cliente || '—') : (c.fornecedor || '—');
                return `<tr class="${st === 'OVERDUE' ? 'vencida' : ''}">
                    <td><b>${esc(c.descricao)}</b>${c.notas ? `<br><small>${esc(c.notas)}</small>` : ''}</td>
                    <td>${esc(pessoa)}</td>
                    <td class="${st === 'OVERDUE' ? 'txt-vermelho' : ''}">${new Date(c.vencimento).toLocaleDateString('pt-BR')}</td>
                    <td class="right"><b>${formatarMoeda(c.valor)}</b>${c.status === 'PAID' && c.valorPago && c.valorPago !== c.valor ? `<br><small>pago ${formatarMoeda(c.valorPago)}</small>` : ''}</td>
                    <td>${c.categoria ? `<span class="chip" style="height:24px;cursor:default">${esc(c.categoria)}</span>` : '—'}</td>
                    <td>${esc(c.documento || (c.venda ? 'Venda ' + c.venda : '—'))}</td>
                    <td><span class="badge ${cls}">${txt}</span>${c.status === 'PAID' && c.dataPagamento ? `<br><small>${new Date(c.dataPagamento).toLocaleDateString('pt-BR')}</small>` : ''}</td>
                    <td class="acoes">${aberta ? `
                        <button class="btn-icone" style="color:var(--green)" title="Dar baixa" onclick="baixarConta('${c.id}')"><span class="ms">task_alt</span></button>
                        <button class="btn-icone perigo" title="Cancelar" onclick="cancelarConta('${c.id}')"><span class="ms">cancel</span></button>` : ''}</td>
                </tr>`;
            }).join('');
        }

        function trocarAba(t) {
            aba = t;
            document.querySelectorAll('[data-tipo]').forEach(b => b.classList.toggle('ativa', b.dataset.tipo === t));
            history.replaceState(null, '', '#' + t);
            renderizar();
        }
        document.querySelectorAll('[data-tipo]').forEach(b => b.addEventListener('click', () => trocarAba(b.dataset.tipo)));
        document.querySelectorAll('[data-status]').forEach(b => b.addEventListener('click', () => {
            statusFiltro = b.dataset.status;
            document.querySelectorAll('[data-status]').forEach(x => x.classList.toggle('ativo', x === b));
            renderizar();
        }));
        ['f-de', 'f-ate', 'f-categoria', 'f-busca'].forEach(id => $(id).addEventListener('input', renderizar));

        // ---------- confirmação
        function confirmar(titulo, texto, rotulo, cls) {
            return new Promise(resolve => {
                $('cf-titulo').textContent = titulo; $('cf-texto').textContent = texto;
                $('cf-ok').textContent = rotulo; $('cf-ok').className = 'btn ' + cls;
                $('cf-ok').onclick = () => { window._cfResolve = null; fecharConfirmar(); resolve(true); };
                window._cfResolve = resolve;
                $('modal-confirmar').classList.add('active');
            });
        }
        function fecharConfirmar() { $('modal-confirmar').classList.remove('active'); if (window._cfResolve) { window._cfResolve(false); window._cfResolve = null; } }

        async function baixarConta(id) {
            const c = contas[aba].find(x => x.id === id);
            if (!await confirmar(aba === 'receber' ? 'Dar baixa (recebimento)' : 'Dar baixa (pagamento)', `${c.descricao} · ${formatarMoeda(c.valor)}`, 'Dar baixa', 'btn-sucesso')) return;
            try { await api(`/api/financeiro/baixar/${id}`, 'POST'); JG.toast('Baixa registrada.', 'sucesso'); await carregar(); }
            catch (e) { JG.toast(e.message, 'erro'); }
        }
        async function cancelarConta(id) {
            const c = contas[aba].find(x => x.id === id);
            if (!await confirmar('Cancelar conta', `Cancelar "${c.descricao}" de ${formatarMoeda(c.valor)}?`, 'Cancelar conta', 'btn-perigo')) return;
            try { await api(`/api/financeiro/transacao/${id}`, 'DELETE'); JG.toast('Conta cancelada.', 'sucesso'); await carregar(); }
            catch (e) { JG.toast(e.message, 'erro'); }
        }

        // ---------- nova conta
        function definirTipoNovo(tipo) {
            $('ct-tipo').value = tipo;
            document.querySelectorAll('[data-novo]').forEach(b => b.classList.toggle('ativo', b.dataset.novo === tipo));
            $('box-fornecedor').classList.toggle('hidden', tipo !== 'PAY');
            $('conta-titulo').textContent = tipo === 'RECEIVE' ? 'Nova conta a receber' : 'Nova conta a pagar';
        }
        document.querySelectorAll('[data-novo]').forEach(b => b.addEventListener('click', () => definirTipoNovo(b.dataset.novo)));
        let fornecedoresCarregados = false;
        async function abrirModalConta(tipo) {
            definirTipoNovo(tipo || (aba === 'pagar' ? 'PAY' : 'RECEIVE'));
            ['ct-descricao', 'ct-valor', 'ct-categoria', 'ct-documento', 'ct-notas'].forEach(i => $(i).value = '');
            $('ct-vencimento').value = new Date().toISOString().slice(0, 10);
            $('ct-repetir').value = 1;
            $('ct-fornecedor').value = '';
            $('modal-conta').classList.add('active');
            setTimeout(() => $('ct-descricao').focus(), 60);
            if (!fornecedoresCarregados) {
                try {
                    const f = await api('/api/fornecedores');
                    $('ct-fornecedor').innerHTML = '<option value="">Nenhum</option>' + f.map(x => `<option value="${esc(x.id)}">${esc(x.nome)}</option>`).join('');
                    fornecedoresCarregados = true;
                } catch (e) { /* módulo de estoque pode estar desligado */ }
            }
        }
        function fecharModalConta() { $('modal-conta').classList.remove('active'); }
        async function salvarConta() {
            const base = {
                tipo: $('ct-tipo').value,
                descricao: $('ct-descricao').value.trim(),
                valor: parseMoeda($('ct-valor').value),
                vencimento: $('ct-vencimento').value,
                categoria: $('ct-categoria').value.trim(),
                documento: $('ct-documento').value.trim(),
                notas: $('ct-notas').value.trim(),
                fornecedorId: $('ct-tipo').value === 'PAY' ? ($('ct-fornecedor').value || null) : null
            };
            if (!base.descricao) { JG.toast('Informe a descrição.', 'alerta'); return; }
            if (!base.valor || base.valor <= 0) { JG.toast('Informe um valor válido.', 'alerta'); return; }
            if (!base.vencimento) { JG.toast('Informe o vencimento.', 'alerta'); return; }
            const meses = Math.max(1, Math.min(24, parseInt($('ct-repetir').value) || 1));
            try {
                for (let i = 0; i < meses; i++) {
                    const d = new Date(base.vencimento + 'T00:00:00');
                    d.setMonth(d.getMonth() + i);
                    const venc = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                    await api('/api/financeiro/transacao', 'POST', { ...base, vencimento: venc, descricao: meses > 1 ? `${base.descricao} (${i + 1}/${meses})` : base.descricao });
                }
                fecharModalConta();
                JG.toast(meses > 1 ? `${meses} contas lançadas.` : 'Conta lançada.', 'sucesso');
                trocarAba(base.tipo === 'RECEIVE' ? 'receber' : 'pagar');
                await carregar();
            } catch (e) { JG.toast(e.message, 'erro'); }
        }

        (async () => {
            const h = location.hash.slice(1);
            if (h === 'pagar' || h === 'receber') trocarAba(h);
            await carregar();
            if (new URLSearchParams(location.search).get('nova')) abrirModalConta();
        })();
    </script>
</body>
</html>
