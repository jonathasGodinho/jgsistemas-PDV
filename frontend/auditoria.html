<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Auditoria - JG Sistemas</title>
    <style>
        .filtros .campo { width: 170px; }
        .filtros .campo.largo { width: 220px; }
        .acao { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--primary); background: var(--primary-soft); border-radius: 4px; padding: 2px 6px; }
        .detalhe { font-size: 12px; color: var(--text-2); font-family: var(--mono); background: var(--surface-2); border-radius: 4px; padding: 3px 6px; display: inline-block; max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
        .ip { font-size: 12px; color: var(--text-2); font-family: var(--mono); }
        .resumo-falhas { display: none; margin-bottom: 14px; }
    </style>
    <link rel="stylesheet" href="/ui/jg.css">
</head>
<body class="jg" data-pagina="auditoria">
    <main>
        <div class="page-head">
            <div><h1>Auditoria</h1><div class="sub">Operações sensíveis e acessos ao sistema</div></div>
        </div>

        <div class="card mb-16">
            <div class="card-head"><h3><span class="ms" style="color:var(--primary)">shield_person</span> Operações sensíveis</h3></div>
            <div class="card-body" style="padding-bottom:0">
                <div class="filtros">
                    <div class="campo"><label for="f-de">De</label><input type="date" id="f-de"></div>
                    <div class="campo"><label for="f-ate">Até</label><input type="date" id="f-ate"></div>
                    <div class="campo largo"><label for="f-usuario">Operador</label><input type="text" id="f-usuario" placeholder="Nome do operador"></div>
                    <div class="campo largo"><label for="f-acao">Ação</label><input type="text" id="f-acao" placeholder="Ex.: VENDA_CANCELADA" list="lista-acoes">
                        <datalist id="lista-acoes"><option value="VENDA_CANCELADA"><option value="DESCONTO_ACIMA_LIMITE"><option value="SANGRIA"><option value="SUPRIMENTO"><option value="ESTOQUE_AJUSTE"><option value="LIMITE_CREDITO_ATUALIZADO"><option value="COMPRA_RECEBIDA"></datalist></div>
                    <button class="btn btn-primario" onclick="carregarLogs()"><span class="ms">filter_alt</span>Filtrar</button>
                </div>
            </div>
            <div class="tabela-wrap">
                <table>
                    <thead><tr><th>Data</th><th>Operador</th><th>Ação</th><th>Entidade</th><th>Detalhe</th><th>IP</th></tr></thead>
                    <tbody id="tabela-logs"><tr><td colspan="6" class="sem-dados">Carregando...</td></tr></tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <div class="card-head"><h3><span class="ms" style="color:var(--primary)">login</span> Acessos ao sistema</h3></div>
            <div class="card-body" style="padding-bottom:0">
                <div class="alerta vermelho resumo-falhas" id="resumo-falhas"></div>
                <div class="filtros">
                    <div class="campo"><label for="lf-de">De</label><input type="date" id="lf-de"></div>
                    <div class="campo"><label for="lf-ate">Até</label><input type="date" id="lf-ate"></div>
                    <div class="campo largo"><label for="lf-usuario">Operador / identificador</label><input type="text" id="lf-usuario" placeholder="Nome ou e-mail"></div>
                    <div class="campo"><label for="lf-resultado">Resultado</label>
                        <select id="lf-resultado" onchange="carregarLogins()"><option value="">Todos</option><option value="sucesso">Sucesso</option><option value="falha">Falha</option><option value="suspeito">Suspeito</option></select></div>
                    <button class="btn btn-primario" onclick="carregarLogins()"><span class="ms">filter_alt</span>Filtrar</button>
                </div>
            </div>
            <div class="tabela-wrap">
                <table>
                    <thead><tr><th>Data</th><th>Operador</th><th>Identificador</th><th>Resultado</th><th>Detalhe</th><th>IP</th></tr></thead>
                    <tbody id="tabela-logins"><tr><td colspan="6" class="sem-dados">Carregando...</td></tr></tbody>
                </table>
            </div>
        </div>
    </main>
    <script src="/seguranca.js"></script>
    <script src="/ui/shell.js"></script>
    <script>
        const API_BASE = '';
        const formatarDataHora = d => new Date(d).toLocaleString('pt-BR');

        function obterOperador() {
            try {
                const raw = localStorage.getItem('jg_operador');
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }
        function tokenAuth() {
            const op = obterOperador();
            return op && op.token ? { 'Authorization': 'Bearer ' + op.token } : {};
        }
        function bloquear() {
            const op = obterOperador();
            if (!op) { window.location.href = '/login.html'; return true; }
            if (op.papel === 'SELLER') { window.location.href = '/'; return true; }
            return false;
        }
        async function api(url, metodo = 'GET', corpo = null) {
            const opcoes = { method: metodo, headers: Object.assign({ 'Content-Type': 'application/json' }, tokenAuth()) };
            if (corpo) opcoes.body = JSON.stringify(corpo);
            const response = await fetch(`${API_BASE}${url}`, opcoes);
            if (response.status === 401) {
                localStorage.removeItem('jg_operador');
                window.location.href = '/login.html';
                throw new Error('Sessão expirada.');
            }
            const dados = await response.json();
            if (!response.ok) throw new Error(dados.erro || 'Erro na requisição');
            return dados;
        }
        bloquear();

        function esc(s) {
            if (s === null || s === undefined) return '';
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        async function carregarLogins() {
            try {
                const params = new URLSearchParams();
                const de = document.getElementById('lf-de').value;
                const ate = document.getElementById('lf-ate').value;
                const usuario = document.getElementById('lf-usuario').value.trim();
                const resultado = document.getElementById('lf-resultado').value;
                if (de) params.set('de', de);
                if (ate) params.set('ate', ate);
                if (usuario) params.set('usuario', usuario);
                if (resultado) params.set('resultado', resultado);
                const query = params.toString();

                const dados = await api('/api/auth/logins' + (query ? '?' + query : ''));
                const resumo = document.getElementById('resumo-falhas');
                if (dados.falhas24h > 0) {
                    resumo.style.display = 'flex';
                    resumo.innerText = `⚠ ${dados.falhas24h} tentativa(s) de login com senha errada nas últimas 24 horas.`;
                } else {
                    resumo.style.display = 'none';
                }

                const tbody = document.getElementById('tabela-logins');
                if (!dados.logs || dados.logs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="sem-dados">Nenhum acesso registrado</td></tr>';
                    return;
                }
                tbody.innerHTML = dados.logs.map(l => {
                    const badge = l.suspeito ? '<span class="badge b-amarelo">Suspeito</span>'
                        : l.success ? '<span class="badge b-verde">Sucesso</span>'
                        : '<span class="badge b-vermelho">Falha</span>';
                    return `
                    <tr>
                        <td>${formatarDataHora(l.data)}</td>
                        <td><strong>${esc(l.operador || '-')}</strong></td>
                        <td>${esc(l.identificador || '-')}</td>
                        <td>${badge}</td>
                        <td><span class="detalhe" title="${esc(l.detail || '')}">${esc(l.detail || '-')}</span></td>
                        <td><span class="ip">${esc(l.ip || '-')}</span></td>
                    </tr>`;
                }).join('');
            } catch (e) { alert(e.message); }
        }

        carregarLogs();
        carregarLogins();

        const ENTIDADES = { COMPANY: 'Empresa', SALE: 'Venda', PRODUCT: 'Produto', CUSTOMER: 'Cliente', USER: 'Usuário', CASH_REGISTER: 'Caixa', CAIXA: 'Caixa', STOCK: 'Estoque', SETTING: 'Configuração', SUPPLIER: 'Fornecedor', PURCHASE: 'Compra', FINANCIAL: 'Financeiro', CATEGORY: 'Categoria', INSTALLMENT: 'Parcela', NFCE: 'NFC-e' };
        const ROTULOS = { cnpj: 'CNPJ', titular: 'Titular', validoAte: 'Válido até', total: 'Total', motivo: 'Motivo', numero: 'Nº', valor: 'Valor', antes: 'Antes', depois: 'Depois', quantidade: 'Qtd', produto: 'Produto', cliente: 'Cliente' };
        // Ação: VENDA_CANCELADA -> "Venda cancelada"
        function nomeAcao(a) { const t = String(a || '').toLowerCase().replace(/_/g, ' ').replace(/nfce/g, 'NFC-e'); return t.charAt(0).toUpperCase() + t.slice(1); }
        function valorDetalhe(v) {
            if (v === null || v === undefined || v === '') return '—';
            if (typeof v === 'boolean') return v ? 'sim' : 'não';
            if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(v)) return new Date(v).toLocaleString('pt-BR');
            if (typeof v === 'object') return Array.isArray(v) ? v.map(valorDetalhe).join(', ') : Object.entries(v).map(([k, x]) => `${ROTULOS[k] || k}: ${valorDetalhe(x)}`).join('; ');
            return String(v);
        }
        function textoDetalhe(d) {
            if (!d || (typeof d === 'object' && !Object.keys(d).length)) return '-';
            if (typeof d !== 'object') return String(d);
            return Object.entries(d).map(([k, v]) => `${ROTULOS[k] || k}: ${valorDetalhe(v)}`).join(' · ');
        }

        async function carregarLogs() {
            try {
                const params = new URLSearchParams();
                const de = document.getElementById('f-de').value;
                const ate = document.getElementById('f-ate').value;
                const usuario = document.getElementById('f-usuario').value.trim();
                const acao = document.getElementById('f-acao').value.trim();
                if (de) params.set('de', de);
                if (ate) params.set('ate', ate);
                if (usuario) params.set('usuario', usuario);
                if (acao) params.set('acao', acao);
                const query = params.toString();

                const logs = await api('/api/auditoria' + (query ? '?' + query : ''));
                const tbody = document.getElementById('tabela-logs');
                if (logs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="sem-dados">Nenhum registro encontrado</td></tr>';
                    return;
                }
                tbody.innerHTML = logs.map(l => `
                    <tr>
                        <td>${formatarDataHora(l.data)}</td>
                        <td><strong>${esc(l.operador)}</strong></td>
                        <td><span class="acao" title="${esc(l.acao)}">${esc(nomeAcao(l.acao))}</span></td>
                        <td>${esc(ENTIDADES[l.entidade] || l.entidade || '-')}${l.entidadeId ? `<br><small style="color:var(--text-3);">${esc(l.entidadeId)}</small>` : ''}</td>
                        <td><span class="detalhe" title="${esc(textoDetalhe(l.detalhe))}">${esc(textoDetalhe(l.detalhe))}</span></td>
                        <td><span class="ip">${esc(l.ip || '-')}</span></td>
                    </tr>`).join('');
            } catch (e) { alert(e.message); }
        }
    </script>
</body>
</html>
