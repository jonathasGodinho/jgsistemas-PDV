<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Controle de Estoque - JG Sistemas</title>
    <style>
        .mov-lista { max-height: 640px; overflow-y: auto; }
        .mov { display: flex; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
        .mov:last-child { border-bottom: 0; }
        .mov .ic { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .mov .ic .ms { font-size: 18px; }
        .mov .ic.in { background: var(--green-soft); color: var(--green); }
        .mov .ic.out { background: var(--red-soft); color: var(--red); }
        .mov .ic.adj { background: var(--amber-soft); color: var(--amber); }
        .mov .ic.sale { background: var(--primary-soft); color: var(--primary); }
        .mov .corpo { flex: 1; min-width: 0; }
        .mov .corpo b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .mov .corpo small { color: var(--text-2); }
        .mov .qtd { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
        #chip-falta.ativo { background: var(--red-soft); border-color: var(--red); color: var(--red); }
    </style>
    <link rel="stylesheet" href="/ui/jg.css">
</head>
<body class="jg" data-pagina="estoque">
    <main>
        <div class="page-head">
            <div><h1>Posição de estoque</h1><div class="sub" id="resumo-estoque">Carregando...</div></div>
            <div class="acoes">
                <button class="btn btn-sucesso" onclick="abrirModalMovimento('entrada')"><span class="ms">add_circle</span>Entrada</button>
                <button class="btn btn-perigo" onclick="abrirModalMovimento('saida')"><span class="ms">remove_circle</span>Saída</button>
                <button class="btn btn-primario" onclick="abrirModalMovimento('ajuste')"><span class="ms">tune</span>Ajuste</button>
            </div>
        </div>

        <div class="grid g-main-side" style="align-items:start;grid-template-columns:minmax(0,1fr) 380px">
            <div class="card">
                <div class="card-body" style="padding-bottom:0">
                    <div class="filtros">
                        <div class="input-icone" style="flex:1;min-width:240px"><span class="ms">search</span><input type="text" id="busca" placeholder="Buscar por código, SKU ou nome"></div>
                        <button class="chip" onclick="filtrarFalta()" id="btn-falta"><span class="ms sm">warning</span>Somente em falta</button>
                        <span id="chip-falta" class="hidden"></span>
                    </div>
                </div>
                <div class="tabela-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Produto</th>
                                <th class="right">Estoque</th>
                                <th class="right">Mínimo</th>
                                <th class="right">Máximo</th>
                                <th>Situação</th>
                                <th class="acoes"></th>
                            </tr>
                        </thead>
                        <tbody id="tabela-estoque">
                            <tr><td colspan="7" class="sem-dados">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <div class="card-head"><h3>Últimas movimentações</h3></div>
                <div class="mov-lista" id="tabela-movimentos"><div class="sem-dados">Carregando...</div></div>
            </div>
        </div>
    </main>
    <!-- Modal de movimentação -->
    <div class="modal-overlay" id="modal-movimento">
        <div class="modal">
            <div class="modal-head">
                <span id="modal-titulo">Entrada de estoque</span>
                <span class="close" onclick="fecharModalMovimento()">&times;</span>
            </div>
            <div class="modal-body">
                <input type="hidden" id="m-tipo">
                <div class="campo"><label for="m-filtro">Produto *</label>
                    <div class="input-icone mb-16" style="margin-bottom:6px"><span class="ms">search</span><input type="text" id="m-filtro" placeholder="Filtrar por código, SKU ou nome"></div>
                    <select id="m-produto" size="5" style="height:auto;padding:4px"></select>
                    <div class="dica" id="m-atual"></div>
                </div>
                <div class="form-grid">
                    <div class="campo"><label id="m-label-qtd" for="m-quantidade">Quantidade *</label><input type="number" id="m-quantidade" min="1" step="1" placeholder="0" style="font-size:18px;height:46px"></div>
                    <div class="campo"><label for="m-motivo-sel">Motivo</label>
                        <select id="m-motivo-sel"><option value="">Selecione...</option><option>Compra de fornecedor</option><option>Reposição</option><option>Devolução de cliente</option><option>Quebra / avaria</option><option>Uso interno</option><option>Contagem / inventário</option><option value="outro">Outro...</option></select></div>
                </div>
                <div class="campo hidden" id="box-motivo"><label for="m-motivo">Descreva o motivo</label><input type="text" id="m-motivo" placeholder="Ex.: brinde para cliente"></div>
            </div>
            <div class="modal-foot">
                <button class="btn" onclick="fecharModalMovimento()">Cancelar</button>
                <button class="btn btn-sucesso" onclick="salvarMovimento()" id="btn-salvar">Confirmar</button>
            </div>
        </div>
    </div>

    <script src="/seguranca.js"></script>
    <script src="/ui/shell.js"></script>
    <script>
        const API_BASE = '';
        let estoque = [];
        let somenteFalta = false;

        function formatarQtd(n) { return String(Number(n).toFixed(0)).padStart(6, '0'); }

        function obterOperador() {
            try {
                const raw = localStorage.getItem('jg_operador');
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }

        function tokenAuth() {
            const op = obterOperador();
            return op && op.token ? { 'Authorization': 'Bearer ' + op.token } : {};
        }

        function bloquearCaixa() {
            const op = obterOperador();
            if (!op) { window.location.href = '/login.html'; return true; }
            if (op.papel === 'SELLER') { window.location.href = '/'; return true; }
            return false;
        }

        async function api(url, metodo = 'GET', corpo = null) {
            const opcoes = { method: metodo, headers: Object.assign({ 'Content-Type': 'application/json' }, tokenAuth()) };
            if (corpo) opcoes.body = JSON.stringify(corpo);
            const response = await fetch(`${API_BASE}${url}`, opcoes);
            if (response.status === 401) {
                localStorage.removeItem('jg_operador');
                window.location.href = '/login.html';
                throw new Error('Sessão expirada.');
            }
            const dados = await response.json();
            if (!response.ok) throw new Error(dados.erro || 'Erro na requisição');
            return dados;
        }

        bloquearCaixa();

        async function buscarEstoque() {
            const busca = document.getElementById('busca').value.trim();
            let url = '/api/estoque';
            const params = [];
            if (busca) params.push(`busca=${encodeURIComponent(busca)}`);
            if (somenteFalta) params.push('baixo=true');
            if (params.length) url += '?' + params.join('&');
            try {
                estoque = await api(url);
                renderizarEstoque();
            } catch (e) { alert(e.message); }
        }

        function renderizarEstoque() {
            const tbody = document.getElementById('tabela-estoque');
            if (estoque.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7"><div class="estado-vazio"><span class="ms">${somenteFalta ? 'check_circle' : 'warehouse'}</span><p>${somenteFalta ? 'Nenhum produto em falta.' : 'Nenhum produto encontrado.'}</p></div></td></tr>`;
                document.getElementById('resumo-estoque').innerText = somenteFalta ? 'Somente produtos em falta' : 'Nenhum produto';
                return;
            }
            const emFalta = estoque.filter(p => p.situacao !== 'OK').length;
            document.getElementById('resumo-estoque').innerText = `${estoque.length} produto(s) · ${emFalta} abaixo do mínimo ou sem estoque`;
            tbody.innerHTML = estoque.map(p => {
                const sit = p.situacao === 'OK' ? '<span class="badge ativo">Normal</span>'
                    : p.situacao === 'BAIXO' ? '<span class="badge baixo">Baixo</span>'
                    : '<span class="badge em-falta">Em falta</span>';
                return `
                <tr>
                    <td class="num">${esc(p.codigo || '—')}</td>
                    <td><b>${esc(p.nome)}</b>${p.grade ? ' <span class="badge azul sem-ponto">' + esc(p.grade) + '</span>' : ''}<br><small>${esc(p.sku || '')}</small></td>
                    <td class="right"><b class="${p.situacao === 'OK' ? '' : p.situacao === 'BAIXO' ? 'txt-ambar' : 'txt-vermelho'}">${formatarQtd(p.quantidade)}</b></td>
                    <td class="right">${formatarQtd(p.minimo)}</td>
                    <td class="right">${formatarQtd(p.maximo)}</td>
                    <td>${sit}</td>
                    <td class="acoes"><button class="btn-icone" title="Entrada deste produto" onclick="abrirModalMovimento('entrada', '${p.produtoId || p.id}')"><span class="ms">add_circle</span></button></td>
                </tr>`;
            }).join('');
        }

        function filtrarFalta() {
            somenteFalta = !somenteFalta;
            document.getElementById('btn-falta').classList.toggle('ativo', somenteFalta);
            buscarEstoque();
        }

        const TIPOS = {
            entrada: { titulo: 'Entrada de estoque', btn: 'Confirmar entrada', qtd: 'Quantidade a entrar *', cls: 'btn-sucesso' },
            saida: { titulo: 'Saída de estoque', btn: 'Confirmar saída', qtd: 'Quantidade a sair *', cls: 'btn-perigo' },
            ajuste: { titulo: 'Ajuste de estoque', btn: 'Confirmar ajuste', qtd: 'Nova quantidade em estoque *', cls: 'btn-primario' }
        };

        let produtosMov = [];
        function filtrarProdutosMov() {
            const q = document.getElementById('m-filtro').value.trim().toLowerCase();
            const select = document.getElementById('m-produto');
            const atual = select.value;
            const lista = produtosMov.filter(p => !q || [p.codigo, p.sku, p.nome].join(' ').toLowerCase().includes(q)).slice(0, 200);
            select.innerHTML = lista.map(p => `<option value="${esc(p.id)}">${esc(p.codigo || p.sku || '')} — ${esc(p.nome)}</option>`).join('');
            if (lista.some(p => p.id === atual)) select.value = atual;
            else if (lista.length === 1) select.value = lista[0].id;
            mostrarAtual();
        }
        function mostrarAtual() {
            const p = produtosMov.find(x => x.id === document.getElementById('m-produto').value);
            document.getElementById('m-atual').innerHTML = p ? `Estoque atual: <b>${formatarQtd(p.estoque)}</b>${p.minimo ? ` · mínimo ${formatarQtd(p.minimo)}` : ''}` : '';
        }
        document.getElementById('m-filtro').addEventListener('input', filtrarProdutosMov);
        document.getElementById('m-filtro').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('m-quantidade').focus(); } });
        document.getElementById('m-produto').addEventListener('change', mostrarAtual);
        document.getElementById('m-motivo-sel').addEventListener('change', (e) => {
            document.getElementById('box-motivo').classList.toggle('hidden', e.target.value !== 'outro');
            if (e.target.value === 'outro') document.getElementById('m-motivo').focus();
        });

        async function abrirModalMovimento(tipo, produtoId) {
            document.getElementById('m-tipo').value = tipo;
            const conf = TIPOS[tipo];
            document.getElementById('modal-titulo').innerText = conf.titulo;
            document.getElementById('btn-salvar').innerText = conf.btn;
            document.getElementById('btn-salvar').className = 'btn ' + conf.cls;
            document.getElementById('m-motivo-sel').value = '';
            document.getElementById('box-motivo').classList.add('hidden');
            document.getElementById('m-filtro').value = '';
            document.getElementById('m-label-qtd').innerText = conf.qtd;
            document.getElementById('m-quantidade').value = '';
            document.getElementById('m-motivo').value = '';

            const select = document.getElementById('m-produto');
            if (!produtosMov.length) {
                try { produtosMov = await api('/api/produtos?todos=1'); } catch (e) { alert(e.message); return; }
            }
            filtrarProdutosMov();
            select.value = produtoId || '';
            mostrarAtual();
            document.getElementById('modal-movimento').classList.add('active');
            setTimeout(() => document.getElementById(produtoId ? 'm-quantidade' : 'm-filtro').focus(), 50);
        }

        function fecharModalMovimento() {
            document.getElementById('modal-movimento').classList.remove('active');
        }

        async function salvarMovimento() {
            const tipo = document.getElementById('m-tipo').value;
            const corpo = {
                produtoId: document.getElementById('m-produto').value,
                quantidade: Number(document.getElementById('m-quantidade').value),
                motivo: document.getElementById('m-motivo-sel').value === 'outro'
                    ? document.getElementById('m-motivo').value.trim()
                    : document.getElementById('m-motivo-sel').value
            };
            if (!corpo.produtoId) { alert("Selecione o produto!"); return; }
            if (!corpo.quantidade || corpo.quantidade <= 0) { alert("Informe a quantidade!"); return; }

            try {
                const r = await api(`/api/estoque/${tipo}`, 'POST', corpo);
                JG.toast(`${TIPOS[tipo].titulo} registrada. Novo estoque: ${formatarQtd(r.novaQuantidade)}`, 'sucesso');
                produtosMov = [];
                fecharModalMovimento();
                await Promise.all([buscarEstoque(), buscarMovimentos()]);
            } catch (e) { alert(e.message); }
        }

        const TIPOS_MOV = {
            IN: { txt: 'Entrada', cls: 'in', ic: 'south_west' },
            OUT: { txt: 'Saída', cls: 'out', ic: 'north_east' },
            ADJUSTMENT: { txt: 'Ajuste', cls: 'adj', ic: 'tune' },
            SALE: { txt: 'Venda', cls: 'sale', ic: 'point_of_sale' },
            PURCHASE: { txt: 'Compra', cls: 'in', ic: 'local_shipping' },
            RETURN: { txt: 'Devolução', cls: 'adj', ic: 'undo' },
            TRANSFER_IN: { txt: 'Transf. entrada', cls: 'in', ic: 'south_west' },
            TRANSFER_OUT: { txt: 'Transf. saída', cls: 'out', ic: 'north_east' }
        };

        async function buscarMovimentos() {
            try {
                const movs = await api('/api/estoque/movimentacoes');
                const tbody = document.getElementById('tabela-movimentos');
                if (movs.length === 0) {
                    tbody.innerHTML = '<div class="estado-vazio"><span class="ms">swap_vert</span><p>Nenhuma movimentação registrada.</p></div>';
                    return;
                }
                tbody.innerHTML = movs.slice(0, 60).map(m => {
                    const t = TIPOS_MOV[m.tipo] || { txt: m.tipo, cls: 'adj', ic: 'swap_vert' };
                    const sinal = m.quantidade > 0 ? '+' : '';
                    const data = new Date(m.data).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
                    return `<div class="mov"><div class="ic ${t.cls}"><span class="ms">${t.ic}</span></div>
                        <div class="corpo"><b>${esc(m.produto)}</b><small>${t.txt}${m.motivo ? ' · ' + esc(m.motivo) : ''}${m.operador ? ' · ' + esc(m.operador) : ''} · ${data}</small></div>
                        <span class="qtd ${m.quantidade > 0 ? 'txt-verde' : 'txt-vermelho'}">${sinal}${m.quantidade}</span></div>`;
                }).join('');
            } catch (e) { /* não bloqueia a tela */ }
        }

        document.getElementById('busca').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') buscarEstoque();
        });

        (async () => {
            try {
                await Promise.all([buscarEstoque(), buscarMovimentos()]);
            } catch (e) {
                alert("Falha ao carregar dados: " + e.message);
            }
        })();
    </script>
</body>
</html>
