<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Cadastro de Funcionários - JG Sistemas</title>
    <style>
        .cel-func { display: flex; align-items: center; gap: 10px; }
        .cel-func .jg-avatar { width: 32px; height: 32px; font-size: 11px; background: var(--primary-soft); color: var(--primary); }
        .cel-func b { display: block; font-weight: 600; }
        .sec-func { display: none; }
        .sec-func.ativa { display: block; }
        body.jg .modal .abas { margin: -4px 0 16px; }
    </style>
    <link rel="stylesheet" href="/ui/jg.css">
</head>
<body class="jg" data-pagina="colaboradores">
    <main>
        <div class="page-head">
            <div><h1>Colaboradores</h1><div class="sub" id="contador">Cadastro de funcionários, contrato e pagamento</div></div>
            <div class="acoes">
                <a class="btn" href="/configuracoes.html#usuarios"><span class="ms">key</span>Acesso ao sistema</a>
                <button class="btn btn-sucesso" onclick="abrirModalFuncionario()"><span class="ms">person_add</span>Novo colaborador</button>
            </div>
        </div>
        <div class="card">
            <div class="card-body" style="padding-bottom:0">
                <div class="filtros">
                    <div class="input-icone" style="flex:1;min-width:260px"><span class="ms">search</span><input type="text" id="busca" placeholder="Buscar por nome, matrícula, CPF, cargo ou departamento"></div>
                    <select id="f-cargo" style="width:180px" aria-label="Cargo"><option value="">Todos os cargos</option></select>
                    <select id="f-situacao" style="width:160px" aria-label="Situação"><option value="">Todas</option><option value="ativo">Ativos</option><option value="inativo">Inativos</option></select>
                    <button class="btn" onclick="buscarFuncionarios()"><span class="ms">search</span>Buscar</button>
                </div>
            </div>
            <div class="tabela-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Matrícula</th>
                            <th>Nome</th>
                            <th>Cargo</th>
                            <th>Departamento</th>
                            <th>Admissão</th>
                            <th class="right">Salário</th>
                            <th class="right">Comissão</th>
                            <th>Situação</th>
                            <th class="acoes">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-funcionarios">
                        <tr><td colspan="9" class="sem-dados">Carregando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <!-- Ficha do colaborador -->
    <div class="modal-overlay" id="modal-funcionario">
        <div class="modal lg">
            <div class="modal-head">
                <span id="modal-titulo">Novo colaborador</span>
                <span class="close" onclick="fecharModalFuncionario()">&times;</span>
            </div>
            <div class="modal-body">
                <input type="hidden" id="e-id">
                <div class="abas">
                    <button type="button" class="aba ativa" data-sec="pessoais"><span class="ms sm">person</span>Dados pessoais</button>
                    <button type="button" class="aba" data-sec="endereco"><span class="ms sm">home</span>Endereço</button>
                    <button type="button" class="aba" data-sec="contrato"><span class="ms sm">work</span>Contrato</button>
                    <button type="button" class="aba" data-sec="pagamento"><span class="ms sm">account_balance</span>Pagamento</button>
                </div>

                <div class="sec-func ativa" id="sec-pessoais">
                    <div class="form-grid c3">
                        <div class="campo"><label for="e-codigo">Matrícula</label><input type="text" id="e-codigo" placeholder="Ex.: 0007"></div>
                        <div class="campo span-2"><label for="e-nome">Nome completo *</label><input type="text" id="e-nome" placeholder="Nome completo"></div>
                        <div class="campo"><label for="e-nascimento">Nascimento</label><input type="date" id="e-nascimento"></div>
                        <div class="campo"><label for="e-documento">CPF</label><input type="text" id="e-documento" placeholder="000.000.000-00"></div>
                        <div class="campo"><label for="e-rg">RG</label><input type="text" id="e-rg" placeholder="00.000.000-0"></div>
                        <div class="campo"><label for="e-sexo">Sexo</label>
                            <select id="e-sexo"><option value="">Selecione...</option><option value="M">Masculino</option><option value="F">Feminino</option><option value="O">Outro</option></select></div>
                        <div class="campo"><label for="e-estadoCivil">Estado civil</label>
                            <select id="e-estadoCivil"><option value="">Selecione...</option><option value="SOLTEIRO">Solteiro(a)</option><option value="CASADO">Casado(a)</option><option value="DIVORCIADO">Divorciado(a)</option><option value="VIUVO">Viúvo(a)</option><option value="UNIAO_ESTAVEL">União estável</option></select></div>
                        <div class="campo"><label for="e-email">E-mail</label><input type="email" id="e-email" placeholder="colaborador@email.com"></div>
                        <div class="campo"><label for="e-telefone">Telefone</label><input type="text" id="e-telefone" placeholder="(00) 0000-0000"></div>
                        <div class="campo"><label for="e-celular">Celular</label><input type="text" id="e-celular" placeholder="(00) 00000-0000"></div>
                    </div>
                </div>

                <div class="sec-func" id="sec-endereco">
                    <div class="form-grid c4">
                        <div class="campo"><label for="e-cep">CEP</label><div class="input-grupo"><input type="text" id="e-cep" placeholder="00000-000"><button class="btn" type="button" onclick="JG.buscarCep('e-')" title="Buscar CEP"><span class="ms">search</span></button></div></div>
                        <div class="campo span-2"><label for="e-endereco">Endereço</label><input type="text" id="e-endereco" placeholder="Rua/Av."></div>
                        <div class="campo"><label for="e-numero">Número</label><input type="text" id="e-numero" placeholder="123"></div>
                        <div class="campo"><label for="e-complemento">Complemento</label><input type="text" id="e-complemento" placeholder="Apto, bloco..."></div>
                        <div class="campo"><label for="e-bairro">Bairro</label><input type="text" id="e-bairro" placeholder="Centro"></div>
                        <div class="campo"><label for="e-cidade">Cidade</label><input type="text" id="e-cidade" placeholder="São Paulo"></div>
                        <div class="campo"><label for="e-estado">UF</label><input type="text" id="e-estado" placeholder="SP" maxlength="2"></div>
                    </div>
                </div>

                <div class="sec-func" id="sec-contrato">
                    <div class="form-grid c3">
                        <div class="campo"><label for="e-cargo">Cargo</label><input type="text" id="e-cargo" placeholder="Ex.: Vendedora" list="lista-cargos"><datalist id="lista-cargos"></datalist></div>
                        <div class="campo"><label for="e-departamento">Departamento</label><input type="text" id="e-departamento" placeholder="Ex.: Vendas"></div>
                        <div class="campo"><label for="e-admissao">Admissão</label><input type="date" id="e-admissao"></div>
                        <div class="campo"><label for="e-salario">Salário base (R$)</label><input type="text" id="e-salario" placeholder="0,00" inputmode="decimal"></div>
                        <div class="campo"><label for="e-valeTransporte">Vale-transporte (R$)</label><input type="text" id="e-valeTransporte" placeholder="0,00" inputmode="decimal"></div>
                        <div class="campo"><label for="e-valeAlimentacao">Vale-alimentação (R$)</label><input type="text" id="e-valeAlimentacao" placeholder="0,00" inputmode="decimal"></div>
                        <div class="campo"><label for="e-comissao">Comissão padrão (%)</label><input type="text" id="e-comissao" placeholder="0,00" inputmode="decimal"></div>
                    </div>
                    <div class="campo"><label for="e-observacoes">Observações</label><textarea id="e-observacoes" rows="2" placeholder="Anotações sobre o colaborador..."></textarea></div>
                    <label class="toggle"><input type="checkbox" id="e-ativo" checked><span class="trilho"></span><span>Colaborador ativo</span></label>
                </div>

                <div class="sec-func" id="sec-pagamento">
                    <div class="form-grid">
                        <div class="campo"><label for="e-formaPagamento">Forma de pagamento</label>
                            <select id="e-formaPagamento"><option value="">Selecione...</option><option value="BANCO">Crédito em conta</option><option value="DINHEIRO">Dinheiro</option><option value="CHEQUE">Cheque</option></select></div>
                        <div class="campo"><label for="e-banco">Banco</label><input type="text" id="e-banco" placeholder="Ex.: Banco do Brasil"></div>
                        <div class="campo"><label for="e-agencia">Agência</label><input type="text" id="e-agencia" placeholder="0000"></div>
                        <div class="campo"><label for="e-conta">Conta</label><input type="text" id="e-conta" placeholder="00000-0"></div>
                        <div class="campo"><label for="e-tipoConta">Tipo de conta</label>
                            <select id="e-tipoConta"><option value="">Selecione...</option><option value="CORRENTE">Conta corrente</option><option value="POUPANCA">Poupança</option><option value="SALARIO">Conta salário</option></select></div>
                    </div>
                </div>
            </div>
            <div class="modal-foot">
                <button class="btn" onclick="fecharModalFuncionario()">Cancelar</button>
                <button class="btn btn-sucesso" onclick="salvarFuncionario()"><span class="ms">check</span>Salvar</button>
            </div>
        </div>
    </div>

    <script src="/seguranca.js"></script>
    <script src="/ui/shell.js"></script>
    <script>
        const API_BASE = '';
        let funcionarios = [];

        function formatarMoeda(valor) {
            return Number(valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function obterOperador() {
            try {
                const raw = localStorage.getItem('jg_operador');
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }

        function tokenAuth() {
            const op = obterOperador();
            return op && op.token ? { 'Authorization': 'Bearer ' + op.token } : {};
        }

        function bloquearCaixa() {
            const op = obterOperador();
            if (!op) { window.location.href = '/login.html'; return true; }
            if (op.papel === 'SELLER') { window.location.href = '/'; return true; }
            return false;
        }

        async function api(url, metodo = 'GET', corpo = null) {
            const opcoes = { method: metodo, headers: Object.assign({ 'Content-Type': 'application/json' }, tokenAuth()) };
            if (corpo) opcoes.body = JSON.stringify(corpo);
            const response = await fetch(`${API_BASE}${url}`, opcoes);
            if (response.status === 401) {
                localStorage.removeItem('jg_operador');
                window.location.href = '/login.html';
                throw new Error('Sessão expirada.');
            }
            const dados = await response.json();
            if (!response.ok) throw new Error(dados.erro || 'Erro na requisição');
            return dados;
        }

        bloquearCaixa();

        async function buscarFuncionarios() {
            const busca = document.getElementById('busca').value.trim();
            const url = busca ? `/api/funcionarios?busca=${encodeURIComponent(busca)}` : '/api/funcionarios';
            try {
                funcionarios = await api(url);
                renderizarFuncionarios();
            } catch (e) { alert(e.message); }
        }

        function renderizarFuncionarios() {
            const tbody = document.getElementById('tabela-funcionarios');
            const cargos = [...new Set(funcionarios.map(f => (f.cargo || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
            const selCargo = document.getElementById('f-cargo');
            const atualCargo = selCargo.value;
            selCargo.innerHTML = '<option value="">Todos os cargos</option>' + cargos.map(c => `<option>${esc(c)}</option>`).join('');
            selCargo.value = cargos.includes(atualCargo) ? atualCargo : '';
            document.getElementById('lista-cargos').innerHTML = cargos.map(c => `<option value="${esc(c)}">`).join('');
            const sit = document.getElementById('f-situacao').value;
            const lista = funcionarios.filter(f => (!selCargo.value || (f.cargo || '').trim() === selCargo.value) && (!sit || (sit === 'ativo') === !!f.ativo));
            document.getElementById('contador').textContent = `${funcionarios.filter(f => f.ativo).length} ativo(s) de ${funcionarios.length} colaborador(es)`;
            if (lista.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9"><div class="estado-vazio"><span class="ms">badge</span><p>Nenhum colaborador encontrado.</p><button class="btn btn-sucesso" onclick="abrirModalFuncionario()"><span class="ms">person_add</span>Novo colaborador</button></div></td></tr>';
                return;
            }
            tbody.innerHTML = lista.map(f => `
                <tr>
                    <td class="num">${esc(f.codigo || '—')}</td>
                    <td><div class="cel-func"><div class="jg-avatar">${esc(JG.iniciais(f.nome))}</div><div><b>${esc(f.nome)}</b><small>${esc(f.email || f.celular || '')}</small></div></div></td>
                    <td>${esc(f.cargo || '—')}</td>
                    <td>${esc(f.departamento || '—')}</td>
                    <td>${f.admissao ? new Date(f.admissao).toLocaleDateString('pt-BR') : '—'}</td>
                    <td class="right">${formatarMoeda(f.salario)}</td>
                    <td class="right">${Number(f.comissao || 0) ? Number(f.comissao).toFixed(2).replace('.', ',') + '%' : '—'}</td>
                    <td><span class="badge ${f.ativo ? 'ativo' : 'inativo'}">${f.ativo ? 'Ativo' : 'Inativo'}</span></td>
                    <td class="acoes">
                        <button class="btn-icone" title="Editar" onclick="abrirModalFuncionario('${f.id}')"><span class="ms">edit</span></button>
                        <button class="btn-icone perigo" title="Excluir" onclick="excluirFuncionario('${f.id}', '${esc(f.nome)}')"><span class="ms">delete</span></button>
                    </td>
                </tr>
            `).join('');
        }

        function mostrarSecao(nome) {
            document.querySelectorAll('[data-sec]').forEach(b => b.classList.toggle('ativa', b.dataset.sec === nome));
            document.querySelectorAll('.sec-func').forEach(sx => sx.classList.toggle('ativa', sx.id === 'sec-' + nome));
        }
        document.querySelectorAll('[data-sec]').forEach(b => b.addEventListener('click', () => mostrarSecao(b.dataset.sec)));
        ['f-cargo', 'f-situacao'].forEach(id => document.getElementById(id).addEventListener('change', renderizarFuncionarios));

        function abrirModalFuncionario(id = null) {
            document.getElementById('modal-titulo').innerText = id ? 'Editar colaborador' : 'Novo colaborador';
            mostrarSecao('pessoais');
            document.getElementById('e-id').value = id || '';
            const campos = ['e-codigo', 'e-nome', 'e-nascimento', 'e-documento', 'e-rg', 'e-sexo', 'e-estadoCivil', 'e-email', 'e-telefone', 'e-celular', 'e-cep', 'e-endereco', 'e-numero', 'e-complemento', 'e-bairro', 'e-cidade', 'e-estado', 'e-cargo', 'e-departamento', 'e-admissao', 'e-salario', 'e-comissao', 'e-valeTransporte', 'e-valeAlimentacao', 'e-formaPagamento', 'e-banco', 'e-agencia', 'e-conta', 'e-tipoConta', 'e-observacoes'];
            campos.forEach(campo => document.getElementById(campo).value = '');
            document.getElementById('e-ativo').checked = true;

            if (id) {
                const f = funcionarios.find(x => x.id === id);
                if (f) {
                    document.getElementById('e-codigo').value = f.codigo || '';
                    document.getElementById('e-nome').value = f.nome;
                    if (f.nascimento) document.getElementById('e-nascimento').value = new Date(f.nascimento).toISOString().slice(0, 10);
                    document.getElementById('e-documento').value = f.documento || '';
                    document.getElementById('e-rg').value = f.rg || '';
                    document.getElementById('e-sexo').value = f.sexo || '';
                    document.getElementById('e-estadoCivil').value = f.estadoCivil || '';
                    document.getElementById('e-email').value = f.email || '';
                    document.getElementById('e-telefone').value = f.telefone || '';
                    document.getElementById('e-celular').value = f.celular || '';
                    document.getElementById('e-cep').value = f.cep || '';
                    document.getElementById('e-endereco').value = f.endereco || '';
                    document.getElementById('e-numero').value = f.numero || '';
                    document.getElementById('e-complemento').value = f.complemento || '';
                    document.getElementById('e-bairro').value = f.bairro || '';
                    document.getElementById('e-cidade').value = f.cidade || '';
                    document.getElementById('e-estado').value = f.estado || '';
                    document.getElementById('e-cargo').value = f.cargo || '';
                    document.getElementById('e-departamento').value = f.departamento || '';
                    if (f.admissao) document.getElementById('e-admissao').value = new Date(f.admissao).toISOString().slice(0, 10);
                    document.getElementById('e-salario').value = String(f.salario).replace('.', ',');
                    document.getElementById('e-comissao').value = String(f.comissao).replace('.', ',');
                    document.getElementById('e-valeTransporte').value = String(f.valeTransporte).replace('.', ',');
                    document.getElementById('e-valeAlimentacao').value = String(f.valeAlimentacao).replace('.', ',');
                    document.getElementById('e-formaPagamento').value = f.formaPagamento || '';
                    document.getElementById('e-banco').value = f.banco || '';
                    document.getElementById('e-agencia').value = f.agencia || '';
                    document.getElementById('e-conta').value = f.conta || '';
                    document.getElementById('e-tipoConta').value = f.tipoConta || '';
                    document.getElementById('e-observacoes').value = f.observacoes || '';
                    document.getElementById('e-ativo').checked = f.ativo;
                }
            }

            document.getElementById('modal-funcionario').classList.add('active');
        }

        function fecharModalFuncionario() {
            document.getElementById('modal-funcionario').classList.remove('active');
        }

        function parseMoeda(valor) {
            return parseFloat(String(valor).replace(',', '.')) || 0;
        }

        async function salvarFuncionario() {
            const id = document.getElementById('e-id').value;
            const corpo = {
                codigo: document.getElementById('e-codigo').value.trim(),
                nome: document.getElementById('e-nome').value.trim(),
                nascimento: document.getElementById('e-nascimento').value || null,
                documento: document.getElementById('e-documento').value.trim(),
                rg: document.getElementById('e-rg').value.trim(),
                sexo: document.getElementById('e-sexo').value,
                estadoCivil: document.getElementById('e-estadoCivil').value,
                email: document.getElementById('e-email').value.trim(),
                telefone: document.getElementById('e-telefone').value.trim(),
                celular: document.getElementById('e-celular').value.trim(),
                cep: document.getElementById('e-cep').value.trim(),
                endereco: document.getElementById('e-endereco').value.trim(),
                numero: document.getElementById('e-numero').value.trim(),
                complemento: document.getElementById('e-complemento').value.trim(),
                bairro: document.getElementById('e-bairro').value.trim(),
                cidade: document.getElementById('e-cidade').value.trim(),
                estado: document.getElementById('e-estado').value.trim().toUpperCase(),
                cargo: document.getElementById('e-cargo').value.trim(),
                departamento: document.getElementById('e-departamento').value.trim(),
                admissao: document.getElementById('e-admissao').value || null,
                salario: parseMoeda(document.getElementById('e-salario').value),
                comissao: parseMoeda(document.getElementById('e-comissao').value),
                valeTransporte: parseMoeda(document.getElementById('e-valeTransporte').value),
                valeAlimentacao: parseMoeda(document.getElementById('e-valeAlimentacao').value),
                formaPagamento: document.getElementById('e-formaPagamento').value,
                banco: document.getElementById('e-banco').value.trim(),
                agencia: document.getElementById('e-agencia').value.trim(),
                conta: document.getElementById('e-conta').value.trim(),
                tipoConta: document.getElementById('e-tipoConta').value,
                observacoes: document.getElementById('e-observacoes').value.trim(),
                ativo: document.getElementById('e-ativo').checked
            };

            if (!corpo.nome) { alert("Informe o nome do funcionário!"); return; }

            try {
                if (id) {
                    await api(`/api/funcionarios/${id}`, 'PUT', corpo);
                } else {
                    await api('/api/funcionarios', 'POST', corpo);
                }
                fecharModalFuncionario();
                await buscarFuncionarios();
            } catch (e) { alert(e.message); }
        }

        async function excluirFuncionario(id, nome) {
            if (!confirm(`Excluir o funcionário "${nome}"?`)) return;
            try {
                await api(`/api/funcionarios/${id}`, 'DELETE');
                await buscarFuncionarios();
            } catch (e) { alert(e.message); }
        }

        document.getElementById('busca').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') buscarFuncionarios();
        });

        (async () => {
            try {
                await buscarFuncionarios();
            } catch (e) {
                alert("Falha ao carregar dados: " + e.message);
            }
        })();
    </script>
</body>
</html>
