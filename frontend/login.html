<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <meta name="robots" content="noindex, nofollow">
    <title>Entrar - JG Sistemas</title>
    <link rel="stylesheet" href="/ui/jg.css">
    <style>
        body.jg { min-height: 100vh; background: var(--navy); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; }
        .login-card { width: 420px; max-width: 100%; background: #fff; border-radius: 12px; box-shadow: 0 24px 60px rgba(0, 0, 0, .35); padding: 30px 30px 26px; }
        .login-marca { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
        .login-marca .jg-brand-logo { width: 44px; height: 44px; font-size: 17px; }
        .login-marca .nome { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
        .login-marca .sub { font-size: 13px; color: var(--text-2); }
        body.jg .login-card input[type] { height: 44px; font-size: 15px; }
        .login-card .input-grupo .btn { height: 44px; }
        .senha-wrap { position: relative; }
        body.jg .senha-wrap input[type] { padding-right: 44px; }
        .senha-wrap .btn-icone { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); }
        .erro { display: none; margin-bottom: 16px; }
        .acoes { display: flex; gap: 10px; margin-top: 6px; }
        .acoes .btn-entrar { flex: 1; height: 44px; font-size: 15px; }
        .btn-nova-senha { display: block; width: 100%; margin-top: 14px; background: none; border: 0; color: var(--primary); font-size: 13px; font-weight: 500; cursor: pointer; }
        .btn-nova-senha:hover { text-decoration: underline; }
        .login-rodape { margin-top: 22px; color: #9FB3D1; font-size: 12px; text-align: center; }
        .login-rodape b { color: #86EFAC; font-weight: 600; }
        .lista-operadores { max-height: 360px; overflow-y: auto; padding: 6px; }
        .operador-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius); cursor: pointer; }
        .operador-item:hover { background: var(--primary-soft); }
        .operador-item .nome { font-weight: 600; font-size: 14px; }
        .operador-item .email { font-size: 12px; color: var(--text-2); }
        .operador-item .badge { margin-left: auto; }
        .sem-operador { text-align: center; color: var(--text-2); padding: 22px; font-size: 14px; }
        .modal-busca { padding: 12px 20px; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body class="jg sem-shell" data-publico>

    <div class="login-card">
        <div class="login-marca">
            <div class="jg-brand-logo">JG</div>
            <div><div class="nome">JG Sistemas</div><div class="sub">Acesse com seu operador</div></div>
        </div>

        <div class="alerta vermelho erro" id="erro" role="alert"></div>

        <div class="campo">
            <label for="operador">Operador</label>
            <div class="input-grupo">
                <input type="text" id="operador" placeholder="Nome ou e-mail" autocomplete="off" autofocus>
                <button class="btn" type="button" onclick="abrirListaOperadores()" title="Listar operadores (F2)"><span class="ms">group</span><span class="kbd">F2</span></button>
            </div>
        </div>

        <div class="campo">
            <label for="senha">Senha</label>
            <div class="senha-wrap">
                <input type="password" id="senha" placeholder="••••••••" autocomplete="off">
                <button type="button" class="btn-icone" id="ver-senha" title="Mostrar/ocultar senha"><span class="ms">visibility</span></button>
            </div>
        </div>

        <div class="acoes">
            <button class="btn btn-primario btn-entrar" onclick="entrar()"><span class="ms">login</span>Entrar</button>
            <button class="btn" onclick="limpar()">Limpar</button>
        </div>

        <button class="btn-nova-senha" onclick="esqueciSenha()">Esqueci minha senha</button>
    </div>

    <div class="login-rodape">v3.0 · Suporte <b>(62) 98219-9003</b></div>

    <!-- Modal seleção de operador (F2) -->
    <div class="modal-overlay" id="modal-operadores">
        <div class="modal sm">
            <div class="modal-head">
                <span>Selecionar operador</span>
                <span class="close" onclick="fecharListaOperadores()">&times;</span>
            </div>
            <div class="modal-busca">
                <div class="input-icone"><span class="ms">search</span><input type="text" id="busca-operador" placeholder="Digite para filtrar..." oninput="filtrarOperadores()"></div>
            </div>
            <div class="lista-operadores" id="lista-operadores"></div>
        </div>
    </div>

    <!-- Modal troca obrigatória de senha -->
    <div class="modal-overlay" id="modal-trocar-senha">
        <div class="modal sm">
            <div class="modal-head"><span>Troca de senha obrigatória</span></div>
            <div class="modal-body">
                <div class="alerta vermelho erro" id="erro-trocar"></div>
                <div class="campo"><label for="trocar-senha-atual">Senha atual</label><input type="password" id="trocar-senha-atual" autocomplete="off"></div>
                <div class="campo"><label for="trocar-nova-senha">Nova senha</label><input type="password" id="trocar-nova-senha" placeholder="Mín. 8 caracteres, número e maiúscula" autocomplete="new-password"></div>
                <div class="campo"><label for="trocar-confirma-senha">Confirmar nova senha</label><input type="password" id="trocar-confirma-senha" autocomplete="new-password"></div>
            </div>
            <div class="modal-foot"><button class="btn btn-sucesso" onclick="confirmarTrocarSenha()"><span class="ms">check</span>Salvar senha</button></div>
        </div>
    </div>

    <!-- Modal aviso de mensalidade -->
    <div class="modal-overlay" id="modal-aviso-mensalidade">
        <div class="modal sm">
            <div class="modal-head"><span>Aviso de mensalidade</span></div>
            <div class="modal-body">
                <div class="alerta ambar"><span class="ms">warning</span><div id="aviso-mensalidade-texto" style="line-height:1.5"></div></div>
            </div>
            <div class="modal-foot"><button class="btn btn-primario" onclick="confirmarAvisoMensalidade()">Entendi</button></div>
        </div>
    </div>

<script src="/seguranca.js"></script>
    <script>
        const API_BASE = '';
        let operadores = [];
        const PAPEIS_OP = { ADMIN: 'Administrador', MANAGER: 'Gerente', SUPERVISOR: 'Supervisor', SELLER: 'Vendedor', STOCKIST: 'Estoquista', FINANCIAL: 'Financeiro' };
        function iniciaisOp(nome) {
            const p = String(nome || '?').trim().split(/\s+/);
            return ((p[0] || '')[0] + ((p.length > 1 ? p[p.length - 1][0] : '') || '')).toUpperCase();
        }
        document.getElementById('ver-senha').addEventListener('click', () => {
            const i = document.getElementById('senha');
            i.type = i.type === 'password' ? 'text' : 'password';
            document.querySelector('#ver-senha .ms').textContent = i.type === 'password' ? 'visibility' : 'visibility_off';
        });

        function mostrarErro(msg) {
            const el = document.getElementById('erro');
            el.innerHTML = '<span class="ms">error</span><div></div>';
            el.lastChild.textContent = msg;
            el.style.display = 'flex';
        }

        function limpar() {
            document.getElementById('erro').style.display = 'none';
            document.getElementById('operador').value = '';
            document.getElementById('senha').value = '';
            document.getElementById('operador').focus();
        }

        async function carregarOperadores() {
            try {
                const r = await fetch(`${API_BASE}/api/auth/operadores`);
                if (r.ok) operadores = await r.json();
            } catch (e) { /* offline: mantém lista vazia */ }
        }

        function abrirListaOperadores() {
            if (operadores.length === 0) {
                mostrarErro("Nenhum operador disponível. Fale com o administrador.");
                return;
            }
            document.getElementById('busca-operador').value = '';
            document.getElementById('busca-operador').focus();
            document.getElementById('modal-operadores').classList.add('active');
            filtrarOperadores();
        }

        function fecharListaOperadores() {
            document.getElementById('modal-operadores').classList.remove('active');
        }

        function filtrarOperadores() {
            const q = document.getElementById('busca-operador').value.trim().toLowerCase();
            const lista = operadores.filter(o =>
                !q || o.nome.toLowerCase().includes(q) || o.email.toLowerCase().includes(q)
            );
            const box = document.getElementById('lista-operadores');
            if (lista.length === 0) {
                box.innerHTML = '<div class="sem-operador">Nenhum operador encontrado.</div>';
                return;
            }
            box.innerHTML = lista.map(o => `
                <div class="operador-item" onclick="selecionarOperador('${esc(o.email)}')">
                    <div class="jg-avatar">${esc(iniciaisOp(o.nome))}</div>
                    <div>
                        <div class="nome">${esc(o.nome)}</div>
                        <div class="email">${esc(o.email)}</div>
                    </div>
                    <span class="badge azul sem-ponto">${esc(PAPEIS_OP[o.papel] || o.papel || 'Operador')}</span>
                </div>`).join('');
        }

        function selecionarOperador(email) {
            document.getElementById('operador').value = email;
            document.getElementById('senha').value = '';
            document.getElementById('senha').focus();
            document.getElementById('erro').style.display = 'none';
            fecharListaOperadores();
        }

        async function entrar() {
            const identificador = document.getElementById('operador').value.trim();
            const senha = document.getElementById('senha').value;
            if (!identificador) { mostrarErro("Informe o operador!"); return; }
            if (!senha) { mostrarErro("Informe a senha!"); return; }

            try {
                const r = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identificador, senha })
                });
                const dados = await r.json();
                if (!r.ok) {
                    mostrarErro(dados.erro || "Falha no login!");
                    document.getElementById('senha').value = '';
                    document.getElementById('senha').focus();
                    return;
                }
                // A sessão fica em cookie httpOnly (não acessível via JS).
                // Guardamos apenas os dados do operador, sem o token.
                const { token: _token, ...operador } = dados;
                localStorage.setItem('jg_operador', JSON.stringify(operador));
                // Aviso de mensalidade: aparece no login, no máximo uma vez por hora.
                if (dados.avisoMensalidade) {
                    localStorage.setItem('jg_aviso_mensalidade', JSON.stringify(dados.avisoMensalidade));
                    const HORA_MS = 3600000;
                    const ultima = Number(localStorage.getItem('jg_aviso_mensalidade_ultima') || 0);
                    if (Date.now() - ultima >= HORA_MS) {
                        abrirAvisoMensalidade(dados.avisoMensalidade, senha);
                        return;
                    }
                } else {
                    localStorage.removeItem('jg_aviso_mensalidade');
                }
                if (dados.trocarSenha) {
                    abrirTrocarSenha(senha);
                    return;
                }
                window.location.href = '/';
            } catch (e) {
                mostrarErro("Falha de conexão com o servidor.");
            }
        }

        function abrirTrocarSenha(senhaAtual) {
            document.getElementById('trocar-senha-atual').value = senhaAtual || '';
            document.getElementById('trocar-nova-senha').value = '';
            document.getElementById('trocar-confirma-senha').value = '';
            document.getElementById('erro-trocar').style.display = 'none';
            document.getElementById('modal-trocar-senha').classList.add('active');
            document.getElementById('trocar-nova-senha').focus();
        }

        function fecharTrocarSenha() {
            document.getElementById('modal-trocar-senha').classList.remove('active');
        }

        let senhaAtualLogin = '';

        function abrirAvisoMensalidade(aviso, senha) {
            senhaAtualLogin = senha || '';
            document.getElementById('aviso-mensalidade-texto').innerText = aviso.mensagem;
            document.getElementById('modal-aviso-mensalidade').classList.add('active');
        }

        function confirmarAvisoMensalidade() {
            localStorage.setItem('jg_aviso_mensalidade_ultima', String(Date.now()));
            document.getElementById('modal-aviso-mensalidade').classList.remove('active');
            const op = obterOperador();
            if (op && op.trocarSenha) {
                abrirTrocarSenha(senhaAtualLogin);
                return;
            }
            window.location.href = '/';
        }

        function mostrarErroTrocar(msg) {
            const el = document.getElementById('erro-trocar');
            el.innerHTML = '<span class="ms">error</span><div></div>';
            el.lastChild.textContent = msg;
            el.style.display = 'flex';
        }

        async function confirmarTrocarSenha() {
            const senhaAtual = document.getElementById('trocar-senha-atual').value;
            const nova = document.getElementById('trocar-nova-senha').value;
            const confirma = document.getElementById('trocar-confirma-senha').value;
            if (!nova || !confirma) { mostrarErroTrocar("Informe a nova senha e a confirmação."); return; }
            if (nova !== confirma) { mostrarErroTrocar("As senhas não conferem!"); return; }

            try {
                const op = obterOperador();
                const r = await fetch(`${API_BASE}/api/auth/trocar-senha`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ senhaAtual, novaSenha: nova })
                });
                const dados = await r.json();
                if (!r.ok) {
                    mostrarErroTrocar(dados.erro || "Não foi possível trocar a senha.");
                    return;
                }
                if (op) { op.trocarSenha = false; localStorage.setItem('jg_operador', JSON.stringify(op)); }
                fecharTrocarSenha();
                window.location.href = '/';
            } catch (e) {
                mostrarErroTrocar("Falha de conexão com o servidor.");
            }
        }

        function obterOperador() {
            try { const raw = localStorage.getItem('jg_operador'); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
        }

        function esqueciSenha() {
            mostrarErro("Procure o administrador para redefinir sua senha.");
        }

        document.getElementById('operador').addEventListener('keydown', (e) => {
            if (e.key === 'F2') { e.preventDefault(); abrirListaOperadores(); }
            if (e.key === 'Enter') document.getElementById('senha').focus();
        });

        document.getElementById('senha').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') entrar();
        });

        document.getElementById('busca-operador').addEventListener('keydown', (e) => {
            if (e.key === 'F2' || e.key === 'Escape') { e.preventDefault(); fecharListaOperadores(); }
        });

        (async () => {
            await carregarOperadores();
        })();
    </script>
</body>
</html>
