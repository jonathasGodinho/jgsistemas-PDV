<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <meta name="robots" content="noindex, nofollow">
    <title>Início - JG Sistemas</title>
    <link rel="stylesheet" href="/ui/jg.css">
    <style>
        .grafico-horas { display: flex; align-items: flex-end; gap: 6px; height: 200px; padding: 8px 4px 0; }
        .grafico-horas .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
        .grafico-horas .bar { width: 100%; max-width: 34px; background: var(--primary); border-radius: 4px 4px 0 0; min-height: 2px; position: relative; transition: height .3s; }
        .grafico-horas .bar.zero { background: #E5EAF2; }
        .grafico-horas .bar:hover { background: var(--primary-hover); }
        .grafico-horas .bar[data-v]:hover::after { content: attr(data-v); position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; font-size: 11px; padding: 3px 6px; border-radius: 4px; white-space: nowrap; }
        .grafico-horas .h { font-size: 11px; color: var(--text-2); font-variant-numeric: tabular-nums; }
        .donut-wrap { display: flex; align-items: center; gap: 20px; }
        .donut { width: 140px; height: 140px; border-radius: 50%; flex-shrink: 0; position: relative; background: #E5EAF2; }
        .donut::after { content: ''; position: absolute; inset: 22px; background: #fff; border-radius: 50%; }
        .donut-centro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1; font-size: 12px; color: var(--text-2); }
        .donut-centro b { font-size: 15px; color: var(--text); }
        .legenda { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
        .legenda .it { display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .legenda .it i { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
        .legenda .it span { color: var(--text-2); }
        .legenda .it b { margin-left: auto; font-variant-numeric: tabular-nums; }
        .op-linha { margin-bottom: 12px; }
        .op-linha .row { justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
        .atalhos { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        .atalho { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; color: var(--text); text-decoration: none; transition: border-color .12s, box-shadow .12s; }
        .atalho:hover { border-color: var(--primary); box-shadow: var(--shadow); }
        .atalho .ic { width: 40px; height: 40px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; background: var(--primary-soft); color: var(--primary); }
        .atalho .ic.verde { background: var(--green-soft); color: var(--green); }
        .atalho .ic.ambar { background: var(--amber-soft); color: var(--amber); }
        .atalho b { font-size: 14px; display: block; }
        .atalho small { color: var(--text-2); font-size: 12px; }
        .atalho .kbd { margin-left: auto; }
        .lista-estoque .it { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
        .lista-estoque .it:last-child { border-bottom: 0; }
        .lista-estoque .it .nome { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .lista-estoque .it small { color: var(--text-2); white-space: nowrap; }
    </style>
</head>
<body class="jg" data-pagina="inicio">
    <main>
        <div class="alerta vermelho mb-16 hidden" id="aviso-bloqueado"><span class="ms">lock</span><div id="aviso-bloqueado-txt"></div></div>
        <div class="alerta ambar mb-16 hidden" id="aviso-mensalidade"><span class="ms">payments</span><div id="aviso-mensalidade-txt" style="flex:1"></div><button class="btn btn-sm" id="fechar-aviso">Entendi</button></div>

        <div class="page-head">
            <div>
                <h1 id="saudacao">Início</h1>
                <div class="sub" id="data-hoje"></div>
            </div>
            <div class="acoes" id="acoes-topo">
                <button class="btn" id="btn-atualizar"><span class="ms">refresh</span>Atualizar</button>
            </div>
        </div>

        <!-- Gestão (todos menos operador de caixa) -->
        <div id="area-gestao" class="hidden">
            <div class="kpis" id="kpis"></div>

            <div class="grid g-main-side mb-16" style="grid-template-columns:minmax(0,1fr) 400px">
                <div class="card">
                    <div class="card-head"><div><h3>Vendas por hora</h3><div class="sub">Hoje, vendas concluídas</div></div><span class="badge azul sem-ponto" id="pico-hora">—</span></div>
                    <div class="card-body"><div class="grafico-horas" id="grafico-horas"></div></div>
                </div>
                <div class="card">
                    <div class="card-head"><h3>Vendas por forma de pagamento</h3></div>
                    <div class="card-body" id="area-metodos"></div>
                </div>
            </div>

            <div class="grid g-3 mb-16">
                <div class="card">
                    <div class="card-head"><h3>Vendas por operador</h3></div>
                    <div class="card-body" id="area-operadores"></div>
                </div>
                <div class="card">
                    <div class="card-head"><h3>Top produtos do dia</h3><a href="/relatorios.html" style="font-size:13px">Ver ranking</a></div>
                    <div class="tabela-wrap" id="area-top"></div>
                </div>
                <div class="card">
                    <div class="card-head"><h3>Estoque baixo</h3><a href="/estoque.html" style="font-size:13px">Ver estoque</a></div>
                    <div class="card-body lista-estoque" id="area-estoque"></div>
                </div>
            </div>

            <div class="grid g-2 mb-16">
                <div class="card">
                    <div class="card-head"><h3>Caixas abertos</h3><a href="/caixa.html" style="font-size:13px">Ir para o caixa</a></div>
                    <div class="tabela-wrap" id="area-caixas"></div>
                </div>
                <div class="card">
                    <div class="card-head"><h3>Atalhos</h3></div>
                    <div class="card-body"><div class="atalhos" id="atalhos-gestao"></div></div>
                </div>
            </div>
        </div>

        <!-- Operador de caixa -->
        <div id="area-caixa" class="hidden">
            <div class="card">
                <div class="card-head"><h3>O que você quer fazer?</h3></div>
                <div class="card-body"><div class="atalhos" id="atalhos-caixa"></div></div>
            </div>
        </div>
    </main>

    <script src="/seguranca.js"></script>
    <script src="/ui/shell.js"></script>
    <script>
        const METODOS = { MONEY: 'Dinheiro', PIX: 'PIX', CREDIT_CARD: 'Crédito', DEBIT_CARD: 'Débito', CREDIARIO: 'Crediário' };
        const CORES_METODO = { PIX: '#1D4F91', CREDIT_CARD: '#16A34A', DEBIT_CARD: '#60A5FA', MONEY: '#D97706', CREDIARIO: '#7C3AED' };
        const fmt = (v) => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        const op = JG.operador();

        function obterOperador() { return JG.operador(); }

        async function api(url) {
            const r = await fetch(url, { credentials: 'same-origin' });
            if (r.status === 401) { localStorage.removeItem('jg_operador'); location.href = '/login.html'; throw new Error('Sessão expirada.'); }
            const d = await r.json();
            if (!r.ok) throw new Error(d.erro || 'Erro na requisição');
            return d;
        }

        // ---------- cabeçalho
        (function cabecalho() {
            const agora = new Date();
            const h = agora.getHours();
            const primeiro = String((op && op.nome) || '').split(' ')[0];
            document.getElementById('saudacao').textContent = (h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite') + (primeiro ? ', ' + primeiro : '');
            const dia = agora.toLocaleDateString('pt-BR', { weekday: 'long' });
            document.getElementById('data-hoje').textContent = dia.charAt(0).toUpperCase() + dia.slice(1) + ', ' + agora.toLocaleDateString('pt-BR');

            const bloq = new URLSearchParams(location.search).get('bloqueado');
            if (bloq) {
                document.getElementById('aviso-bloqueado').classList.remove('hidden');
                document.getElementById('aviso-bloqueado-txt').textContent = 'O módulo solicitado não está liberado no seu plano. Fale com o suporte da JG Sistemas para liberar.';
            }

            // Aviso de mensalidade: no máximo uma vez por hora
            let aviso = null;
            try { aviso = JSON.parse(localStorage.getItem('jg_aviso_mensalidade')); } catch (e) { aviso = null; }
            const ultima = Number(localStorage.getItem('jg_aviso_mensalidade_ultima') || 0);
            if (aviso && aviso.mensagem && Date.now() - ultima >= 3600000) {
                localStorage.setItem('jg_aviso_mensalidade_ultima', String(Date.now()));
                document.getElementById('aviso-mensalidade-txt').textContent = aviso.mensagem;
                document.getElementById('aviso-mensalidade').classList.remove('hidden');
            }
            document.getElementById('fechar-aviso').onclick = () => document.getElementById('aviso-mensalidade').classList.add('hidden');
        })();

        // ---------- atalhos
        function atalho(href, icone, titulo, desc, cor, kbd, novaAba) {
            return `<a class="atalho" href="${href}"${novaAba ? ' target="_blank" rel="noopener"' : ''}><div class="ic ${cor || ''}"><span class="ms">${icone}</span></div><div><b>${titulo}</b><small>${desc}</small></div>${kbd ? `<span class="kbd">${kbd}</span>` : ''}</a>`;
        }
        function montarAtalhos() {
            const mod = (k) => JG.moduloOk(k);
            document.getElementById('atalhos-gestao').innerHTML = [
                atalho('/pdv.html', 'point_of_sale', 'Nova venda', 'Abrir o PDV', 'verde', 'F12', true),
                atalho('/clientes.html?novo=1', 'person_add', 'Novo cliente', 'Cadastro rápido'),
                mod('financeiro') ? atalho('/financeiro.html?nova=1', 'post_add', 'Lançar conta', 'Pagar ou receber', 'ambar') : '',
                atalho('/produtos.html?novo=1', 'add_box', 'Novo produto', 'Cadastrar no catálogo'),
                mod('estoque') ? atalho('/estoque.html', 'move_to_inbox', 'Entrada de estoque', 'Movimentar estoque') : '',
                atalho('/consultas.html', 'receipt_long', 'Consultar vendas', 'Histórico e NFC-e')
            ].join('');
            document.getElementById('atalhos-caixa').innerHTML = [
                atalho('/caixa.html', 'account_balance_wallet', 'Caixa', 'Abrir, sangria e fechamento'),
                atalho('/pdv.html', 'point_of_sale', 'PDV', 'Registrar vendas', 'verde', 'F12', true),
                mod('crediario') ? atalho('/vendas-fora-pdv.html', 'credit_score', 'Crediário', 'Venda a prazo', 'ambar') : '',
                mod('orcamentos') ? atalho('/orcamentos.html', 'request_quote', 'Orçamentos', 'Pendentes de efetivação') : ''
            ].join('');
        }
        document.addEventListener('jg:modulos', montarAtalhos);

        // ---------- blocos do dashboard
        function kpi(rotulo, valor, icone, cor, rodape) {
            return `<div class="kpi ${cor || ''}"><div class="kpi-top"><span>${rotulo}</span><span class="ms">${icone}</span></div><div class="kpi-valor">${valor}</div>${rodape ? `<div class="kpi-rodape">${rodape}</div>` : ''}</div>`;
        }
        function montarKpis(d) {
            const v = d.vendasHoje;
            let comp = '';
            if (d.ontem && d.ontem.total > 0) {
                const p = (v.total - d.ontem.total) / d.ontem.total * 100;
                comp = `<span class="${p >= 0 ? 'txt-verde' : 'txt-vermelho'}">${p >= 0 ? '+' : ''}${p.toFixed(1).replace('.', ',')}%</span> vs. ontem`;
            } else comp = 'Ontem: ' + fmt(d.ontem ? d.ontem.total : 0);
            document.getElementById('kpis').innerHTML = [
                kpi('Vendas hoje', fmt(v.total), 'payments', 'verde', comp),
                kpi('Nº de vendas', v.quantidade, 'receipt', '', d.ontem ? `Ontem: ${d.ontem.quantidade}` : ''),
                kpi('Ticket médio', fmt(v.ticketMedio), 'shopping_bag', '', ''),
                kpi('Caixas abertos', d.caixasAbertos.length, 'account_balance_wallet', d.caixasAbertos.length ? '' : 'ambar', d.caixasAbertos.length ? d.caixasAbertos.map(c => 'Nº ' + c.numero).join(', ') : 'Nenhum aberto'),
                kpi('A receber vencidas', fmt(d.contas.receberVencidas), 'event_busy', d.contas.receberVencidas > 0 ? 'vermelho' : '', `${d.contas.receberVencidasQtd || 0} título(s)`),
                kpi('A pagar vencidas', fmt(d.contas.pagarVencidas), 'warning', d.contas.pagarVencidas > 0 ? 'ambar' : '', `${d.contas.pagarVencidasQtd || 0} título(s)`)
            ].join('');
        }
        function montarHoras(porHora) {
            const ini = 8, fim = 21;
            const faixa = (porHora || []).slice(ini, fim + 1);
            const max = Math.max(...faixa, 0);
            let pico = -1;
            faixa.forEach((v, i) => { if (v > 0 && (pico < 0 || v > faixa[pico])) pico = i; });
            document.getElementById('pico-hora').textContent = pico >= 0 ? `Pico às ${String(ini + pico).padStart(2, '0')}h` : 'Sem vendas hoje';
            document.getElementById('grafico-horas').innerHTML = faixa.map((v, i) => {
                const h = max ? Math.max(v / max * 100, 1.5) : 1.5;
                return `<div class="col"><div class="bar ${v ? '' : 'zero'}" style="height:${h}%" ${v ? `data-v="${fmt(v)}"` : ''}></div><span class="h">${String(ini + i).padStart(2, '0')}h</span></div>`;
            }).join('');
        }
        function montarMetodos(obj) {
            const entradas = Object.entries(obj || {}).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
            const el = document.getElementById('area-metodos');
            if (!entradas.length) { el.innerHTML = '<div class="estado-vazio"><span class="ms">donut_large</span><p>Nenhuma venda hoje.</p></div>'; return; }
            const total = entradas.reduce((s, [, v]) => s + v, 0);
            let acc = 0;
            const fatias = entradas.map(([m, v]) => {
                const a = acc / total * 360; acc += v; const b = acc / total * 360;
                return `${CORES_METODO[m] || '#94A3B8'} ${a}deg ${b}deg`;
            }).join(', ');
            el.innerHTML = `<div class="donut-wrap"><div class="donut" style="background:conic-gradient(${fatias})"><div class="donut-centro"><span>Total</span><b>${fmt(total)}</b></div></div>
                <div class="legenda">${entradas.map(([m, v]) => `<div class="it"><i style="background:${CORES_METODO[m] || '#94A3B8'}"></i><span>${METODOS[m] || esc(m)} · ${(v / total * 100).toFixed(0)}%</span><b>${fmt(v)}</b></div>`).join('')}</div></div>`;
        }
        function montarOperadores(obj) {
            const entradas = Object.entries(obj || {}).sort((a, b) => b[1] - a[1]);
            const el = document.getElementById('area-operadores');
            if (!entradas.length) { el.innerHTML = '<div class="estado-vazio"><span class="ms">person</span><p>Nenhuma venda hoje.</p></div>'; return; }
            const max = Math.max(...entradas.map(([, v]) => v));
            el.innerHTML = entradas.map(([nome, valor]) => `
                <div class="op-linha"><div class="row"><span><b>${esc(nome)}</b></span><span class="num">${fmt(valor)}</span></div>
                <div class="barra-h"><div style="width:${max ? valor / max * 100 : 0}%"></div></div></div>`).join('');
        }
        function montarTop(lista) {
            const el = document.getElementById('area-top');
            if (!lista.length) { el.innerHTML = '<div class="estado-vazio"><span class="ms">leaderboard</span><p>Nenhuma venda hoje.</p></div>'; return; }
            el.innerHTML = '<table><thead><tr><th>Produto</th><th class="right">Qtd</th><th class="right">Total</th></tr></thead><tbody>' +
                lista.slice(0, 6).map(p => `<tr><td>${esc(p.nome)}</td><td class="right">${p.qtd}</td><td class="right">${fmt(p.valor)}</td></tr>`).join('') + '</tbody></table>';
        }
        function montarEstoque(lista) {
            const el = document.getElementById('area-estoque');
            if (!lista.length) { el.innerHTML = '<div class="estado-vazio"><span class="ms" style="color:var(--green)">check_circle</span><p>Nenhum produto com estoque baixo.</p></div>'; return; }
            el.innerHTML = lista.slice(0, 7).map(p => `<div class="it"><span class="nome">${esc(p.nome)}</span><span class="badge ${p.quantidade <= 0 ? 'vencido' : 'baixo'}">${p.quantidade} un</span><small>mín. ${p.minimo}</small></div>`).join('');
        }
        function montarCaixas(lista) {
            const el = document.getElementById('area-caixas');
            if (!lista.length) { el.innerHTML = '<div class="estado-vazio"><span class="ms">lock_clock</span><p>Nenhuma registradora aberta no momento.</p><a class="btn btn-primario" href="/caixa.html">Abrir caixa</a></div>'; return; }
            el.innerHTML = '<table><thead><tr><th>Registradora</th><th>Operador</th><th>Aberto em</th><th>Status</th></tr></thead><tbody>' +
                lista.map(c => `<tr><td><b>Caixa ${String(c.numero).padStart(2, '0')}</b></td><td>${esc(c.operador)}</td><td>${new Date(c.abertoEm).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}</td><td><span class="badge aberto">Aberto</span></td></tr>`).join('') + '</tbody></table>';
        }

        async function carregar() {
            try {
                const d = await api('/api/dashboard');
                montarKpis(d);
                montarHoras(d.vendasHoje.porHora);
                montarMetodos(d.vendasHoje.porMetodo);
                montarOperadores(d.vendasPorOperador);
                montarTop(d.topProdutos);
                montarEstoque(d.estoqueBaixo);
                montarCaixas(d.caixasAbertos);
            } catch (e) { JG.toast(e.message, 'erro'); }
        }

        if (op) {
            montarAtalhos();
            if (op.papel === 'SELLER') {
                document.getElementById('area-caixa').classList.remove('hidden');
                document.getElementById('btn-atualizar').classList.add('hidden');
            } else {
                document.getElementById('area-gestao').classList.remove('hidden');
                document.getElementById('btn-atualizar').onclick = carregar;
                carregar();
            }
        }
    </script>
</body>
</html>
