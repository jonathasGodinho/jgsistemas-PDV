<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Cadastro de Clientes - JG Sistemas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f0f2f5; min-height: 100vh; display: grid; grid-template-rows: 50px 1fr 36px; }
        header { background-color: #0b2545; color: white; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 14px; font-weight: bold; }
        header a { color: #aab2bd; text-decoration: none; font-weight: normal; }
        header a:hover { color: white; }
        main { padding: 20px; max-width: 1200px; margin: 0 auto; width: 100%; }
        .painel { background: white; border: 1px solid #ccd1d9; border-radius: 4px; overflow: hidden; }
        .painel-titulo { background-color: #134074; color: white; padding: 10px 14px; font-weight: bold; text-transform: uppercase; font-size: 13px; }
        .painel-corpo { padding: 14px; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 14px; }
        .toolbar input { flex: 1; padding: 10px; font-size: 14px; border: 1px solid #aab2bd; border-radius: 4px; color: #134074; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background-color: #134074; color: white; padding: 10px; text-align: left; text-transform: uppercase; font-size: 12px; }
        td { padding: 10px; border-bottom: 1px solid #e6e9ed; color: #333; }
        tr:nth-child(even) { background-color: #f8f9fa; }
        tr:hover { background-color: #eef2f7; }
        .btn { border: none; border-radius: 4px; padding: 8px 12px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .btn-azul { background-color: #134074; color: white; }
        .btn-azul:hover { background-color: #0b2545; }
        .btn-verde { background-color: #00a651; color: white; }
        .btn-verde:hover { background-color: #007a3d; }
        .btn-perigo { background-color: #d9534f; color: white; }
        .btn-perigo:hover { background-color: #b0433f; }
        .btn-mini { padding: 4px 8px; font-size: 12px; margin-right: 4px; }
        .situacao { font-weight: bold; }
        .situacao.ativo { color: #00a651; }
        .situacao.inativo { color: #d9534f; }
        .sem-dados { text-align: center; color: #8b95a1; padding: 30px; font-size: 14px; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; border-radius: 6px; width: 640px; max-width: 94vw; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
        .modal-head { background-color: #0b2545; color: white; padding: 14px 18px; font-weight: bold; font-size: 15px; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
        .modal-head .close { cursor: pointer; font-size: 20px; color: #aab2bd; }
        .modal-head .close:hover { color: white; }
        .modal-body { padding: 18px; }
        .modal label { font-size: 12px; color: #656d78; font-weight: bold; display: block; margin: 12px 0 5px; text-transform: uppercase; }
        .modal input, .modal select, .modal textarea { width: 100%; padding: 10px; font-size: 15px; border: 1px solid #aab2bd; border-radius: 4px; color: #134074; background: white; }
        .modal textarea { resize: vertical; font-family: inherit; }
        .modal .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .modal .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .modal-check { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
        .modal-check input { width: auto; }
        .modal-check label { margin: 0; }

        footer { background-color: #134074; color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }

        @media (max-width: 700px) {
            .modal .grid-2, .modal .grid-3 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div>JG SISTEMAS - CADASTRO DE CLIENTES</div>
        <div><a href="/">← Menu Principal</a></div>
    </header>

    <main>
        <div class="painel">
            <div class="painel-titulo">Clientes</div>
            <div class="painel-corpo">
                <div class="toolbar">
                    <input type="text" id="busca" placeholder="Buscar por nome, documento ou telefone...">
                    <button class="btn btn-azul" onclick="buscarClientes()">Buscar</button>
                    <button class="btn btn-verde" onclick="abrirModalCliente()">Novo Cliente</button>
                </div>
                <div class="table-container" style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Documento</th>
                                <th>Telefone</th>
                                <th>Cidade</th>
                                <th style="text-align: right;">Limite</th>
                                <th>Vendas</th>
                                <th>Situação</th>
                                <th style="text-align: center;">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-clientes">
                            <tr><td colspan="8" class="sem-dados">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer>© 2026 JG Sistemas</footer>

    <!-- Modal de cliente -->
    <div class="modal-overlay" id="modal-cliente">
        <div class="modal">
            <div class="modal-head">
                <span id="modal-titulo">Novo Cliente</span>
                <span class="close" onclick="fecharModalCliente()">&times;</span>
            </div>
            <div class="modal-body">
                <input type="hidden" id="c-id">
                <label>Nome do Cliente *</label>
                <input type="text" id="c-nome" placeholder="Ex.: MARIA DA SILVA">

                <div class="grid-2">
                    <div>
                        <label>Documento (CPF/CNPJ)</label>
                        <input type="text" id="c-documento" placeholder="Ex.: 123.456.789-00">
                    </div>
                    <div>
                        <label>Nascimento</label>
                        <input type="date" id="c-nascimento">
                    </div>
                </div>

                <div class="grid-2">
                    <div>
                        <label>Email</label>
                        <input type="email" id="c-email" placeholder="cliente@email.com">
                    </div>
                    <div>
                        <label>Limite de Crédito</label>
                        <input type="text" id="c-limite" placeholder="0,00" inputmode="decimal">
                    </div>
                </div>

                <div class="grid-2">
                    <div>
                        <label>Telefone</label>
                        <input type="text" id="c-telefone" placeholder="(00) 0000-0000">
                    </div>
                    <div>
                        <label>Celular</label>
                        <input type="text" id="c-celular" placeholder="(00) 00000-0000">
                    </div>
                </div>

                <div class="grid-3">
                    <div>
                        <label>CEP</label>
                        <input type="text" id="c-cep" placeholder="00000-000">
                    </div>
                    <div>
                        <label>Endereço</label>
                        <input type="text" id="c-endereco" placeholder="Rua/Av.">
                    </div>
                    <div>
                        <label>Número</label>
                        <input type="text" id="c-numero" placeholder="123">
                    </div>
                </div>

                <div class="grid-2">
                    <div>
                        <label>Complemento</label>
                        <input type="text" id="c-complemento" placeholder="Apto, bloco...">
                    </div>
                    <div>
                        <label>Bairro</label>
                        <input type="text" id="c-bairro" placeholder="Centro">
                    </div>
                </div>

                <div class="grid-3">
                    <div>
                        <label>Cidade</label>
                        <input type="text" id="c-cidade" placeholder="São Paulo">
                    </div>
                    <div>
                        <label>Estado (UF)</label>
                        <input type="text" id="c-estado" placeholder="SP" maxlength="2">
                    </div>
                </div>

                <label>Tabela de Preço</label>
                <select id="c-price-table">
                    <option value="">Sem tabela (tabela padrão)</option>
                </select>

                <label>Observações</label>
                <textarea id="c-observacoes" rows="2" placeholder="Anotações sobre o cliente..."></textarea>

                <div class="modal-check">
                    <input type="checkbox" id="c-ativo" checked>
                    <label for="c-ativo">Cliente ativo</label>
                </div>

                <button class="btn btn-azul" style="width: 100%; margin-top: 16px; padding: 13px; font-size: 15px;" onclick="salvarCliente()">Salvar Cliente</button>
            </div>
        </div>
    </div>

    <!-- Modal de análise de crédito -->
    <div class="modal-overlay" id="modal-credito">
        <div class="modal">
            <div class="modal-head">
                <span>Análise de Crédito</span>
                <span class="close" onclick="fecharModalCredito()">&times;</span>
            </div>
            <div class="modal-body">
                <input type="hidden" id="credit-cliente-id">
                <label>Cliente</label>
                <input type="text" id="credit-cliente" disabled>

                <div class="grid-2">
                    <div>
                        <label>Limite Atual</label>
                        <input type="text" id="credit-limite-atual" disabled>
                    </div>
                    <div>
                        <label>Limite Sugerido</label>
                        <input type="text" id="credit-limite-sugerido" disabled>
                    </div>
                </div>

                <div class="grid-2">
                    <div>
                        <label>Score (0 - 100)</label>
                        <input type="text" id="credit-score" disabled>
                    </div>
                    <div>
                        <label>Faixa de Risco</label>
                        <input type="text" id="credit-faixa" disabled>
                    </div>
                </div>

                <label>Última Análise Aplicada</label>
                <input type="text" id="credit-ultima" disabled>

                <button class="btn btn-verde" style="width: 100%; margin-top: 16px; padding: 13px; font-size: 15px;" onclick="aplicarLimiteCredito()">Aplicar Limite Sugerido</button>
            </div>
        </div>
    </div>

    <script src="/seguranca.js"></script>
    <script>
        const API_BASE = '';
        let clientes = [];
        let tabelasPreco = [];

        function formatarMoeda(valor) {
            return `R$ ${Number(valor).toFixed(2).replace('.', ',')}`;
        }

        function obterOperador() {
            try {
                const raw = localStorage.getItem('jg_operador');
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }

        function tokenAuth() {
            const op = obterOperador();
            return op && op.token ? { 'Authorization': 'Bearer ' + op.token } : {};
        }

        function bloquearCaixa() {
            const op = obterOperador();
            if (!op) { window.location.href = '/login.html'; return true; }
            if (op.papel === 'SELLER') { window.location.href = '/'; return true; }
            return false;
        }

        async function api(url, metodo = 'GET', corpo = null) {
            const opcoes = { method: metodo, headers: Object.assign({ 'Content-Type': 'application/json' }, tokenAuth()) };
            if (corpo) opcoes.body = JSON.stringify(corpo);
            const response = await fetch(`${API_BASE}${url}`, opcoes);
            if (response.status === 401) {
                localStorage.removeItem('jg_operador');
                window.location.href = '/login.html';
                throw new Error('Sessão expirada.');
            }
            const dados = await response.json();
            if (!response.ok) throw new Error(dados.erro || 'Erro na requisição');
            return dados;
        }

        bloquearCaixa();

        async function buscarClientes() {
            const busca = document.getElementById('busca').value.trim();
            const url = busca ? `/api/clientes?busca=${encodeURIComponent(busca)}` : '/api/clientes';
            try {
                clientes = await api(url);
                renderizarClientes();
            } catch (e) { alert(e.message); }
        }

        function renderizarClientes() {
            const tbody = document.getElementById('tabela-clientes');
            if (clientes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="sem-dados">Nenhum cliente encontrado</td></tr>';
                return;
            }
            tbody.innerHTML = clientes.map(c => `
                <tr>
                    <td><strong>${esc(c.nome)}</strong><br><small style="color:#8b95a1;">${esc(c.email || '')}</small></td>
                    <td>${esc(c.documento || '-')}</td>
                    <td>${esc(c.celular || c.telefone || '-')}</td>
                    <td>${esc(c.cidade || '-')}</td>
                    <td style="text-align: right;">${formatarMoeda(c.limite)}</td>
                    <td style="text-align: center;">${c.vendas}</td>
                    <td><span class="situacao ${c.ativo ? 'ativo' : 'inativo'}">${c.ativo ? 'ATIVO' : 'INATIVO'}</span></td>
                    <td style="text-align: center;">
                        <button class="btn btn-mini btn-azul" onclick="abrirModalCliente('${c.id}')">Editar</button>
                        <button class="btn btn-mini btn-verde" onclick="abrirAnaliseCredito('${c.id}', '${esc(c.nome)}')">Crédito</button>
                        <button class="btn btn-mini btn-perigo" onclick="excluirCliente('${c.id}', '${esc(c.nome)}')">Excluir</button>
                    </td>
                </tr>
            `).join('');
        }

        async function carregarTabelas() {
            try {
                tabelasPreco = await api('/api/tabelas-preco');
                const select = document.getElementById('c-price-table');
                const atual = select.value;
                select.innerHTML = '<option value="">Sem tabela (tabela padrão)</option>' + tabelasPreco.map(t =>
                    `<option value="${t.id}">${esc(t.nome)}${t.padrao ? ' (padrão)' : ''}</option>`
                ).join('');
                select.value = atual;
            } catch (e) {
                console.warn('Falha ao carregar tabelas de preço:', e.message);
            }
        }

        function abrirModalCliente(id = null) {
            document.getElementById('modal-titulo').innerText = id ? 'Editar Cliente' : 'Novo Cliente';
            document.getElementById('c-id').value = id || '';
            const campos = ['c-nome', 'c-documento', 'c-nascimento', 'c-email', 'c-limite', 'c-telefone', 'c-celular', 'c-cep', 'c-endereco', 'c-numero', 'c-complemento', 'c-bairro', 'c-cidade', 'c-estado', 'c-observacoes'];
            campos.forEach(campo => document.getElementById(campo).value = '');
            document.getElementById('c-ativo').checked = true;
            document.getElementById('c-price-table').value = '';

            if (id) {
                const c = clientes.find(x => x.id === id);
                if (c) {
                    document.getElementById('c-nome').value = c.nome;
                    document.getElementById('c-documento').value = c.documento || '';
                    if (c.nascimento) {
                        const dt = new Date(c.nascimento);
                        document.getElementById('c-nascimento').value = dt.toISOString().slice(0, 10);
                    }
                    document.getElementById('c-email').value = c.email || '';
                    document.getElementById('c-limite').value = String(c.limite).replace('.', ',');
                    document.getElementById('c-telefone').value = c.telefone || '';
                    document.getElementById('c-celular').value = c.celular || '';
                    document.getElementById('c-cep').value = c.cep || '';
                    document.getElementById('c-endereco').value = c.endereco || '';
                    document.getElementById('c-numero').value = c.numero || '';
                    document.getElementById('c-complemento').value = c.complemento || '';
                    document.getElementById('c-bairro').value = c.bairro || '';
                    document.getElementById('c-cidade').value = c.cidade || '';
                    document.getElementById('c-estado').value = c.estado || '';
                    document.getElementById('c-observacoes').value = c.observacoes || '';
                    document.getElementById('c-price-table').value = c.priceTableId || '';
                    document.getElementById('c-ativo').checked = c.ativo;
                }
            }

            document.getElementById('modal-cliente').classList.add('active');
        }

        function fecharModalCliente() {
            document.getElementById('modal-cliente').classList.remove('active');
        }

        function parseMoeda(valor) {
            return parseFloat(String(valor).replace(',', '.')) || 0;
        }

        async function salvarCliente() {
            const id = document.getElementById('c-id').value;
            const corpo = {
                nome: document.getElementById('c-nome').value.trim(),
                documento: document.getElementById('c-documento').value.trim(),
                nascimento: document.getElementById('c-nascimento').value || null,
                email: document.getElementById('c-email').value.trim(),
                limite: parseMoeda(document.getElementById('c-limite').value),
                telefone: document.getElementById('c-telefone').value.trim(),
                celular: document.getElementById('c-celular').value.trim(),
                cep: document.getElementById('c-cep').value.trim(),
                endereco: document.getElementById('c-endereco').value.trim(),
                numero: document.getElementById('c-numero').value.trim(),
                complemento: document.getElementById('c-complemento').value.trim(),
                bairro: document.getElementById('c-bairro').value.trim(),
                cidade: document.getElementById('c-cidade').value.trim(),
                estado: document.getElementById('c-estado').value.trim().toUpperCase(),
                observacoes: document.getElementById('c-observacoes').value.trim(),
                priceTableId: document.getElementById('c-price-table').value || null,
                ativo: document.getElementById('c-ativo').checked
            };

            if (!corpo.nome) { alert("Informe o nome do cliente!"); return; }

            try {
                if (id) {
                    await api(`/api/clientes/${id}`, 'PUT', corpo);
                } else {
                    await api('/api/clientes', 'POST', corpo);
                }
                fecharModalCliente();
                await buscarClientes();
            } catch (e) { alert(e.message); }
        }

        async function excluirCliente(id, nome) {
            if (!confirm(`Excluir o cliente "${nome}"?`)) return;
            try {
                await api(`/api/clientes/${id}`, 'DELETE');
                await buscarClientes();
            } catch (e) { alert(e.message); }
        }

        async function abrirAnaliseCredito(id, nome) {
            document.getElementById('credit-cliente-id').value = id;
            document.getElementById('credit-cliente').value = nome;
            document.getElementById('credit-limite-atual').value = '';
            document.getElementById('credit-limite-sugerido').value = '';
            document.getElementById('credit-score').value = '';
            document.getElementById('credit-faixa').value = '';
            document.getElementById('credit-ultima').value = 'Carregando...';
            document.getElementById('modal-credito').classList.add('active');
            try {
                const r = await api(`/api/clientes/${id}/analise-credito`);
                document.getElementById('credit-limite-atual').value = formatarMoeda(r.limiteAtual);
                document.getElementById('credit-limite-sugerido').value = formatarMoeda(r.limiteSugerido);
                document.getElementById('credit-score').value = `${r.score}/100`;
                document.getElementById('credit-faixa').value = r.faixa;
                document.getElementById('credit-ultima').value = r.ultimaAnalise
                    ? `Score ${r.ultimaAnalise.score}/100 - Limite ${formatarMoeda(r.ultimaAnalise.limite)} em ${new Date(r.ultimaAnalise.data).toLocaleString('pt-BR')}`
                    : 'Nenhuma análise aplicada';
            } catch (e) {
                document.getElementById('credit-ultima').value = 'Falha ao carregar: ' + e.message;
            }
        }

        function fecharModalCredito() {
            document.getElementById('modal-credito').classList.remove('active');
        }

        async function aplicarLimiteCredito() {
            const id = document.getElementById('credit-cliente-id').value;
            const senhaAdmin = prompt('Informe a senha do administrador para aplicar o limite sugerido:');
            if (senhaAdmin === null) return;
            try {
                const r = await api(`/api/clientes/${id}/analise-credito/aplicar`, 'POST', { senhaAdmin });
                alert(`Limite de crédito atualizado para ${formatarMoeda(r.limite)} (score ${r.score}).`);
                fecharModalCredito();
                await buscarClientes();
            } catch (e) { alert(e.message); }
        }

        document.getElementById('busca').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') buscarClientes();
        });

        (async () => {
            try {
                await Promise.all([buscarClientes(), carregarTabelas()]);
            } catch (e) {
                alert("Falha ao carregar dados: " + e.message);
            }
        })();
    </script>
</body>
</html>
