<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Clientes - JG Sistemas</title>
    <link rel="stylesheet" href="/ui/jg.css">
    <style>
        .cel-cli { display: flex; align-items: center; gap: 10px; }
        .cel-cli .jg-avatar { width: 32px; height: 32px; font-size: 11px; background: var(--primary-soft); color: var(--primary); }
        .cel-cli b { display: block; font-weight: 600; }
        .filtros select { width: 170px; }
    </style>
</head>
<body class="jg" data-pagina="clientes">
    <main>
        <div class="page-head">
            <div><h1>Clientes</h1><div class="sub" id="contador">Carregando...</div></div>
            <div class="acoes"><a class="btn btn-sucesso" href="/cliente.html"><span class="ms">person_add</span>Novo cliente</a></div>
        </div>

        <div class="card">
            <div class="card-body" style="padding-bottom:0">
                <div class="filtros">
                    <div class="input-icone" style="flex:1;min-width:260px"><span class="ms">search</span><input type="text" id="busca" placeholder="Buscar por nome, documento ou telefone"></div>
                    <select id="f-situacao" aria-label="Situação"><option value="">Todas as situações</option><option value="ativo">Ativos</option><option value="inativo">Inativos</option></select>
                    <select id="f-cidade" aria-label="Cidade"><option value="">Todas as cidades</option></select>
                    <label class="chip" id="chip-inad"><input type="checkbox" id="f-inadimplentes" class="hidden">Inadimplentes</label>
                    <label class="chip" id="chip-cash"><input type="checkbox" id="f-cashback" class="hidden">Com saldo de cashback</label>
                </div>
            </div>
            <div class="tabela-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>CPF/CNPJ</th>
                            <th>Celular</th>
                            <th>Cidade</th>
                            <th class="right">Limite de crédito</th>
                            <th class="right">Total comprado</th>
                            <th>Situação</th>
                            <th class="acoes">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-clientes">
                        <tr><td colspan="8" class="sem-dados">Carregando...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="paginacao"><span id="pag-info"></span><div class="row" style="gap:6px"><button class="btn btn-sm" id="pag-ant"><span class="ms">chevron_left</span></button><button class="btn btn-sm" id="pag-prox"><span class="ms">chevron_right</span></button></div></div>
        </div>
    </main>

    <script src="/seguranca.js"></script>
    <script src="/ui/shell.js"></script>
    <script>
        let clientes = [];
        let pagina = 0;
        const POR_PAGINA = 25;
        const $ = (id) => document.getElementById(id);

        function formatarMoeda(valor) {
            return Number(valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }
        function obterOperador() { return JG.operador(); }
        function bloquearCaixa() {
            const op = obterOperador();
            if (!op) { window.location.href = '/login.html'; return true; }
            if (op.papel === 'SELLER') { window.location.href = '/'; return true; }
            return false;
        }
        async function api(url, metodo = 'GET', corpo = null) {
            const opcoes = { method: metodo, headers: { 'Content-Type': 'application/json' } };
            if (corpo) opcoes.body = JSON.stringify(corpo);
            const response = await fetch(url, opcoes);
            if (response.status === 401) {
                localStorage.removeItem('jg_operador');
                window.location.href = '/login.html';
                throw new Error('Sessão expirada.');
            }
            const dados = await response.json();
            if (!response.ok) throw new Error(dados.erro || 'Erro na requisição');
            return dados;
        }
        bloquearCaixa();

        async function buscarClientes() {
            const busca = $('busca').value.trim();
            const url = busca ? `/api/clientes?busca=${encodeURIComponent(busca)}` : '/api/clientes';
            try {
                clientes = await api(url);
                const cidades = [...new Set(clientes.map(c => (c.cidade || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
                const atual = $('f-cidade').value;
                $('f-cidade').innerHTML = '<option value="">Todas as cidades</option>' + cidades.map(c => `<option>${esc(c)}</option>`).join('');
                $('f-cidade').value = cidades.includes(atual) ? atual : '';
                pagina = 0;
                renderizarClientes();
            } catch (e) { alert(e.message); }
        }

        function filtrados() {
            const sit = $('f-situacao').value, cid = $('f-cidade').value;
            const inad = $('f-inadimplentes').checked, cash = $('f-cashback').checked;
            return clientes.filter(c => (!sit || (sit === 'ativo') === !!c.ativo) && (!cid || (c.cidade || '').trim() === cid) &&
                (!inad || c.inadimplente) && (!cash || c.cashback > 0));
        }

        function renderizarClientes() {
            const tbody = $('tabela-clientes');
            const lista = filtrados();
            const inad = clientes.filter(c => c.inadimplente).length;
            $('contador').textContent = `${clientes.length.toLocaleString('pt-BR')} cliente(s)` + (inad ? ` · ${inad} inadimplente(s)` : '');
            $('chip-inad').classList.toggle('ativo', $('f-inadimplentes').checked);
            $('chip-cash').classList.toggle('ativo', $('f-cashback').checked);
            if (!lista.length) {
                tbody.innerHTML = `<tr><td colspan="8"><div class="estado-vazio"><span class="ms">group</span><p>${clientes.length ? 'Nenhum cliente com esses filtros.' : 'Nenhum cliente cadastrado ainda.'}</p><a class="btn btn-sucesso" href="/cliente.html"><span class="ms">person_add</span>Novo cliente</a></div></td></tr>`;
                $('pag-info').textContent = '';
                return;
            }
            const maxPag = Math.max(0, Math.ceil(lista.length / POR_PAGINA) - 1);
            pagina = Math.min(pagina, maxPag);
            const ini = pagina * POR_PAGINA;
            const pag = lista.slice(ini, ini + POR_PAGINA);
            $('pag-info').textContent = `${ini + 1}–${ini + pag.length} de ${lista.length.toLocaleString('pt-BR')}`;
            $('pag-ant').disabled = pagina === 0;
            $('pag-prox').disabled = pagina >= maxPag;
            tbody.innerHTML = pag.map(c => {
                const situacao = c.inadimplente
                    ? `<span class="badge vencido" title="Em atraso: ${formatarMoeda(c.emAtraso)}">Inadimplente</span>`
                    : `<span class="badge ${c.ativo ? 'ativo' : 'inativo'}">${c.ativo ? 'Ativo' : 'Inativo'}</span>`;
                return `<tr>
                    <td><div class="cel-cli"><div class="jg-avatar">${esc(JG.iniciais(c.nome))}</div><div><b>${esc(c.nome)}</b><small>${esc(c.email || '')}${c.cashback > 0 ? ` <span class="txt-verde">· Cashback ${formatarMoeda(c.cashback)}</span>` : ''}</small></div></div></td>
                    <td class="num">${esc(c.documento || '—')}</td>
                    <td class="num">${esc(c.celular || c.telefone || '—')}</td>
                    <td>${esc([c.cidade, c.estado].filter(Boolean).join('/') || '—')}</td>
                    <td class="right">${formatarMoeda(c.limite)}</td>
                    <td class="right">${formatarMoeda(c.totalComprado)}<br><small>${c.vendas} compra(s)</small></td>
                    <td>${situacao}</td>
                    <td class="acoes">
                        <a class="btn-icone" title="Ver ficha" href="/cliente.html?id=${encodeURIComponent(c.id)}"><span class="ms">visibility</span></a>
                        <a class="btn-icone" title="Análise de crédito" href="/cliente.html?id=${encodeURIComponent(c.id)}#credito"><span class="ms">credit_score</span></a>
                        <button class="btn-icone perigo" title="Excluir" onclick="excluirCliente('${c.id}', '${esc(c.nome)}')"><span class="ms">delete</span></button>
                    </td>
                </tr>`;
            }).join('');
        }

        async function excluirCliente(id, nome) {
            if (!confirm(`Excluir o cliente "${nome}"?`)) return;
            try {
                await api(`/api/clientes/${id}`, 'DELETE');
                JG.toast('Cliente excluído.', 'sucesso');
                await buscarClientes();
            } catch (e) { alert(e.message); }
        }

        $('busca').addEventListener('keydown', (e) => { if (e.key === 'Enter') buscarClientes(); });
        let atraso = null;
        $('busca').addEventListener('input', () => { clearTimeout(atraso); atraso = setTimeout(buscarClientes, 350); });
        ['f-situacao', 'f-cidade', 'f-inadimplentes', 'f-cashback'].forEach(id => $(id).addEventListener('change', () => { pagina = 0; renderizarClientes(); }));
        $('pag-ant').onclick = () => { pagina--; renderizarClientes(); };
        $('pag-prox').onclick = () => { pagina++; renderizarClientes(); };

        (async () => {
            const qs = new URLSearchParams(location.search);
            if (qs.get('novo')) { location.href = '/cliente.html'; return; }
            if (qs.get('busca')) $('busca').value = qs.get('busca');
            if (qs.get('inadimplentes')) $('f-inadimplentes').checked = true;
            await buscarClientes();
        })();
    </script>
</body>
</html>
