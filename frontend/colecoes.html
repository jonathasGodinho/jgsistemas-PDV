<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Coleções - JG Sistemas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f0f2f5; min-height: 100vh; display: grid; grid-template-rows: 50px 1fr 36px; }
        header { background-color: #0b2545; color: white; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 14px; font-weight: bold; }
        header a { color: #aab2bd; text-decoration: none; font-weight: normal; }
        header a:hover { color: white; }
        main { padding: 20px; max-width: 1000px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 20px; }
        .grid { display: grid; grid-template-columns: 340px 1fr; gap: 20px; align-items: start; }
        @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
        .painel { background: white; border: 1px solid #ccd1d9; border-radius: 4px; overflow: hidden; }
        .painel-titulo { background-color: #134074; color: white; padding: 10px 14px; font-weight: bold; text-transform: uppercase; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .painel-corpo { padding: 14px; }
        .campo { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .campo label { font-size: 11px; color: #656d78; font-weight: bold; text-transform: uppercase; }
        .campo input, .campo select { padding: 9px; font-size: 14px; border: 1px solid #aab2bd; border-radius: 4px; color: #134074; width: 100%; background: white; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background-color: #134074; color: white; padding: 8px; text-align: left; text-transform: uppercase; font-size: 11px; }
        td { padding: 8px; border-bottom: 1px solid #e6e9ed; color: #333; }
        tr:nth-child(even) { background-color: #f8f9fa; }
        .btn { border: none; border-radius: 4px; padding: 8px 12px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .btn-azul { background-color: #134074; color: white; }
        .btn-verde { background-color: #00a651; color: white; }
        .btn-perigo { background-color: #d9534f; color: white; }
        .btn-mini { padding: 4px 8px; font-size: 12px; }
        .btn-block { width: 100%; padding: 12px; font-size: 15px; }
        .sem-dados { text-align: center; color: #8b95a1; padding: 24px; font-size: 14px; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 3px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .b-verde { background: #d8f3e3; color: #008c45; }
        .b-cinza { background: #e6e9ed; color: #656d78; }
    </style>
</head>
<body>

    <header>
        <div>JG SISTEMAS - COLEÇÕES</div>
        <div><a href="/">← Menu Principal</a></div>
    </header>

    <main>
        <div class="grid">
            <div class="painel">
                <div class="painel-titulo"><span id="titulo-form">Nova Coleção</span></div>
                <div class="painel-corpo">
                    <div class="campo">
                        <label>Nome da coleção *</label>
                        <input type="text" id="f-nome" placeholder="Ex.: VERÃO 2026">
                    </div>
                    <div class="campo">
                        <label>Temporada</label>
                        <select id="f-temporada">
                            <option value="">Selecione...</option>
                            <option value="VERAO">Verão</option>
                            <option value="INVERNO">Inverno</option>
                            <option value="PRIMAVERA">Primavera</option>
                            <option value="OUTONO">Outono</option>
                            <option value="PERMANENTE">Permanente</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label>Ano</label>
                        <input type="number" id="f-ano" min="2000" max="2100" placeholder="Ex.: 2026">
                    </div>
                    <button class="btn btn-verde btn-block" onclick="salvarColecao()">Salvar Coleção</button>
                    <button class="btn btn-azul btn-block" id="btn-cancelar-edit" onclick="cancelarEdicao()" style="display:none;">Cancelar edição</button>
                </div>
            </div>

            <div class="painel">
                <div class="painel-titulo"><span>Coleções Cadastradas</span></div>
                <div class="painel-corpo">
                    <div style="overflow-x:auto;">
                        <table>
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Temporada</th>
                                    <th style="text-align:right;">Ano</th>
                                    <th style="text-align:right;">Produtos</th>
                                    <th>Status</th>
                                    <th style="text-align:center;">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-colecoes">
                                <tr><td colspan="6" class="sem-dados">Carregando...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>© 2026 JG Sistemas</footer>

    <script src="/seguranca.js"></script>
    <script>
        const API_BASE = '';

        function obterOperador() {
            try {
                const raw = localStorage.getItem('jg_operador');
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }
        function tokenAuth() {
            const op = obterOperador();
            return op && op.token ? { 'Authorization': 'Bearer ' + op.token } : {};
        }
        function bloquear() {
            const op = obterOperador();
            if (!op) { window.location.href = '/login.html'; return true; }
            if (op.papel === 'SELLER') { window.location.href = '/'; return true; }
            return false;
        }
        async function api(url, metodo = 'GET', corpo = null) {
            const opcoes = { method: metodo, headers: Object.assign({ 'Content-Type': 'application/json' }, tokenAuth()) };
            if (corpo) opcoes.body = JSON.stringify(corpo);
            const response = await fetch(`${API_BASE}${url}`, opcoes);
            if (response.status === 401) {
                localStorage.removeItem('jg_operador');
                window.location.href = '/login.html';
                throw new Error('Sessão expirada.');
            }
            const dados = await response.json();
            if (!response.ok) throw new Error(dados.erro || 'Erro na requisição');
            return dados;
        }
        bloquear();

        let editandoId = null;

        async function carregarColecoes() {
            try {
                const colecoes = await api('/api/colecoes');
                const tbody = document.getElementById('tabela-colecoes');
                if (colecoes.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="sem-dados">Nenhuma coleção cadastrada</td></tr>';
                    return;
                }
                tbody.innerHTML = colecoes.map(c => `
                    <tr>
                        <td><strong>${esc(c.nome)}</strong></td>
                        <td>${esc(c.temporada || '-')}</td>
                        <td style="text-align:right;">${c.ano || '-'}</td>
                        <td style="text-align:right;">${c.produtos}</td>
                        <td><span class="badge ${c.ativo ? 'b-verde' : 'b-cinza'}">${c.ativo ? 'Ativa' : 'Inativa'}</span></td>
                        <td style="text-align:center;">
                            <button class="btn btn-mini btn-azul" onclick="editarColecao(${esc(JSON.stringify(c))})">Editar</button>
                            <button class="btn btn-mini btn-perigo" onclick="excluirColecao('${c.id}', '${esc(c.nome.replace(/'/g, "\\'"))}')">Excluir</button>
                        </td>
                    </tr>`).join('');
            } catch (e) { alert(e.message); }
        }

        async function salvarColecao() {
            const nome = document.getElementById('f-nome').value.trim();
            if (!nome) { alert('Informe o nome da coleção!'); return; }
            const corpo = {
                nome,
                temporada: document.getElementById('f-temporada').value || undefined,
                ano: document.getElementById('f-ano').value ? Number(document.getElementById('f-ano').value) : undefined
            };
            try {
                if (editandoId) {
                    await api(`/api/colecoes/${editandoId}`, 'PUT', corpo);
                } else {
                    await api('/api/colecoes', 'POST', corpo);
                }
                cancelarEdicao();
                carregarColecoes();
            } catch (e) { alert(e.message); }
        }

        function editarColecao(c) {
            editandoId = c.id;
            document.getElementById('f-nome').value = c.nome;
            document.getElementById('f-temporada').value = c.temporada || '';
            document.getElementById('f-ano').value = c.ano || '';
            document.getElementById('titulo-form').innerText = 'Editar Coleção';
            document.getElementById('btn-cancelar-edit').style.display = 'block';
        }

        function cancelarEdicao() {
            editandoId = null;
            document.getElementById('f-nome').value = '';
            document.getElementById('f-temporada').value = '';
            document.getElementById('f-ano').value = '';
            document.getElementById('titulo-form').innerText = 'Nova Coleção';
            document.getElementById('btn-cancelar-edit').style.display = 'none';
        }

        async function excluirColecao(id, nome) {
            if (!confirm(`Excluir a coleção "${nome}"?`)) return;
            try {
                await api(`/api/colecoes/${id}`, 'DELETE');
                carregarColecoes();
            } catch (e) { alert(e.message); }
        }

        carregarColecoes();
    </script>
</body>
</html>
