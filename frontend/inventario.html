<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Inventário - JG Sistemas</title>
    <style>
        .inv-grid { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 16px; align-items: start; }
        @media (max-width: 1100px) { .inv-grid { grid-template-columns: 1fr; } }
        .oculto { display: none; }
        body.jg .qtd-input { width: 90px; height: 34px; text-align: center; }
        .div-pos { color: var(--green); font-weight: 700; }
        .div-neg { color: var(--red); font-weight: 700; }
        .divergencia { font-weight: 700; }
        tbody tr.sel-contagem { background: var(--primary-soft); }
    </style>
    <link rel="stylesheet" href="/ui/jg.css">
</head>
<body class="jg" data-pagina="inventario">
    <main>
        <div class="page-head">
            <div><h1>Inventário</h1><div class="sub">Contagem de estoque e ajuste das divergências</div></div>
        </div>
        <div class="inv-grid">
            <div class="stack">
                <div class="card">
                    <div class="card-head"><h3>Abrir nova contagem</h3></div>
                    <div class="card-body">
                        <div class="campo"><label for="f-nome">Nome da contagem</label><input type="text" id="f-nome" placeholder="Ex.: Inventário Outubro – Jeans"></div>
                        <button class="btn btn-sucesso btn-bloco" id="btn-abrir" onclick="abrirContagem()"><span class="ms">add</span>Abrir nova contagem</button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-head"><h3>Contagens</h3></div>
                    <div class="tabela-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Status</th>
                                    <th class="right">Conferidos</th>
                                    <th class="acoes"></th>
                                </tr>
                            </thead>
                            <tbody id="tabela-contagens">
                                <tr><td colspan="4" class="sem-dados">Carregando...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-head"><h3 id="titulo-detalhe">Conferência da contagem</h3><span id="badge-status"></span></div>
                <div class="card-body">
                    <div id="sem-selecao" class="estado-vazio"><span class="ms">fact_check</span><p>Selecione uma contagem para conferir.</p></div>
                    <div id="detalhe" class="oculto">
                        <div class="row between mb-16">
                            <span class="muted" style="font-size:13px" id="resumo-contagem"></span>
                            <div class="row" style="gap:8px">
                                <button class="btn btn-contorno-perigo btn-sm" id="btn-excluir" onclick="excluirContagem()"><span class="ms">close</span>Cancelar contagem</button>
                                <button class="btn btn-sucesso" id="btn-finalizar" onclick="finalizarContagem()"><span class="ms">done_all</span>Finalizar e aplicar ajustes</button>
                            </div>
                        </div>
                        <div class="progresso mb-16"><div id="barra-progresso" style="width:0"></div></div>
                        <div class="tabela-wrap" style="border:1px solid var(--border)">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Produto</th>
                                        <th class="right">Esperado</th>
                                        <th class="center">Contado</th>
                                        <th class="right">Divergência</th>
                                    </tr>
                                </thead>
                                <tbody id="tabela-conferencia">
                                    <tr><td colspan="4" class="sem-dados">Carregando...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="/seguranca.js"></script>
    <script src="/ui/shell.js"></script>
    <script>
        const API_BASE = '';

        function obterOperador() {
            try {
                const raw = localStorage.getItem('jg_operador');
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }
        function tokenAuth() {
            const op = obterOperador();
            return op && op.token ? { 'Authorization': 'Bearer ' + op.token } : {};
        }
        function bloquear() {
            const op = obterOperador();
            if (!op) { window.location.href = '/login.html'; return true; }
            if (op.papel === 'SELLER') { window.location.href = '/'; return true; }
            return false;
        }
        async function api(url, metodo = 'GET', corpo = null) {
            const opcoes = { method: metodo, headers: Object.assign({ 'Content-Type': 'application/json' }, tokenAuth()) };
            if (corpo) opcoes.body = JSON.stringify(corpo);
            const response = await fetch(`${API_BASE}${url}`, opcoes);
            if (response.status === 401) {
                localStorage.removeItem('jg_operador');
                window.location.href = '/login.html';
                throw new Error('Sessão expirada.');
            }
            const dados = await response.json();
            if (!response.ok) throw new Error(dados.erro || 'Erro na requisição');
            return dados;
        }
        bloquear();

        let contagemSelecionada = null;

        async function carregarContagens() {
            try {
                const lista = await api('/api/inventario');
                const tbody = document.getElementById('tabela-contagens');
                if (lista.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4"><div class="estado-vazio"><span class="ms">inventory</span><p>Nenhuma contagem ainda.</p></div></td></tr>';
                    document.getElementById('btn-abrir').disabled = false;
                    return;
                }
                const temAberta = lista.some(c => c.status === 'OPEN');
                document.getElementById('btn-abrir').disabled = temAberta;
                document.getElementById('btn-abrir').innerHTML = temAberta ? '<span class="ms">lock</span>Há uma contagem em aberto' : '<span class="ms">add</span>Abrir nova contagem';
                const selId = contagemSelecionada ? contagemSelecionada.id : null;
                tbody.innerHTML = lista.map(c => `
                    <tr class="${c.id === selId ? 'sel-contagem' : ''}" style="cursor:pointer" onclick="abrirDetalhe('${c.id}')">
                        <td><b>${esc(c.nome)}</b><br><small>${new Date(c.criadoEm).toLocaleDateString('pt-BR')}</small></td>
                        <td>
                            ${c.status === 'OPEN'
                                ? `<span class="badge pendente">Em andamento</span>`
                                : `<span class="badge ativo">Finalizada</span>`}
                            ${c.divergencias > 0 ? ` <span class="badge vencido sem-ponto">${c.divergencias} div.</span>` : ''}
                        </td>
                        <td class="right">${c.conferidos}/${c.totalItens}</td>
                        <td class="acoes"><button class="btn-icone" title="Conferir"><span class="ms">chevron_right</span></button></td>
                    </tr>`).join('');
            } catch (e) { alert(e.message); }
        }

        async function abrirContagem() {
            const nome = document.getElementById('f-nome').value.trim();
            try {
                const r = await api('/api/inventario', 'POST', { nome });
                document.getElementById('f-nome').value = '';
                alert(`Contagem "${r.nome}" aberta com ${r.itens} itens!`);
                carregarContagens();
                abrirDetalhe(r.id);
            } catch (e) { alert(e.message); }
        }

        async function abrirDetalhe(id) {
            try {
                const c = await api(`/api/inventario/${id}`);
                contagemSelecionada = c;
                document.getElementById('sem-selecao').classList.add('oculto');
                document.getElementById('detalhe').classList.remove('oculto');
                document.getElementById('titulo-detalhe').innerText = c.nome;
                document.getElementById('badge-status').innerHTML = c.status === 'OPEN'
                    ? '<span class="badge pendente">Em andamento</span>'
                    : '<span class="badge ativo">Finalizada</span>';
                const conferidos = c.itens.filter(i => i.contado !== null).length;
                const divergencias = c.itens.filter(i => i.divergencia !== null && i.divergencia !== 0).length;
                const pct = c.itens.length ? Math.round(conferidos / c.itens.length * 100) : 0;
                document.getElementById('resumo-contagem').innerHTML =
                    `<b style="color:var(--text)">${pct}%</b> · ${conferidos} de ${c.itens.length} conferidos · ${divergencias} com divergência`;
                document.getElementById('barra-progresso').style.width = pct + '%';
                document.getElementById('btn-finalizar').style.display = c.status === 'OPEN' ? '' : 'none';
                document.getElementById('btn-excluir').style.display = c.status === 'OPEN' ? '' : 'none';

                document.getElementById('tabela-conferencia').innerHTML = c.itens.map((i, idx) => {
                    const div = i.divergencia;
                    return `
                        <tr>
                            <td>
                                <b>${esc(i.produto)}</b><br>
                                <small>${esc(i.codigo ?? '')}</small>
                            </td>
                            <td class="right">${i.esperado}</td>
                            <td class="center">
                                ${c.status === 'OPEN'
                                    ? `<input type="number" class="qtd-input" min="0" value="${i.contado ?? ''}" id="ct-${idx}" data-item="${i.id}" data-inv="${i.inventoryId}">`
                                    : (i.contado ?? '—')}
                            </td>
                            <td class="right ${div === null || div === 0 ? 'muted' : div > 0 ? 'div-pos' : 'div-neg'}">
                                ${div === null ? '—' : (div > 0 ? '+' : '') + div}
                            </td>
                        </tr>`;
                }).join('');
                carregarContagens();
            } catch (e) { alert(e.message); }
        }

        async function salvarContagens() {
            if (!contagemSelecionada || contagemSelecionada.status !== 'OPEN') return;
            const inputs = document.querySelectorAll('#tabela-conferencia .qtd-input');
            for (const input of inputs) {
                const quantidade = input.value === '' ? null : Number(input.value);
                if (quantidade !== null) {
                    await api(`/api/inventario/${contagemSelecionada.id}/contagem`, 'POST', {
                        inventoryId: input.dataset.inv,
                        quantidade
                    });
                }
            }
        }

        async function finalizarContagem() {
            if (!contagemSelecionada) return;
            await salvarContagens();
            if (!confirm('Finalizar a contagem? As divergências serão aplicadas no estoque como ajustes.')) return;
            try {
                const r = await api(`/api/inventario/${contagemSelecionada.id}/finalizar`, 'POST');
                alert(`Contagem finalizada com ${r.ajustes} ajuste(s) aplicado(s)!`);
                abrirDetalhe(contagemSelecionada.id);
                carregarContagens();
            } catch (e) { alert(e.message); }
        }

        async function excluirContagem() {
            if (!contagemSelecionada) return;
            if (!confirm('Cancelar esta contagem em aberto?')) return;
            try {
                await api(`/api/inventario/${contagemSelecionada.id}`, 'DELETE');
                contagemSelecionada = null;
                document.getElementById('sem-selecao').classList.remove('oculto');
                document.getElementById('detalhe').classList.add('oculto');
                carregarContagens();
            } catch (e) { alert(e.message); }
        }

        carregarContagens();
    </script>
</body>
</html>
