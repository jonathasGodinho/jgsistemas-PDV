<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Inventário - JG Sistemas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f0f2f5; min-height: 100vh; display: grid; grid-template-rows: 50px 1fr 36px; }
        header { background-color: #0b2545; color: white; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 14px; font-weight: bold; }
        header a { color: #aab2bd; text-decoration: none; font-weight: normal; }
        header a:hover { color: white; }
        main { padding: 20px; max-width: 1200px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 20px; }
        .grid { display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }
        @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
        .painel { background: white; border: 1px solid #ccd1d9; border-radius: 4px; overflow: hidden; }
        .painel-titulo { background-color: #134074; color: white; padding: 10px 14px; font-weight: bold; text-transform: uppercase; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .painel-corpo { padding: 14px; }
        .campo { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .campo label { font-size: 11px; color: #656d78; font-weight: bold; text-transform: uppercase; }
        .campo input { padding: 9px; font-size: 14px; border: 1px solid #aab2bd; border-radius: 4px; color: #134074; width: 100%; }
        .linha { display: flex; gap: 10px; align-items: flex-end; }
        .linha .campo { flex: 1; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background-color: #134074; color: white; padding: 8px; text-align: left; text-transform: uppercase; font-size: 11px; }
        td { padding: 8px; border-bottom: 1px solid #e6e9ed; color: #333; }
        tr:nth-child(even) { background-color: #f8f9fa; }
        .btn { border: none; border-radius: 4px; padding: 8px 12px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .btn-azul { background-color: #134074; color: white; }
        .btn-verde { background-color: #00a651; color: white; }
        .btn-perigo { background-color: #d9534f; color: white; }
        .btn-mini { padding: 4px 8px; font-size: 12px; }
        .btn-block { width: 100%; padding: 12px; font-size: 15px; }
        .sem-dados { text-align: center; color: #8b95a1; padding: 24px; font-size: 14px; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 3px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .b-verde { background: #d8f3e3; color: #008c45; }
        .b-cinza { background: #e6e9ed; color: #656d78; }
        .b-amarelo { background: #fde8c8; color: #b26b00; }
        .b-vermelho { background: #f8d7da; color: #b02a37; }
        .divergencia { color: #d9534f; font-weight: bold; }
        .oculto { display: none; }
        .qtd-input { width: 80px; padding: 6px; border: 1px solid #aab2bd; border-radius: 4px; text-align: center; }
    </style>
</head>
<body>

    <header>
        <div>JG SISTEMAS - INVENTÁRIO</div>
        <div><a href="/">← Menu Principal</a></div>
    </header>

    <main>
        <div class="grid">
            <div>
                <div class="painel" style="margin-bottom:20px;">
                    <div class="painel-titulo"><span>Abrir Contagem</span></div>
                    <div class="painel-corpo">
                        <div class="campo">
                            <label>Nome da contagem</label>
                            <input type="text" id="f-nome" placeholder="Ex.: CONTAGEM MENSAL">
                        </div>
                        <button class="btn btn-verde btn-block" id="btn-abrir" onclick="abrirContagem()">Abrir nova contagem</button>
                    </div>
                </div>

                <div class="painel">
                    <div class="painel-titulo"><span>Contagens</span></div>
                    <div class="painel-corpo" style="padding:0;">
                        <table>
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Status</th>
                                    <th style="text-align:right;">Conferidos</th>
                                    <th style="text-align:center;">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-contagens">
                                <tr><td colspan="4" class="sem-dados">Carregando...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="painel">
                <div class="painel-titulo"><span id="titulo-detalhe">Conferência da Contagem</span></div>
                <div class="painel-corpo">
                    <div id="sem-selecao" class="sem-dados">Selecione uma contagem para conferir.</div>
                    <div id="detalhe" class="oculto">
                        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px;">
                            <span id="badge-status"></span>
                            <span style="font-size:12px; color:#8b95a1;" id="resumo-contagem"></span>
                            <span style="flex:1;"></span>
                            <button class="btn btn-mini btn-perigo" id="btn-excluir" onclick="excluirContagem()">Cancelar</button>
                            <button class="btn btn-verde" id="btn-finalizar" onclick="finalizarContagem()">Finalizar e aplicar ajustes</button>
                        </div>
                        <div style="overflow-x:auto;">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Produto</th>
                                        <th style="text-align:right;">Esperado</th>
                                        <th style="text-align:center;">Contado</th>
                                        <th style="text-align:right;">Divergência</th>
                                    </tr>
                                </thead>
                                <tbody id="tabela-conferencia">
                                    <tr><td colspan="4" class="sem-dados">Carregando...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>© 2026 JG Sistemas</footer>

    <script src="/seguranca.js"></script>
    <script>
        const API_BASE = '';

        function obterOperador() {
            try {
                const raw = localStorage.getItem('jg_operador');
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }
        function tokenAuth() {
            const op = obterOperador();
            return op && op.token ? { 'Authorization': 'Bearer ' + op.token } : {};
        }
        function bloquear() {
            const op = obterOperador();
            if (!op) { window.location.href = '/login.html'; return true; }
            if (op.papel === 'SELLER') { window.location.href = '/'; return true; }
            return false;
        }
        async function api(url, metodo = 'GET', corpo = null) {
            const opcoes = { method: metodo, headers: Object.assign({ 'Content-Type': 'application/json' }, tokenAuth()) };
            if (corpo) opcoes.body = JSON.stringify(corpo);
            const response = await fetch(`${API_BASE}${url}`, opcoes);
            if (response.status === 401) {
                localStorage.removeItem('jg_operador');
                window.location.href = '/login.html';
                throw new Error('Sessão expirada.');
            }
            const dados = await response.json();
            if (!response.ok) throw new Error(dados.erro || 'Erro na requisição');
            return dados;
        }
        bloquear();

        let contagemSelecionada = null;

        async function carregarContagens() {
            try {
                const lista = await api('/api/inventario');
                const tbody = document.getElementById('tabela-contagens');
                if (lista.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="sem-dados">Nenhuma contagem</td></tr>';
                    document.getElementById('btn-abrir').disabled = false;
                    return;
                }
                const temAberta = lista.some(c => c.status === 'OPEN');
                document.getElementById('btn-abrir').disabled = temAberta;
                document.getElementById('btn-abrir').innerText = temAberta ? 'Há uma contagem em aberto' : 'Abrir nova contagem';
                tbody.innerHTML = lista.map(c => `
                    <tr>
                        <td><strong>${esc(c.nome)}</strong><br><small style="color:#8b95a1;">${new Date(c.criadoEm).toLocaleDateString('pt-BR')}</small></td>
                        <td>
                            ${c.status === 'OPEN'
                                ? `<span class="badge b-amarelo">Em aberto</span>`
                                : `<span class="badge b-cinza">Finalizada</span>`}
                            ${c.divergencias > 0 ? `<br><span class="badge b-vermelho">${c.divergencias} div.</span>` : ''}
                        </td>
                        <td style="text-align:right;">${c.conferidos}/${c.totalItens}</td>
                        <td style="text-align:center; white-space:nowrap;">
                            <button class="btn btn-mini btn-azul" onclick="abrirDetalhe('${c.id}')">Conferir</button>
                        </td>
                    </tr>`).join('');
            } catch (e) { alert(e.message); }
        }

        async function abrirContagem() {
            const nome = document.getElementById('f-nome').value.trim();
            try {
                const r = await api('/api/inventario', 'POST', { nome });
                document.getElementById('f-nome').value = '';
                alert(`Contagem "${r.nome}" aberta com ${r.itens} itens!`);
                carregarContagens();
                abrirDetalhe(r.id);
            } catch (e) { alert(e.message); }
        }

        async function abrirDetalhe(id) {
            try {
                const c = await api(`/api/inventario/${id}`);
                contagemSelecionada = c;
                document.getElementById('sem-selecao').classList.add('oculto');
                document.getElementById('detalhe').classList.remove('oculto');
                document.getElementById('titulo-detalhe').innerText = `Contagem: ${c.nome}`;
                document.getElementById('badge-status').innerHTML = c.status === 'OPEN'
                    ? '<span class="badge b-amarelo">Em aberto</span>'
                    : '<span class="badge b-cinza">Finalizada</span>';
                const conferidos = c.itens.filter(i => i.contado !== null).length;
                const divergencias = c.itens.filter(i => i.divergencia !== null && i.divergencia !== 0).length;
                document.getElementById('resumo-contagem').innerText =
                    `${conferidos}/${c.itens.length} conferidos · ${divergencias} com divergência`;
                document.getElementById('btn-finalizar').style.display = c.status === 'OPEN' ? '' : 'none';
                document.getElementById('btn-excluir').style.display = c.status === 'OPEN' ? '' : 'none';

                document.getElementById('tabela-conferencia').innerHTML = c.itens.map((i, idx) => {
                    const div = i.divergencia;
                    return `
                        <tr>
                            <td>
                                <strong>${esc(i.produto)}</strong><br>
                                <small style="color:#8b95a1;">${esc(i.codigo ?? '')}</small>
                            </td>
                            <td style="text-align:right;">${i.esperado}</td>
                            <td style="text-align:center;">
                                ${c.status === 'OPEN'
                                    ? `<input type="number" class="qtd-input" min="0" value="${i.contado ?? ''}" id="ct-${idx}" data-item="${i.id}" data-inv="${i.inventoryId}">`
                                    : (i.contado ?? '—')}
                            </td>
                            <td style="text-align:right;" class="${div !== null && div !== 0 ? 'divergencia' : ''}">
                                ${div === null ? '—' : (div > 0 ? '+' : '') + div}
                            </td>
                        </tr>`;
                }).join('');
                carregarContagens();
            } catch (e) { alert(e.message); }
        }

        async function salvarContagens() {
            if (!contagemSelecionada || contagemSelecionada.status !== 'OPEN') return;
            const inputs = document.querySelectorAll('#tabela-conferencia .qtd-input');
            for (const input of inputs) {
                const quantidade = input.value === '' ? null : Number(input.value);
                if (quantidade !== null) {
                    await api(`/api/inventario/${contagemSelecionada.id}/contagem`, 'POST', {
                        inventoryId: input.dataset.inv,
                        quantidade
                    });
                }
            }
        }

        async function finalizarContagem() {
            if (!contagemSelecionada) return;
            await salvarContagens();
            if (!confirm('Finalizar a contagem? As divergências serão aplicadas no estoque como ajustes.')) return;
            try {
                const r = await api(`/api/inventario/${contagemSelecionada.id}/finalizar`, 'POST');
                alert(`Contagem finalizada com ${r.ajustes} ajuste(s) aplicado(s)!`);
                abrirDetalhe(contagemSelecionada.id);
                carregarContagens();
            } catch (e) { alert(e.message); }
        }

        async function excluirContagem() {
            if (!contagemSelecionada) return;
            if (!confirm('Cancelar esta contagem em aberto?')) return;
            try {
                await api(`/api/inventario/${contagemSelecionada.id}`, 'DELETE');
                contagemSelecionada = null;
                document.getElementById('sem-selecao').classList.remove('oculto');
                document.getElementById('detalhe').classList.add('oculto');
                carregarContagens();
            } catch (e) { alert(e.message); }
        }

        carregarContagens();
    </script>
</body>
</html>
