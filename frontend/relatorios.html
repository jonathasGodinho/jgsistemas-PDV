<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Relatórios Gerenciais - JG Sistemas</title>
    <style>
        .resumo-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 16px; }
        .resumo-cards .item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; }
        .resumo-cards .item .rotulo { font-size: 12.5px; color: var(--text-2); font-weight: 500; }
        .resumo-cards .item .valor { font-size: 22px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
        #area-resultado table { border: 1px solid var(--border); border-radius: var(--radius); }
        .cel-barra { width: 34%; }
        .cel-barra .barra-h { height: 10px; }
    </style>
    <link rel="stylesheet" href="/ui/jg.css">
</head>
<body class="jg" data-pagina="relatorios">
    <main>
        <div class="page-head">
            <div><h1>Relatórios</h1><div class="sub">Relatórios gerenciais por período</div></div>
            <div class="acoes">
                <div class="campo" style="margin:0;width:160px"><label for="f-de">De</label><input type="date" id="f-de"></div>
                <div class="campo" style="margin:0;width:160px"><label for="f-ate">Até</label><input type="date" id="f-ate"></div>
                <button class="btn btn-primario" onclick="gerar()" style="align-self:flex-end"><span class="ms">play_arrow</span>Gerar</button>
                <button class="btn" onclick="imprimir()" style="align-self:flex-end"><span class="ms">print</span>Imprimir</button>
                <button class="btn" onclick="exportarCsv()" style="align-self:flex-end"><span class="ms">download</span>Exportar CSV</button>
            </div>
        </div>

        <div class="abas">
            <a class="aba" href="/relatorio-caixas.html"><span class="ms sm">point_of_sale</span>Fechamento de caixa</a>
            <button class="aba ativa" id="aba-operador" onclick="mostrarAba('operador')"><span class="ms sm">person</span>Vendas por operador</button>
            <button class="aba" id="aba-ranking" onclick="mostrarAba('ranking')"><span class="ms sm">leaderboard</span>Ranking de produtos</button>
            <button class="aba" id="aba-pagamento" onclick="mostrarAba('pagamento')"><span class="ms sm">payments</span>Por forma de pagamento</button>
            <button class="aba" id="aba-comissao" onclick="mostrarAba('comissao')"><span class="ms sm">percent</span>Comissões</button>
        </div>
        <div id="area-resultado">
            <div class="card"><div class="estado-vazio"><span class="ms">analytics</span><p>Selecione o período e clique em "Gerar".</p></div></div>
        </div>
    </main>
    <script src="/seguranca.js"></script>
    <script src="/ui/shell.js"></script>
    <script>
        function formatarMoeda(v) {
            return 'R$ ' + (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        function obterOperador() {
            try {
                const raw = localStorage.getItem('jg_operador');
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }
        function tokenAuth() {
            const op = obterOperador();
            return op && op.token ? { 'Authorization': 'Bearer ' + op.token } : {};
        }
        function bloquearCaixa() {
            const op = obterOperador();
            if (!op) { window.location.href = '/login.html'; return true; }
            if (op.papel === 'SELLER') { window.location.href = '/'; return true; }
            return false;
        }
        async function api(url, metodo, corpo) {
            const opt = { method: metodo || 'GET', headers: Object.assign({ 'Content-Type': 'application/json' }, tokenAuth()) };
            if (corpo) opt.body = JSON.stringify(corpo);
            const response = await fetch(url, opt);
            if (response.status === 401) {
                localStorage.removeItem('jg_operador');
                window.location.href = '/login.html';
                throw new Error('Sessão expirada.');
            }
            const dados = await response.json();
            if (!response.ok) throw new Error(dados.erro || 'Erro na requisição');
            return dados;
        }
        bloquearCaixa();

        const NOMES_METODOS = { MONEY: 'Dinheiro', PIX: 'PIX', CREDIT_CARD: 'Cartão de Crédito', DEBIT_CARD: 'Cartão de Débito', CREDIARIO: 'Crediário', VOUCHER: 'Vale', TRANSFER: 'Transferência' };

        let abaAtiva = 'operador';
        let dadosGerados = {};

        function montarPeriodo() {
            const de = document.getElementById('f-de').value;
            const ate = document.getElementById('f-ate').value;
            const params = [];
            if (de) params.push(`de=${de}`);
            if (ate) params.push(`ate=${ate}`);
            return params.length ? '?' + params.join('&') : '';
        }

        function mostrarAba(aba) {
            abaAtiva = aba;
            document.querySelectorAll('button.aba').forEach(b => b.classList.remove('ativa'));
            document.getElementById(`aba-${aba}`).classList.add('ativa');
            renderizarAba();
        }

        async function gerar() {
            const p = montarPeriodo();
            try {
                const [porOperador, ranking, pagamentos, comissoes] = await Promise.all([
                    api('/api/relatorios/vendas-por-operador' + p),
                    api('/api/relatorios/ranking-produtos' + p),
                    api('/api/relatorios/vendas-por-pagamento' + p),
                    api('/api/relatorios/comissoes' + p)
                ]);
                dadosGerados = { porOperador, ranking, pagamentos, comissoes };
                renderizarAba();
            } catch (e) { alert(e.message); }
        }

        function tabela(thead, linhas, vazio) {
            if (linhas.length === 0) return `<div class="card"><div class="estado-vazio"><span class="ms">search_off</span><p>${vazio}</p></div></div>`;
            return `<div class="card"><div class="tabela-wrap"><table><thead>${thead}</thead><tbody>${linhas.join('')}</tbody></table></div></div>`;
        }
        function barra(v, max) {
            return `<td class="cel-barra"><div class="barra-h"><div style="width:${max ? Math.max(1, v / max * 100) : 0}%"></div></div></td>`;
        }

        function renderizarAba() {
            const area = document.getElementById('area-resultado');
            if (!Object.keys(dadosGerados).length) {
                area.innerHTML = '<div class="card"><div class="estado-vazio"><span class="ms">analytics</span><p>Selecione o período e clique em "Gerar".</p></div></div>';
                return;
            }
            let html = '';

            if (abaAtiva === 'operador') {
                const d = dadosGerados.porOperador;
                const total = d.reduce((s, x) => s + x.total, 0);
                html = `
                    <div class="resumo-cards">
                        <div class="item"><div class="rotulo">Operadores</div><div class="valor">${d.length}</div></div>
                        <div class="item"><div class="rotulo">Total Vendido</div><div class="valor">${formatarMoeda(total)}</div></div>
                    </div>
                    ${tabela(
                        '<tr><th>Operador</th><th></th><th class="right">Vendas</th><th class="right">Ticket médio</th><th class="right">Canceladas</th><th class="right">Total</th></tr>',
                        d.slice().sort((a, b) => b.total - a.total).map(x => `
                            <tr>
                                <td><b>${esc(x.operador)}</b></td>
                                ${barra(x.total, Math.max(...d.map(y => y.total)))}
                                <td class="right">${x.quantidade}</td>
                                <td class="right">${formatarMoeda(x.quantidade ? x.total / x.quantidade : 0)}</td>
                                <td class="right ${x.canceladas ? 'txt-vermelho' : ''}">${x.canceladas}</td>
                                <td class="right"><b>${formatarMoeda(x.total)}</b></td>
                            </tr>`),
                        'Nenhuma venda no período.'
                    )}`;
            } else if (abaAtiva === 'ranking') {
                const d = dadosGerados.ranking;
                const totalQtd = d.reduce((s, x) => s + x.qtd, 0);
                html = `
                    <div class="resumo-cards">
                        <div class="item"><div class="rotulo">Produtos</div><div class="valor">${d.length}</div></div>
                        <div class="item"><div class="rotulo">Unidades</div><div class="valor">${totalQtd}</div></div>
                    </div>
                    ${tabela(
                        '<tr><th>#</th><th>Produto</th><th></th><th class="right">Qtd</th><th class="right">Valor</th></tr>',
                        d.map(x => `
                            <tr>
                                <td><b>${x.posicao}º</b></td>
                                <td>${esc(x.nome)}<br><small>${esc(x.codigo)}</small></td>
                                ${barra(x.qtd, Math.max(...d.map(y => y.qtd)))}
                                <td class="right">${x.qtd}</td>
                                <td class="right"><b>${formatarMoeda(x.valor)}</b></td>
                            </tr>`),
                        'Nenhuma venda no período.'
                    )}`;
            } else if (abaAtiva === 'pagamento') {
                const d = dadosGerados.pagamentos;
                const total = d.reduce((s, x) => s + x.total, 0);
                html = `
                    <div class="resumo-cards">
                        <div class="item"><div class="rotulo">Total Recebido</div><div class="valor">${formatarMoeda(total)}</div></div>
                    </div>
                    ${tabela(
                        '<tr><th>Forma de pagamento</th><th></th><th class="right">Participação</th><th class="right">Valor</th></tr>',
                        d.slice().sort((a, b) => b.total - a.total).map(x => `
                            <tr>
                                <td><b>${NOMES_METODOS[x.metodo] || esc(x.metodo)}</b></td>
                                ${barra(x.total, Math.max(...d.map(y => y.total)))}
                                <td class="right">${total ? (x.total / total * 100).toFixed(1).replace('.', ',') : 0}%</td>
                                <td class="right"><b>${formatarMoeda(x.total)}</b></td>
                            </tr>`),
                        'Nenhuma venda no período.'
                    )}`;
            } else if (abaAtiva === 'comissao') {
                const d = dadosGerados.comissoes;
                const totalComissao = d.reduce((s, x) => s + x.comissao, 0);
                html = `
                    <div class="resumo-cards">
                        <div class="item"><div class="rotulo">Comissões a Pagar</div><div class="valor">${formatarMoeda(totalComissao)}</div></div>
                    </div>
                    ${tabela(
                        '<tr><th>Operador</th><th class="right">Taxa</th><th class="right">Total vendido</th><th class="right">Comissão</th></tr>',
                        d.map(x => `
                            <tr>
                                <td><b>${esc(x.operador)}</b></td>
                                <td class="right">${String(x.taxa).replace('.', ',')}%</td>
                                <td class="right">${formatarMoeda(x.totalVendido)}</td>
                                <td class="right"><b class="txt-verde">${formatarMoeda(x.comissao)}</b></td>
                            </tr>`),
                        'Nenhum operador com comissão configurada. Configure em Configurações > Operadores e Comissão.'
                    )}`;
            }

            area.innerHTML = html;
        }

        function exportarCsv() {
            const tabelaEl = document.querySelector('#area-resultado table');
            if (!tabelaEl) { JG.toast('Gere o relatório antes de exportar.', 'alerta'); return; }
            const linhas = [...tabelaEl.querySelectorAll('tr')].map(tr => [...tr.children]
                .filter(td => !td.classList.contains('cel-barra') && !(td.tagName === 'TH' && !td.textContent.trim()))
                .map(td => '"' + td.innerText.replace(/\s+/g, ' ').trim().replace(/"/g, '""') + '"').join(';'));
            const csv = '\ufeff' + linhas.join('\r\n');
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
            a.download = `relatorio-${abaAtiva}-${document.getElementById('f-de').value || ''}_${document.getElementById('f-ate').value || ''}.csv`;
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        }

        function imprimir() {
            const conteudo = document.getElementById('area-resultado').innerHTML;
            if (!conteudo.trim() || !Object.keys(dadosGerados).length) { alert("Gere o relatório antes de imprimir!"); return; }
            const de = document.getElementById('f-de').value || '-';
            const ate = document.getElementById('f-ate').value || '-';
            const nomeAba = document.getElementById(`aba-${abaAtiva}`).innerText.replace(/^\S+\s*/, '');
            const w = window.open('', '_blank');
            w.document.write(`<html><head><title>Relatório - ${nomeAba}</title>
                <style>
                    body { font-family: 'Segoe UI', sans-serif; color: #222; padding: 20px; }
                    h1 { font-size: 16px; color: #0b2545; }
                    h2 { font-size: 13px; color: #555; font-weight: normal; margin-bottom: 16px; }
                    table { width: 100%; border-collapse: collapse; font-size: 12px; }
                    th { background: #0b2545; color: white; padding: 6px; text-align: left; }
                    td { padding: 6px; border-bottom: 1px solid #ccc; }
                    .resumo-cards { display: flex; gap: 12px; margin-bottom: 12px; }
                    .resumo-cards .item { border: 1px solid #ccc; border-radius: 4px; padding: 8px 12px; }
                    .rotulo { font-size: 10px; text-transform: uppercase; color: #777; }
                    .valor { font-size: 16px; font-weight: bold; color: #0b2545; }
                    .sem-dados { color: #888; }
                    @media print { @page { margin: 12mm; } }
                </style></head><body>
                <h1>JG Sistemas - Relatório Gerencial: ${nomeAba}</h1>
                <h2>Período: ${de} a ${ate}</h2>
                ${conteudo}
            </body></html>`);
            w.document.close();
            w.print();
        }

        document.getElementById('f-de').value = new Date().toISOString().slice(0, 10);
        document.getElementById('f-ate').value = new Date().toISOString().slice(0, 10);
        if (['operador', 'ranking', 'pagamento', 'comissao'].includes(location.hash.slice(1))) mostrarAba(location.hash.slice(1));
        gerar();
    </script>
</body>
</html>
