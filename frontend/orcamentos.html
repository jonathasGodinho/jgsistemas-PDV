<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Orçamentos - JG Sistemas</title>
    <style>
        #me-itens table { font-size: 13px; }
        #me-itens td, #me-itens th { height: 36px; }
    </style>
    <link rel="stylesheet" href="/ui/jg.css">
</head>
<body class="jg" data-pagina="orcamentos">
    <main>
        <div class="page-head">
            <div><h1>Orçamentos</h1><div class="sub">Orçamentos salvos no PDV aguardando efetivação</div></div>
            <div class="acoes"><a class="btn btn-sucesso" href="/pdv.html" target="_blank" rel="noopener"><span class="ms">add</span>Novo orçamento no PDV</a></div>
        </div>
        <div class="kpis" id="box-resumo"></div>
        <div class="card">
            <div class="card-body" style="padding-bottom:0">
                <div class="filtros"><div class="input-icone" style="flex:1;min-width:260px"><span class="ms">search</span><input type="text" id="f-busca" placeholder="Filtrar por número, operador ou cliente"></div></div>
            </div>
            <div class="tabela-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Nº</th>
                            <th>Data</th>
                            <th>Operador</th>
                            <th>Cliente</th>
                            <th class="right">Itens</th>
                            <th class="right">Subtotal</th>
                            <th class="right">Desconto</th>
                            <th class="right">Total</th>
                            <th class="acoes">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-orcamentos">
                        <tr><td colspan="9" class="sem-dados">Carregando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <!-- Modal efetivar / ver itens -->
    <div class="modal-overlay" id="modal-efetivar">
        <div class="modal">
            <div class="modal-head">
                <span id="me-titulo">Efetivar venda — Nº <span id="me-numero">-</span></span>
                <span class="close" onclick="fecharModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div id="me-itens" class="mb-16"></div>
                <div id="me-pagamento">
                    <div class="destaque mb-16"><div class="rotulo">Total a receber</div><div class="valor" id="me-total">R$ 0,00</div></div>
                    <div class="form-grid">
                        <div class="campo"><label for="me-metodo">Forma de pagamento</label>
                            <select id="me-metodo">
                                <option value="MONEY">Dinheiro</option>
                                <option value="PIX">PIX</option>
                                <option value="CREDIT_CARD">Crédito</option>
                                <option value="DEBIT_CARD">Débito</option>
                                <option value="CREDIARIO">Crediário</option>
                            </select>
                        </div>
                        <div id="box-parcelas" class="campo" style="display:none;"><label for="me-parcelas">Parcelas</label><input type="number" id="me-parcelas" min="1" max="12" value="1"></div>
                        <div class="campo" id="box-recebido"><label for="me-recebido">Valor recebido (dinheiro)</label><input type="number" id="me-recebido" step="0.01" placeholder="0,00"></div>
                    </div>
                </div>
            </div>
            <div class="modal-foot" id="me-rodape">
                <button class="btn" onclick="fecharModal()">Cancelar</button>
                <button class="btn btn-sucesso" id="me-confirmar" onclick="confirmarEfetivar()"><span class="ms">check</span>Efetivar venda</button>
            </div>
        </div>
    </div>

    <!-- Modal excluir -->
    <div class="modal-overlay" id="modal-excluir">
        <div class="modal sm">
            <div class="modal-head"><span>Excluir orçamento <span id="mx-numero"></span></span><span class="close" onclick="document.getElementById('modal-excluir').classList.remove('active')">&times;</span></div>
            <div class="modal-body">
                <p style="margin:0 0 14px">O orçamento será cancelado e sairá da lista de pendentes.</p>
                <div class="campo" style="margin:0"><label for="mx-senha">Senha do administrador *</label><input type="password" id="mx-senha" autocomplete="off"></div>
            </div>
            <div class="modal-foot"><button class="btn" onclick="document.getElementById('modal-excluir').classList.remove('active')">Voltar</button><button class="btn btn-perigo" onclick="confirmarExcluir()"><span class="ms">delete</span>Excluir</button></div>
        </div>
    </div>

    <script src="/seguranca.js"></script>
    <script src="/ui/shell.js"></script>
    <script>
        const API_BASE = '';
        const formatarMoeda = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        const formatarDataHora = d => new Date(d).toLocaleString('pt-BR');

        function obterOperador() {
            try {
                const raw = localStorage.getItem('jg_operador');
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }
        function tokenAuth() {
            const op = obterOperador();
            return op && op.token ? { 'Authorization': 'Bearer ' + op.token } : {};
        }
        async function api(url, metodo = 'GET', corpo = null) {
            const opcoes = { method: metodo, headers: Object.assign({ 'Content-Type': 'application/json' }, tokenAuth()) };
            if (corpo) opcoes.body = JSON.stringify(corpo);
            const response = await fetch(`${API_BASE}${url}`, opcoes);
            if (response.status === 401) {
                localStorage.removeItem('jg_operador');
                window.location.href = '/login.html';
                throw new Error('Sessão expirada.');
            }
            const dados = await response.json();
            if (!response.ok) throw new Error(dados.erro || 'Erro na requisição');
            return dados;
        }

        const op = obterOperador();
        if (!op) { window.location.href = '/login.html'; }
        const ehCaixa = op.papel === 'SELLER';

        let orcamentoEfetivarId = null;
        let orcamentosCache = [];

        async function carregarOrcamentos() {
            try {
                const dados = await api('/api/vendas/consulta?status=PENDING');
                const orcs = dados.vendas;
                orcamentosCache = orcs;

                const total = orcs.reduce((s, v) => s + Number(v.total || 0), 0);
                const semana = orcs.filter(v => Date.now() - new Date(v.data).getTime() > 7 * 86400000).length;
                document.getElementById('box-resumo').innerHTML = `
                    <div class="kpi ambar"><div class="kpi-top"><span>Orçamentos pendentes</span><span class="ms">request_quote</span></div><div class="kpi-valor">${orcs.length}</div></div>
                    <div class="kpi"><div class="kpi-top"><span>Valor pendente</span><span class="ms">payments</span></div><div class="kpi-valor">${formatarMoeda(total)}</div></div>
                    <div class="kpi ${semana ? 'vermelho' : ''}"><div class="kpi-top"><span>Há mais de 7 dias</span><span class="ms">schedule</span></div><div class="kpi-valor">${semana}</div></div>`;
                renderizarOrcamentos();
            } catch (e) { alert(e.message); }
        }

        function renderizarOrcamentos() {
            const orcs = orcamentosCache;
            const q = document.getElementById('f-busca').value.trim().toLowerCase();
            const lista = orcs.filter(v => !q || [v.numero, v.operador, v.cliente].join(' ').toLowerCase().includes(q));
            const tbody = document.getElementById('tabela-orcamentos');
            if (lista.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9"><div class="estado-vazio"><span class="ms">request_quote</span><p>${orcs.length ? 'Nenhum orçamento com esse filtro.' : 'Nenhum orçamento pendente.'}</p></div></td></tr>`;
                return;
            }
            tbody.innerHTML = lista.map(v => `
                <tr>
                    <td><b>${esc(v.numero)}</b></td>
                    <td>${formatarDataHora(v.data)}</td>
                    <td>${esc(v.operador)}</td>
                    <td>${esc(v.cliente || 'Consumidor final')}</td>
                    <td class="right">${v.qtdItens}</td>
                    <td class="right">${formatarMoeda(v.subtotal)}</td>
                    <td class="right">${v.desconto ? formatarMoeda(v.desconto) : '—'}</td>
                    <td class="right"><b>${formatarMoeda(v.total)}</b></td>
                    <td class="acoes">
                        <button class="btn-icone" title="Ver itens" onclick="verItens(${orcs.indexOf(v)})"><span class="ms">list_alt</span></button>
                        <button class="btn-icone" title="Efetivar venda" style="color:var(--green)" onclick="abrirEfetivar('${v.id}', '${esc(v.numero)}')"><span class="ms">task_alt</span></button>
                        <button class="btn-icone perigo" title="Excluir" onclick="excluirOrcamento('${v.id}', '${esc(v.numero)}')"><span class="ms">delete</span></button>
                    </td>
                </tr>`).join('');
        }
        document.getElementById('f-busca').addEventListener('input', renderizarOrcamentos);

        let excluirId = null;
        function excluirOrcamento(id, numero) {
            excluirId = id;
            document.getElementById('mx-numero').innerText = numero;
            document.getElementById('mx-senha').value = '';
            document.getElementById('modal-excluir').classList.add('active');
            setTimeout(() => document.getElementById('mx-senha').focus(), 50);
        }
        async function confirmarExcluir() {
            const senha = document.getElementById('mx-senha').value;
            if (!senha) { JG.toast('Informe a senha do administrador.', 'alerta'); return; }
            try {
                await api(`/api/vendas/${excluirId}/cancelar`, 'POST', { senhaAdmin: senha, motivo: 'Orçamento excluído' });
                document.getElementById('modal-excluir').classList.remove('active');
                JG.toast('Orçamento excluído.', 'sucesso');
                carregarOrcamentos();
            } catch (e) { JG.toast(e.message, 'erro'); }
        }

        function itensHtml(v) {
            const linhas = (v.itensDetalhe || []).map(i => `
                <tr><td>${esc(i.nome)}<br><small>${esc(i.codigo)}</small></td><td class="right">${i.quantidade}</td><td class="right">${formatarMoeda(i.unitario)}</td><td class="right">${formatarMoeda(i.subtotal)}</td></tr>`).join('');
            return `<div class="tabela-wrap" style="border:1px solid var(--border)"><table><thead><tr><th>Produto</th><th class="right">Qtd</th><th class="right">Unit.</th><th class="right">Subtotal</th></tr></thead><tbody>${linhas}</tbody></table></div>`;
        }

        function verItens(idx) {
            const v = orcamentosCache[idx];
            if (!v) return;
            document.getElementById('me-titulo').innerHTML = `Itens do orçamento ${esc(v.numero)}`;
            document.getElementById('me-itens').innerHTML = itensHtml(v) + `<div class="row between mt-8"><span class="muted">${esc(v.cliente || 'Consumidor final')}</span><b>Total: ${formatarMoeda(v.total)}</b></div>`;
            document.getElementById('me-pagamento').style.display = 'none';
            document.getElementById('me-confirmar').onclick = () => abrirEfetivar(v.id, v.numero);
            document.getElementById('me-confirmar').innerHTML = '<span class="ms">task_alt</span>Efetivar este orçamento';
            document.getElementById('modal-efetivar').classList.add('active');
        }

        function abrirEfetivar(id, numero) {
            orcamentoEfetivarId = id;
            const v = orcamentosCache.find(x => x.id === id) || {};
            document.getElementById('me-titulo').innerHTML = `Efetivar venda — ${esc(numero)}${v.cliente ? ' · ' + esc(v.cliente) : ''}<span id="me-numero" class="hidden">${esc(numero)}</span>`;
            document.getElementById('me-itens').innerHTML = v.itensDetalhe ? itensHtml(v) : '';
            document.getElementById('me-total').innerText = formatarMoeda(v.total);
            document.getElementById('me-pagamento').style.display = '';
            document.getElementById('box-recebido').style.display = '';
            document.getElementById('me-confirmar').onclick = confirmarEfetivar;
            document.getElementById('me-confirmar').innerHTML = '<span class="ms">check</span>Efetivar venda';
            document.getElementById('me-metodo').value = 'MONEY';
            document.getElementById('me-parcelas').value = '1';
            document.getElementById('me-recebido').value = '';
            document.getElementById('box-parcelas').style.display = 'none';
            document.getElementById('modal-efetivar').classList.add('active');
        }

        document.getElementById('me-metodo').addEventListener('change', (e) => {
            document.getElementById('box-parcelas').style.display = e.target.value === 'CREDIT_CARD' ? '' : 'none';
            document.getElementById('box-recebido').style.display = e.target.value === 'MONEY' ? '' : 'none';
        });

        function fecharModal() {
            document.getElementById('modal-efetivar').classList.remove('active');
            orcamentoEfetivarId = null;
        }

        async function confirmarEfetivar() {
            if (!orcamentoEfetivarId) return;
            const metodo = document.getElementById('me-metodo').value;
            try {
                const r = await api(`/api/vendas/${orcamentoEfetivarId}/efetivar`, 'POST', {
                    pagamento: {
                        metodo,
                        parcelas: metodo === 'CREDIT_CARD' ? Number(document.getElementById('me-parcelas').value) || 1 : 1,
                        valorRecebido: Number(String(document.getElementById('me-recebido').value).replace(',', '.')) || 0
                    }
                });
                let msg = `Orçamento ${r.numero} efetivado com sucesso! Total: ${formatarMoeda(r.total)}`;
                if (r.troco > 0) msg += `\nTroco: ${formatarMoeda(r.troco)}`;
                if (r.pix && r.pix.payload) {
                    try {
                        const janela = window.open('', '_blank', 'width=480,height=560');
                        janela.document.write(`<html><head><title>PIX</title></head><body style="font-family:sans-serif;text-align:center;padding:20px;">
                            <h2>Cobrança PIX</h2><p>Valor: ${formatarMoeda(r.total)}</p>
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(r.pix.payload)}" alt="QR Code PIX"><br>
                            <textarea style="width:100%;height:80px;margin-top:10px;" readonly>${esc(r.pix.payload)}</textarea></body></html>`);
                    } catch (e) { }
                }
                alert(msg);
                fecharModal();
                carregarOrcamentos();
            } catch (e) { alert(e.message); }
        }

        carregarOrcamentos();
    </script>
</body>
</html>
