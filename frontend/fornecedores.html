<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Cadastro de Fornecedores - JG Sistemas</title>
    <style>
        .cel-nome b { display: block; }
    </style>
    <link rel="stylesheet" href="/ui/jg.css">
</head>
<body class="jg" data-pagina="fornecedores">
    <main>
        <div class="page-head">
            <div><h1>Fornecedores</h1><div class="sub" id="contador">Cadastro e gestão de fornecedores</div></div>
            <div class="acoes"><button class="btn btn-sucesso" onclick="abrirModalFornecedor()"><span class="ms">add</span>Novo fornecedor</button></div>
        </div>
        <div class="card">
            <div class="card-body" style="padding-bottom:0">
                <div class="filtros">
                    <div class="input-icone" style="flex:1;min-width:260px"><span class="ms">search</span><input type="text" id="busca" placeholder="Buscar por nome, documento, contato ou cidade"></div>
                    <button class="btn" onclick="buscarFornecedores()"><span class="ms">search</span>Buscar</button>
                </div>
            </div>
            <div class="tabela-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>CNPJ/CPF</th>
                            <th>Contato</th>
                            <th>Telefone</th>
                            <th>Cidade</th>
                            <th class="right">Produtos</th>
                            <th>Situação</th>
                            <th class="acoes">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-fornecedores">
                        <tr><td colspan="8" class="sem-dados">Carregando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <!-- Drawer de fornecedor -->
    <div class="modal-overlay drawer" id="modal-fornecedor">
        <div class="modal">
            <div class="modal-head">
                <span id="modal-titulo">Novo fornecedor</span>
                <span class="close" onclick="fecharModalFornecedor()">&times;</span>
            </div>
            <div class="modal-body">
                <input type="hidden" id="f-id">
                <div class="campo"><label for="f-nome">Nome / Razão social *</label><input type="text" id="f-nome" placeholder="Ex.: Malharia Santa Rita Ltda"></div>
                <div class="form-grid">
                    <div class="campo"><label for="f-documento">CNPJ/CPF</label><input type="text" id="f-documento" placeholder="00.000.000/0001-00"></div>
                    <div class="campo"><label for="f-contato">Contato</label><input type="text" id="f-contato" placeholder="Ex.: João Silva"></div>
                    <div class="campo span-2"><label for="f-email">E-mail</label><input type="email" id="f-email" placeholder="fornecedor@email.com"></div>
                    <div class="campo"><label for="f-telefone">Telefone</label><input type="text" id="f-telefone" placeholder="(00) 0000-0000"></div>
                    <div class="campo"><label for="f-celular">Celular</label><input type="text" id="f-celular" placeholder="(00) 00000-0000"></div>
                </div>
                <div class="jg-section-title mt-8 mb-16" style="font-size:13px;color:var(--text-2)">ENDEREÇO</div>
                <div class="form-grid">
                    <div class="campo"><label for="f-cep">CEP</label><div class="input-grupo"><input type="text" id="f-cep" placeholder="00000-000"><button class="btn" type="button" onclick="buscarCep()" title="Buscar CEP"><span class="ms">search</span></button></div></div>
                    <div class="campo"><label for="f-numero">Número</label><input type="text" id="f-numero" placeholder="123"></div>
                    <div class="campo span-2"><label for="f-endereco">Endereço</label><input type="text" id="f-endereco" placeholder="Rua/Av."></div>
                    <div class="campo"><label for="f-complemento">Complemento</label><input type="text" id="f-complemento" placeholder="Galpão 2"></div>
                    <div class="campo"><label for="f-bairro">Bairro</label><input type="text" id="f-bairro" placeholder="Distrito Industrial"></div>
                    <div class="campo"><label for="f-cidade">Cidade</label><input type="text" id="f-cidade" placeholder="São Paulo"></div>
                    <div class="campo"><label for="f-estado">UF</label><input type="text" id="f-estado" placeholder="SP" maxlength="2"></div>
                </div>
                <div class="campo"><label for="f-observacoes">Observações</label><textarea id="f-observacoes" rows="3" placeholder="Anotações sobre o fornecedor..."></textarea></div>
                <label class="toggle"><input type="checkbox" id="f-ativo" checked><span class="trilho"></span><span>Fornecedor ativo</span></label>
            </div>
            <div class="modal-foot">
                <button class="btn" onclick="fecharModalFornecedor()">Cancelar</button>
                <button class="btn btn-sucesso" onclick="salvarFornecedor()"><span class="ms">check</span>Salvar</button>
            </div>
        </div>
    </div>
    <script src="/seguranca.js"></script>
    <script src="/ui/shell.js"></script>
    <script>
        const API_BASE = '';
        let fornecedores = [];

        function obterOperador() {
            try {
                const raw = localStorage.getItem('jg_operador');
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }

        function tokenAuth() {
            const op = obterOperador();
            return op && op.token ? { 'Authorization': 'Bearer ' + op.token } : {};
        }

        function bloquearCaixa() {
            const op = obterOperador();
            if (!op) { window.location.href = '/login.html'; return true; }
            if (op.papel === 'SELLER') { window.location.href = '/'; return true; }
            return false;
        }

        async function api(url, metodo = 'GET', corpo = null) {
            const opcoes = { method: metodo, headers: Object.assign({ 'Content-Type': 'application/json' }, tokenAuth()) };
            if (corpo) opcoes.body = JSON.stringify(corpo);
            const response = await fetch(`${API_BASE}${url}`, opcoes);
            if (response.status === 401) {
                localStorage.removeItem('jg_operador');
                window.location.href = '/login.html';
                throw new Error('Sessão expirada.');
            }
            const dados = await response.json();
            if (!response.ok) throw new Error(dados.erro || 'Erro na requisição');
            return dados;
        }

        bloquearCaixa();

        async function buscarFornecedores() {
            const busca = document.getElementById('busca').value.trim();
            const url = busca ? `/api/fornecedores?busca=${encodeURIComponent(busca)}` : '/api/fornecedores';
            try {
                fornecedores = await api(url);
                renderizarFornecedores();
            } catch (e) { alert(e.message); }
        }

        function renderizarFornecedores() {
            const tbody = document.getElementById('tabela-fornecedores');
            if (fornecedores.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8"><div class="estado-vazio"><span class="ms">local_shipping</span><p>Nenhum fornecedor encontrado.</p><button class="btn btn-sucesso" onclick="abrirModalFornecedor()"><span class="ms">add</span>Novo fornecedor</button></div></td></tr>';
                document.getElementById('contador').textContent = 'Nenhum fornecedor';
                return;
            }
            document.getElementById('contador').textContent = fornecedores.length + ' fornecedor(es)';
            tbody.innerHTML = fornecedores.map(f => `
                <tr>
                    <td class="cel-nome"><b>${esc(f.nome)}</b><small>${esc(f.email || '')}</small></td>
                    <td>${esc(f.documento || '-')}</td>
                    <td>${esc(f.contato || '-')}</td>
                    <td>${esc(f.celular || f.telefone || '-')}</td>
                    <td>${esc(f.cidade || '-')}</td>
                    <td class="right">${f.produtos}</td>
                    <td><span class="badge ${f.ativo ? 'ativo' : 'inativo'}">${f.ativo ? 'Ativo' : 'Inativo'}</span></td>
                    <td class="acoes">
                        <button class="btn-icone" title="Editar" onclick="abrirModalFornecedor('${f.id}')"><span class="ms">edit</span></button>
                        <button class="btn-icone perigo" title="Excluir" onclick="excluirFornecedor('${f.id}', '${esc(f.nome)}')"><span class="ms">delete</span></button>
                    </td>
                </tr>
            `).join('');
        }

        function abrirModalFornecedor(id = null) {
            document.getElementById('modal-titulo').innerText = id ? 'Editar fornecedor' : 'Novo fornecedor';
            document.getElementById('f-id').value = id || '';
            const campos = ['f-nome', 'f-documento', 'f-contato', 'f-email', 'f-telefone', 'f-celular', 'f-cep', 'f-endereco', 'f-numero', 'f-complemento', 'f-bairro', 'f-cidade', 'f-estado', 'f-observacoes'];
            campos.forEach(campo => document.getElementById(campo).value = '');
            document.getElementById('f-ativo').checked = true;

            if (id) {
                const f = fornecedores.find(x => x.id === id);
                if (f) {
                    document.getElementById('f-nome').value = f.nome;
                    document.getElementById('f-documento').value = f.documento || '';
                    document.getElementById('f-contato').value = f.contato || '';
                    document.getElementById('f-email').value = f.email || '';
                    document.getElementById('f-telefone').value = f.telefone || '';
                    document.getElementById('f-celular').value = f.celular || '';
                    document.getElementById('f-cep').value = f.cep || '';
                    document.getElementById('f-endereco').value = f.endereco || '';
                    document.getElementById('f-numero').value = f.numero || '';
                    document.getElementById('f-complemento').value = f.complemento || '';
                    document.getElementById('f-bairro').value = f.bairro || '';
                    document.getElementById('f-cidade').value = f.cidade || '';
                    document.getElementById('f-estado').value = f.estado || '';
                    document.getElementById('f-observacoes').value = f.observacoes || '';
                    document.getElementById('f-ativo').checked = f.ativo;
                }
            }

            document.getElementById('modal-fornecedor').classList.add('active');
        }

        function buscarCep() { JG.buscarCep('f-'); }
        document.getElementById('f-cep').addEventListener('blur', () => {
            if (document.getElementById('f-cep').value.replace(/\D/g, '').length === 8 && !document.getElementById('f-endereco').value) buscarCep();
        });

        function fecharModalFornecedor() {
            document.getElementById('modal-fornecedor').classList.remove('active');
        }

        async function salvarFornecedor() {
            const id = document.getElementById('f-id').value;
            const corpo = {
                nome: document.getElementById('f-nome').value.trim(),
                documento: document.getElementById('f-documento').value.trim(),
                contato: document.getElementById('f-contato').value.trim(),
                email: document.getElementById('f-email').value.trim(),
                telefone: document.getElementById('f-telefone').value.trim(),
                celular: document.getElementById('f-celular').value.trim(),
                cep: document.getElementById('f-cep').value.trim(),
                endereco: document.getElementById('f-endereco').value.trim(),
                numero: document.getElementById('f-numero').value.trim(),
                complemento: document.getElementById('f-complemento').value.trim(),
                bairro: document.getElementById('f-bairro').value.trim(),
                cidade: document.getElementById('f-cidade').value.trim(),
                estado: document.getElementById('f-estado').value.trim().toUpperCase(),
                observacoes: document.getElementById('f-observacoes').value.trim(),
                ativo: document.getElementById('f-ativo').checked
            };

            if (!corpo.nome) { alert("Informe o nome do fornecedor!"); return; }

            try {
                if (id) {
                    await api(`/api/fornecedores/${id}`, 'PUT', corpo);
                } else {
                    await api('/api/fornecedores', 'POST', corpo);
                }
                fecharModalFornecedor();
                JG.toast(id ? 'Fornecedor atualizado.' : 'Fornecedor cadastrado.', 'sucesso');
                await buscarFornecedores();
            } catch (e) { alert(e.message); }
        }

        async function excluirFornecedor(id, nome) {
            if (!confirm(`Excluir o fornecedor "${nome}"?`)) return;
            try {
                await api(`/api/fornecedores/${id}`, 'DELETE');
                await buscarFornecedores();
            } catch (e) { alert(e.message); }
        }

        document.getElementById('busca').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') buscarFornecedores();
        });

        (async () => {
            try {
                await buscarFornecedores();
            } catch (e) {
                alert("Falha ao carregar dados: " + e.message);
            }
        })();
    </script>
</body>
</html>
