<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Dashboard - JG Sistemas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f0f2f5; min-height: 100vh; display: grid; grid-template-rows: 50px 1fr 36px; }
        header { background-color: #0b2545; color: white; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 14px; font-weight: bold; }
        header a { color: #aab2bd; text-decoration: none; font-weight: normal; }
        header a:hover { color: white; }
        main { padding: 20px; max-width: 1100px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 20px; }
        .grid-topo { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .card { background: white; border: 1px solid #ccd1d9; border-radius: 4px; padding: 16px; }
        .card .rotulo { font-size: 11px; color: #8b95a1; font-weight: bold; text-transform: uppercase; }
        .card .valor { font-size: 24px; font-weight: bold; color: #134074; margin-top: 6px; }
        .card .valor.pos { color: #00a651; }
        .card .valor.neg { color: #d9534f; }
        .painel { background: white; border: 1px solid #ccd1d9; border-radius: 4px; overflow: hidden; }
        .painel-titulo { background-color: #134074; color: white; padding: 10px 14px; font-weight: bold; text-transform: uppercase; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .painel-corpo { padding: 16px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background-color: #134074; color: white; padding: 8px 10px; text-align: left; text-transform: uppercase; font-size: 11px; }
        td { padding: 8px 10px; border-bottom: 1px solid #e6e9ed; color: #333; }
        tr:nth-child(even) { background-color: #f8f9fa; }
        .sem-dados { text-align: center; color: #8b95a1; padding: 20px; font-size: 14px; }
        .badge { font-size: 11px; padding: 3px 8px; border-radius: 3px; }
        .badge.aberto { color: #00a651; background: #e3f7ec; }
        .barra { background: #e9ecef; border-radius: 3px; height: 10px; overflow: hidden; }
        .barra > div { height: 100%; background: #134074; }
        footer { background-color: #134074; color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
        .atualizar { display: flex; justify-content: flex-end; }
    </style>
</head>
<body>

    <header>
        <div>JG SISTEMAS - DASHBOARD</div>
        <div><a href="/">← Menu Principal</a></div>
    </header>

    <main>
        <div class="atualizar">
            <button class="btn btn-verde" onclick="carregar()" style="background:#00a651;color:#fff;border:none;border-radius:4px;padding:9px 16px;font-size:13px;font-weight:bold;cursor:pointer;">Atualizar</button>
        </div>

        <div class="grid-topo" id="cards-resumo"></div>

        <div class="painel">
            <div class="painel-titulo"><span>Caixas Abertos</span></div>
            <div class="painel-corpo" id="area-caixas"></div>
        </div>

        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:16px;">
            <div class="painel">
                <div class="painel-titulo"><span>Vendas do Dia por Operador</span></div>
                <div class="painel-corpo" id="area-operadores"></div>
            </div>
            <div class="painel">
                <div class="painel-titulo"><span>Vendas por Forma de Pagamento</span></div>
                <div class="painel-corpo" id="area-metodos"></div>
            </div>
        </div>

        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:16px;">
            <div class="painel">
                <div class="painel-titulo"><span>Top Produtos do Dia</span></div>
                <div class="painel-corpo" id="area-top"></div>
            </div>
            <div class="painel">
                <div class="painel-titulo"><span>Estoque Baixo</span></div>
                <div class="painel-corpo" id="area-estoque"></div>
            </div>
        </div>
    </main>

    <footer>© 2026 JG Sistemas</footer>

    <script src="/seguranca.js"></script>
    <script>
        function formatarMoeda(v) {
            return 'R$ ' + (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        function formatarDataHora(d) {
            if (!d) return '-';
            return new Date(d).toLocaleString('pt-BR');
        }
        function obterOperador() {
            try {
                const raw = localStorage.getItem('jg_operador');
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }
        function tokenAuth() {
            const op = obterOperador();
            return op && op.token ? { 'Authorization': 'Bearer ' + op.token } : {};
        }
        function bloquearCaixa() {
            const op = obterOperador();
            if (!op) { window.location.href = '/login.html'; return true; }
            if (op.papel === 'SELLER') { window.location.href = '/'; return true; }
            return false;
        }
        async function api(url, metodo, corpo) {
            const opt = { method: metodo || 'GET', headers: Object.assign({ 'Content-Type': 'application/json' }, tokenAuth()) };
            if (corpo) opt.body = JSON.stringify(corpo);
            const response = await fetch(url, opt);
            if (response.status === 401) {
                localStorage.removeItem('jg_operador');
                window.location.href = '/login.html';
                throw new Error('Sessão expirada.');
            }
            const dados = await response.json();
            if (!response.ok) throw new Error(dados.erro || 'Erro na requisição');
            return dados;
        }
        bloquearCaixa();

        const METODOS = { MONEY: 'Dinheiro', PIX: 'PIX', CREDIT_CARD: 'Cartão de Crédito', DEBIT_CARD: 'Cartão de Débito', CREDIARIO: 'Crediário' };

        function montarResumo(d) {
            const vendas = d.vendasHoje;
            const cards = [
                { rotulo: 'Vendas Hoje', valor: formatarMoeda(vendas.total) },
                { rotulo: 'Quantidade de Vendas', valor: `${vendas.quantidade} venda(s)` },
                { rotulo: 'Caixas Abertos', valor: `${d.caixasAbertos.length} registradora(s)` },
                { rotulo: 'Contas a Receber Vencidas', valor: formatarMoeda(d.contas.receberVencidas), neg: d.contas.receberVencidas > 0 },
                { rotulo: 'Contas a Pagar Vencidas', valor: formatarMoeda(d.contas.pagarVencidas), neg: d.contas.pagarVencidas > 0 }
            ];
            document.getElementById('cards-resumo').innerHTML = cards.map(c => `
                <div class="card">
                    <div class="rotulo">${c.rotulo}</div>
                    <div class="valor ${c.neg ? 'neg' : ''}">${c.valor}</div>
                </div>`).join('');
        }

        function montarCaixas(lista) {
            if (!lista.length) return '<div class="sem-dados">Nenhuma registradora aberta no momento.</div>';
            return '<table><thead><tr><th>Registradora</th><th>Operador</th><th>Aberto em</th></tr></thead><tbody>' +
                lista.map(c => `
                    <tr>
                        <td>Nº ${c.numero} <span class="badge aberto">ABERTO</span></td>
                        <td>${esc(c.operador)}</td>
                        <td>${formatarDataHora(c.abertoEm)}</td>
                    </tr>`).join('') + '</tbody></table>';
        }

        function montarOperadores(obj) {
            const entradas = Object.entries(obj);
            if (!entradas.length) return '<div class="sem-dados">Nenhuma venda hoje.</div>';
            const max = Math.max(...entradas.map(([, v]) => v));
            return entradas.map(([nome, valor]) => `
                <div style="margin-bottom:12px;">
                    <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px;">
                        <span style="font-weight:bold; color:#0b2545;">${esc(nome)}</span>
                        <span>${formatarMoeda(valor)}</span>
                    </div>
                    <div class="barra"><div style="width:${max ? (valor / max * 100) : 0}%"></div></div>
                </div>`).join('');
        }

        function montarMetodos(obj) {
            const entradas = Object.entries(obj);
            if (!entradas.length) return '<div class="sem-dados">Nenhuma venda hoje.</div>';
            return '<table><thead><tr><th>Forma de Pagamento</th><th style="text-align:right;">Valor</th></tr></thead><tbody>' +
                entradas.map(([m, v]) => `
                    <tr>
                        <td>${METODOS[m] || m}</td>
                        <td style="text-align:right;">${formatarMoeda(v)}</td>
                    </tr>`).join('') + '</tbody></table>';
        }

        function montarTop(lista) {
            if (!lista.length) return '<div class="sem-dados">Nenhuma venda hoje.</div>';
            return '<table><thead><tr><th>#</th><th>Produto</th><th style="text-align:right;">Qtd</th><th style="text-align:right;">Valor</th></tr></thead><tbody>' +
                lista.map((p, i) => `
                    <tr>
                        <td>${i + 1}</td>
                        <td>${esc(p.nome)}</td>
                        <td style="text-align:right;">${p.qtd}</td>
                        <td style="text-align:right;">${formatarMoeda(p.valor)}</td>
                    </tr>`).join('') + '</tbody></table>';
        }

        function montarEstoque(lista) {
            if (!lista.length) return '<div class="sem-dados">Nenhum produto com estoque baixo.</div>';
            return '<table><thead><tr><th>Produto</th><th style="text-align:right;">Atual</th><th style="text-align:right;">Mínimo</th></tr></thead><tbody>' +
                lista.map(p => `
                    <tr>
                        <td>${esc(p.nome)}</td>
                        <td style="text-align:right; color:#d9534f; font-weight:bold;">${p.quantidade}</td>
                        <td style="text-align:right;">${p.minimo}</td>
                    </tr>`).join('') + '</tbody></table>';
        }

        async function carregar() {
            try {
                const d = await api('/api/dashboard');
                montarResumo(d);
                document.getElementById('area-caixas').innerHTML = montarCaixas(d.caixasAbertos);
                document.getElementById('area-operadores').innerHTML = montarOperadores(d.vendasPorOperador);
                document.getElementById('area-metodos').innerHTML = montarMetodos(d.vendasHoje.porMetodo);
                document.getElementById('area-top').innerHTML = montarTop(d.topProdutos);
                document.getElementById('area-estoque').innerHTML = montarEstoque(d.estoqueBaixo);
            } catch (e) { alert(e.message); }
        }

        carregar();
    </script>
</body>
</html>
