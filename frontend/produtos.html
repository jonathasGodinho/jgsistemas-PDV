<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Produtos - JG Sistemas</title>
    <link rel="stylesheet" href="/ui/jg.css">
    <style>
        .cel-prod { display: flex; align-items: center; gap: 10px; }
        .cel-prod .miniatura { flex-shrink: 0; }
        .cel-prod b { display: block; font-weight: 600; }
        .cel-prod small { display: block; }
        .filtros select { width: 180px; }
    </style>
</head>
<body class="jg" data-pagina="produtos">
    <main>
        <div class="page-head">
            <div><h1>Produtos</h1><div class="sub" id="contador">Carregando...</div></div>
            <div class="acoes">
                <a class="btn" href="/categorias.html"><span class="ms">category</span>Categorias e marcas</a>
                <a class="btn btn-sucesso" href="/produto.html"><span class="ms">add</span>Novo produto</a>
            </div>
        </div>

        <div class="card">
            <div class="card-body" style="padding-bottom:0">
                <div class="filtros">
                    <div class="input-icone" style="flex:1;min-width:260px"><span class="ms">search</span><input type="text" id="busca" placeholder="Buscar por nome, código ou SKU"></div>
                    <select id="f-categoria" aria-label="Categoria"><option value="">Todas as categorias</option></select>
                    <select id="f-marca" aria-label="Marca"><option value="">Todas as marcas</option></select>
                    <select id="f-situacao" aria-label="Situação"><option value="">Todas as situações</option><option value="ativo">Ativos</option><option value="inativo">Inativos</option><option value="baixo">Estoque baixo</option></select>
                    <button class="btn btn-fantasma" onclick="limparFiltros()">Limpar</button>
                </div>
            </div>
            <div class="tabela-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Código</th>
                            <th>Categoria</th>
                            <th>Marca</th>
                            <th class="right">Preço</th>
                            <th class="right">Custo</th>
                            <th class="right">Margem</th>
                            <th class="right">Estoque</th>
                            <th>Situação</th>
                            <th class="acoes">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-produtos">
                        <tr><td colspan="10" class="sem-dados">Carregando...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="paginacao"><span id="pag-info"></span><div class="row" style="gap:6px"><button class="btn btn-sm" id="pag-ant"><span class="ms">chevron_left</span></button><button class="btn btn-sm" id="pag-prox"><span class="ms">chevron_right</span></button></div></div>
        </div>
    </main>

    <script src="/seguranca.js"></script>
    <script src="/ui/shell.js"></script>
    <script>
        let produtos = [];
        let categorias = [];
        let marcas = [];
        let pagina = 0;
        const POR_PAGINA = 25;

        function formatarMoeda(valor) {
            return Number(valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function obterOperador() { return JG.operador(); }

        function bloquearCaixa() {
            const op = obterOperador();
            if (!op) { window.location.href = '/login.html'; return true; }
            if (op.papel === 'SELLER') { window.location.href = '/'; return true; }
            return false;
        }

        async function api(url, metodo = 'GET', corpo = null) {
            const opcoes = { method: metodo, headers: { 'Content-Type': 'application/json' } };
            if (corpo) opcoes.body = JSON.stringify(corpo);
            const response = await fetch(url, opcoes);
            if (response.status === 401) {
                localStorage.removeItem('jg_operador');
                window.location.href = '/login.html';
                throw new Error('Sessão expirada.');
            }
            const dados = await response.json();
            if (!response.ok) throw new Error(dados.erro || 'Erro na requisição');
            return dados;
        }

        bloquearCaixa();

        async function carregarFiltros() {
            try { categorias = await api('/api/categorias'); } catch (e) { categorias = []; }
            try { marcas = await api('/api/marcas'); } catch (e) { marcas = []; }
            document.getElementById('f-categoria').innerHTML = '<option value="">Todas as categorias</option>' + categorias.map(c => `<option value="${esc(c.id)}">${esc(c.nome)}</option>`).join('');
            document.getElementById('f-marca').innerHTML = '<option value="">Todas as marcas</option>' + marcas.map(m => `<option value="${esc(m.id)}">${esc(m.nome)}</option>`).join('');
        }

        async function buscarProdutos() {
            const busca = document.getElementById('busca').value.trim();
            const url = busca ? `/api/produtos?busca=${encodeURIComponent(busca)}` : '/api/produtos';
            try {
                produtos = await api(url);
                pagina = 0;
                renderizarProdutos();
            } catch (e) { alert(e.message); }
        }

        function estoqueBaixo(p) { return p.minimo > 0 && p.estoque <= p.minimo; }

        function filtrados() {
            const cat = document.getElementById('f-categoria').value;
            const mar = document.getElementById('f-marca').value;
            const sit = document.getElementById('f-situacao').value;
            return produtos.filter(p =>
                (!cat || p.categoriaId === cat) && (!mar || p.marcaId === mar) &&
                (!sit || (sit === 'ativo' && p.ativo) || (sit === 'inativo' && !p.ativo) || (sit === 'baixo' && estoqueBaixo(p))));
        }

        function renderizarProdutos() {
            const tbody = document.getElementById('tabela-produtos');
            const lista = filtrados();
            const total = lista.length;
            document.getElementById('contador').textContent = `${produtos.length.toLocaleString('pt-BR')} produto(s) cadastrado(s)`;
            if (total === 0) {
                tbody.innerHTML = `<tr><td colspan="10"><div class="estado-vazio"><span class="ms">inventory_2</span><p>${produtos.length ? 'Nenhum produto com esses filtros.' : 'Nenhum produto cadastrado ainda.'}</p><a class="btn btn-sucesso" href="/produto.html"><span class="ms">add</span>Novo produto</a></div></td></tr>`;
                document.getElementById('pag-info').textContent = '';
                return;
            }
            const maxPag = Math.max(0, Math.ceil(total / POR_PAGINA) - 1);
            pagina = Math.min(pagina, maxPag);
            const ini = pagina * POR_PAGINA;
            const pag = lista.slice(ini, ini + POR_PAGINA);
            document.getElementById('pag-info').textContent = `${ini + 1}–${ini + pag.length} de ${total.toLocaleString('pt-BR')}`;
            document.getElementById('pag-ant').disabled = pagina === 0;
            document.getElementById('pag-prox').disabled = pagina >= maxPag;
            tbody.innerHTML = pag.map(p => {
                const margem = p.preco > 0 ? (p.preco - p.custo) / p.preco * 100 : 0;
                const grade = (p.variantes || []).length;
                const estoque = estoqueBaixo(p)
                    ? `<span class="badge ${p.estoque <= 0 ? 'vencido' : 'baixo'}" title="Mínimo: ${p.minimo}">${p.estoque} un</span>`
                    : `<b>${p.estoque}</b> <small>un</small>`;
                const mini = p.foto
                    ? `<img class="miniatura" src="${esc(p.foto)}" alt="">`
                    : `<span class="miniatura"><span class="ms sm">image</span></span>`;
                return `<tr>
                    <td><div class="cel-prod">${mini}<div><b>${esc(p.nome)}</b><small>${esc([p.sku, p.colecao, grade ? grade + ' variações' : ''].filter(Boolean).join(' · '))}</small></div></div></td>
                    <td class="num">${esc(p.codigo || '—')}</td>
                    <td>${esc(p.categoria || '—')}</td>
                    <td>${esc(p.marca || '—')}</td>
                    <td class="right">${formatarMoeda(p.preco)}</td>
                    <td class="right">${formatarMoeda(p.custo)}</td>
                    <td class="right ${margem >= 0 ? 'txt-verde' : 'txt-vermelho'}">${margem.toFixed(1).replace('.', ',')}%</td>
                    <td class="right">${estoque}</td>
                    <td><span class="badge ${p.ativo ? 'ativo' : 'inativo'}">${p.ativo ? 'Ativo' : 'Inativo'}</span></td>
                    <td class="acoes">
                        <a class="btn-icone" title="Editar" href="/produto.html?id=${encodeURIComponent(p.id)}"><span class="ms">edit</span></a>
                        <a class="btn-icone" title="Duplicar" href="/produto.html?duplicar=${encodeURIComponent(p.id)}"><span class="ms">content_copy</span></a>
                        <button class="btn-icone perigo" title="Excluir" onclick="excluirProduto('${p.id}', '${esc(p.nome)}')"><span class="ms">delete</span></button>
                    </td>
                </tr>`;
            }).join('');
        }

        function limparFiltros() {
            ['busca', 'f-categoria', 'f-marca', 'f-situacao'].forEach(id => document.getElementById(id).value = '');
            buscarProdutos();
        }

        async function excluirProduto(id, nome) {
            if (!confirm(`Excluir o produto "${nome}"?`)) return;
            try {
                await api(`/api/produtos/${id}`, 'DELETE');
                JG.toast('Produto excluído.', 'sucesso');
                await buscarProdutos();
            } catch (e) { alert(e.message); }
        }

        document.getElementById('busca').addEventListener('keydown', (e) => { if (e.key === 'Enter') buscarProdutos(); });
        let atraso = null;
        document.getElementById('busca').addEventListener('input', () => { clearTimeout(atraso); atraso = setTimeout(buscarProdutos, 350); });
        ['f-categoria', 'f-marca', 'f-situacao'].forEach(id => document.getElementById(id).addEventListener('change', () => { pagina = 0; renderizarProdutos(); }));
        document.getElementById('pag-ant').onclick = () => { pagina--; renderizarProdutos(); };
        document.getElementById('pag-prox').onclick = () => { pagina++; renderizarProdutos(); };

        (async () => {
            const qs = new URLSearchParams(location.search);
            if (qs.get('novo')) { location.href = '/produto.html'; return; }
            if (qs.get('busca')) document.getElementById('busca').value = qs.get('busca');
            if (qs.get('situacao')) document.getElementById('f-situacao').value = qs.get('situacao');
            try {
                await carregarFiltros();
                await buscarProdutos();
            } catch (e) {
                alert("Falha ao carregar dados: " + e.message);
            }
        })();
    </script>
</body>
</html>
