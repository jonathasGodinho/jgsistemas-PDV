<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Cobrança - JG Sistemas</title>
    <style>
        .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        @media (max-width: 600px) { .cards { grid-template-columns: 1fr; } }
        .card { background: white; border: 1px solid #ccd1d9; border-left: 4px solid #d9534f; border-radius: 4px; padding: 14px; }
        .card .valor { font-size: 26px; font-weight: bold; color: #0b2545; }
        .card .rotulo { font-size: 11px; color: #656d78; text-transform: uppercase; font-weight: bold; }
        .campo { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .campo label { font-size: 11px; color: #656d78; font-weight: bold; text-transform: uppercase; }
        .campo input, .campo select { padding: 9px; font-size: 14px; border: 1px solid #aab2bd; border-radius: 4px; color: #134074; width: 100%; }
        .linha { display: flex; gap: 10px; align-items: flex-end; }
        .linha .campo { flex: 1; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 3px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .b-vermelho { background: #f8d7da; color: #b02a37; }
        .b-amarelo { background: #fde8c8; color: #b26b00; }
        .modal-fundo { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 50; }
        .modal-fundo.aberto { display: flex; }
        .modal h3 { color: #134074; margin-bottom: 12px; }
        .expansivel { cursor: pointer; }
        .linha-venda { background: #f8f9fa; }
        .linha-venda td { font-size: 12px; color: #555; }
    </style>
    <link rel="stylesheet" href="/ui/jg.css">
</head>
<body class="jg" data-pagina="cobranca">
    <main>
        <div class="page-head">
            <div><h1>Cobrança</h1><div class="sub">Clientes inadimplentes, contato e renegociação de parcelas</div></div>
            <div class="acoes"><a class="btn" href="/clientes.html?inadimplentes=1"><span class="ms">group</span>Ver clientes</a></div>
        </div>
        <div class="cards">
            <div class="card">
                <div class="rotulo">Clientes inadimplentes</div>
                <div class="valor" id="card-total">—</div>
            </div>
            <div class="card">
                <div class="rotulo">Total em aberto</div>
                <div class="valor" id="card-aberto">—</div>
            </div>
        </div>

        <div class="painel">
            <div class="painel-titulo"><span>Inadimplentes</span><button class="btn btn-mini btn-azul" onclick="carregarInadimplencia()">Atualizar</button></div>
            <div class="painel-corpo" style="padding:0;">
                <table>
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Contato</th>
                            <th style="text-align:right;">Atraso máx.</th>
                            <th style="text-align:right;">Parcelas</th>
                            <th style="text-align:right;">Total</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-inadimplentes">
                        <tr><td colspan="5" class="sem-dados">Carregando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal-fundo" id="modal-renegociar">
        <div class="modal">
            <h3 id="modal-titulo">Renegociar Venda</h3>
            <div class="campo">
                <label>1ª parcela vence em</label>
                <input type="date" id="r-data">
            </div>
            <div class="linha">
                <div class="campo">
                    <label>Nº de parcelas</label>
                    <input type="number" id="r-parcelas" min="1" max="24" value="6">
                </div>
                <div class="campo">
                    <label>Juros (%)</label>
                    <input type="number" id="r-juros" step="0.01" min="0" value="0">
                </div>
            </div>
            <div class="campo">
                <label>Senha do administrador *</label>
                <input type="password" id="r-senha" placeholder="Obrigatória">
            </div>
            <div style="display:flex; gap:10px; margin-top:6px;">
                <button class="btn btn-azul" style="flex:1;" onclick="fecharModal()">Cancelar</button>
                <button class="btn btn-verde" style="flex:1;" onclick="renegociar()">Renegociar</button>
            </div>
        </div>
    </div>
    <script src="/seguranca.js"></script>
    <script src="/ui/shell.js"></script>
    <script>
        const API_BASE = '';

        function obterOperador() {
            try {
                const raw = localStorage.getItem('jg_operador');
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }
        function tokenAuth() {
            const op = obterOperador();
            return op && op.token ? { 'Authorization': 'Bearer ' + op.token } : {};
        }
        function bloquear() {
            const op = obterOperador();
            if (!op) { window.location.href = '/login.html'; return true; }
            if (op.papel === 'SELLER') { window.location.href = '/'; return true; }
            return false;
        }
        async function api(url, metodo = 'GET', corpo = null) {
            const opcoes = { method: metodo, headers: Object.assign({ 'Content-Type': 'application/json' }, tokenAuth()) };
            if (corpo) opcoes.body = JSON.stringify(corpo);
            const response = await fetch(`${API_BASE}${url}`, opcoes);
            if (response.status === 401) {
                localStorage.removeItem('jg_operador');
                window.location.href = '/login.html';
                throw new Error('Sessão expirada.');
            }
            const dados = await response.json();
            if (!response.ok) throw new Error(dados.erro || 'Erro na requisição');
            return dados;
        }
        bloquear();

        let vendaRenegociando = null;

        function hoje() {
            return new Date().toISOString().slice(0, 10);
        }

        async function carregarInadimplencia() {
            try {
                const r = await api('/api/relatorios/inadimplencia');
                document.getElementById('card-total').innerText = r.totalInadimplentes;
                document.getElementById('card-aberto').innerText = `R$ ${Number(r.totalEmAberto).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

                const tbody = document.getElementById('tabela-inadimplentes');
                if (r.clientes.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="sem-dados">Nenhum cliente inadimplente 🎉</td></tr>';
                    return;
                }

                tbody.innerHTML = r.clientes.map(c => `
                    <tr class="expansivel" onclick="toggleVendas('${c.clienteId}')">
                        <td><strong>${esc(c.nome)}</strong></td>
                        <td>${esc(c.celular ?? '—')}</td>
                        <td style="text-align:right;"><span class="badge b-vermelho">${c.maiorAtraso}d</span></td>
                        <td style="text-align:right;">${c.qtdParcelas}</td>
                        <td style="text-align:right;">R$ ${Number(c.total).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                    </tr>
                    <tr id="vendas-${c.clienteId}" style="display:none;">
                        <td colspan="5" style="padding:0;">
                            <table style="border:none;">
                                ${c.vendas.map(v => `
                                    <tr class="linha-venda">
                                        <td>Venda ${esc(v.numero ?? '—')}</td>
                                        <td><span class="badge b-amarelo">${v.maiorAtraso}d</span></td>
                                        <td style="text-align:right;">${v.qtdParcelas} parc.</td>
                                        <td style="text-align:right;"><strong>R$ ${Number(v.total).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</strong></td>
                                        <td style="text-align:center;">
                                            <button class="btn btn-mini btn-verde" onclick="abrirRenegociar('${v.vendaId}', '${esc(v.numero)}', ${v.total})">Renegociar</button>
                                        </td>
                                    </tr>`).join('')}
                            </table>
                        </td>
                    </tr>`).join('');
            } catch (e) { alert(e.message); }
        }

        function toggleVendas(clienteId) {
            const el = document.getElementById('vendas-' + clienteId);
            el.style.display = el.style.display === 'none' ? '' : 'none';
        }

        function abrirRenegociar(vendaId, numero, total) {
            vendaRenegociando = vendaId;
            document.getElementById('modal-titulo').innerText = `Renegociar Venda ${numero} (R$ ${Number(total).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })})`;
            document.getElementById('r-data').value = hoje();
            document.getElementById('r-parcelas').value = '6';
            document.getElementById('r-juros').value = '0';
            document.getElementById('r-senha').value = '';
            document.getElementById('modal-renegociar').classList.add('aberto');
        }

        function fecharModal() {
            document.getElementById('modal-renegociar').classList.remove('aberto');
            vendaRenegociando = null;
        }

        async function renegociar() {
            if (!vendaRenegociando) return;
            const senhaAdmin = document.getElementById('r-senha').value;
            if (!senhaAdmin) { alert('Informe a senha do administrador!'); return; }
            try {
                const r = await api(`/api/crediario/${vendaRenegociando}/renegociar`, 'POST', {
                    novaPrimeiraData: document.getElementById('r-data').value,
                    parcelas: Number(document.getElementById('r-parcelas').value) || 1,
                    jurosPercent: Number(document.getElementById('r-juros').value) || 0,
                    senhaAdmin
                });
                alert(`Renegociação concluída!\nNovo total: R$ ${Number(r.novoTotal).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} em ${r.parcelas}x`);
                fecharModal();
                carregarInadimplencia();
            } catch (e) { alert(e.message); }
        }

        carregarInadimplencia();
    </script>
</body>
</html>
